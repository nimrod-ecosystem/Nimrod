name=NimrodLink
version=1.0.0
author=Nimrod Ecosystem
maintainer=Nimrod Ecosystem
sentence=Hand an append-only stream of bytes to a collector in the room, over BLE, resumably.
paragraph=For a datalogger that is only intermittently in range of anything. Every chunk carries its own offset so a dropped packet costs one re-request rather than the transfer, and a collector can resume from any offset at any time. Format-agnostic: it never parses your records, so your layout is yours. Wire format documented at docs/nimrod-link-protocol.md.
category=Communication
