# /etc/systemd/journald.conf.d/50-nimrod-persistent.conf
# Keep the log across power cuts (Mike, 2026-10-08), so a screen that went dark or offline can be asked why
# afterwards. Raspberry Pi OS keeps it in memory only (40-rpi-volatile-storage.conf); this later file wins.
# Capped so it can't fill the SD card or wear it out: 100 MB at most, two months at most.
[Journal]
Storage=persistent
SystemMaxUse=100M
SystemKeepFree=1G
MaxRetentionSec=2month
