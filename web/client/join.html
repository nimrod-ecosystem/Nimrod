<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Somebody wants to connect with you, or set up a profile for you. Sign in with your own login.">
<meta name="robots" content="noindex">
<title>An invitation — Nimrod</title>
<link rel="icon" type="image/svg+xml" href="/design-assets/nimrod-mark-favicon.svg">
<link rel="stylesheet" href="./layers.css">
<style>
  /* A PHONE, OPENED FROM A TEXT MESSAGE (pair.html's shape): one column, big targets, theme variables only. */
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font:17px/1.5 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  #app { min-height:100vh; box-sizing:border-box; display:flex; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
  .jp { width:100%; max-width:30rem; box-sizing:border-box; display:flex; flex-direction:column; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; align-self:flex-start; }
  .jp-title { font-size:1.35rem; margin:0; color:var(--text-strong, var(--text)); overflow-wrap:anywhere; }
  .jp-body, .jp-note { margin:0; }
  .jp-note { color:var(--text-soft, var(--text)); }
  .jp-list { margin:0; padding-left:1.2em; }
  .jp-btn { display:flex; align-items:center; justify-content:center; box-sizing:border-box; min-height:52px; width:100%;
    padding:0 18px; border-radius:14px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text);
    font:700 1.05rem/1.2 inherit; cursor:pointer; text-decoration:none; }
  .jp-go { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .jp-btn:focus-visible, .jp-other:focus-visible { outline:3px solid var(--focus, var(--accent)); outline-offset:2px; }
  .jp-other { color:var(--link, var(--text)); min-height:44px; display:flex; align-items:center; }
  .jp-opt { display:flex; align-items:center; gap:10px; min-height:48px; cursor:pointer; }
  .jp-opt input { width:1.4rem; height:1.4rem; flex:0 0 auto; accent-color:var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { applyTheme, getStoredTheme, resolveThemeId } from './theme.js';
  import { mountJoinPage } from './join_page.js';
  applyTheme(document.documentElement, resolveThemeId(getStoredTheme()));
  const page = mountJoinPage(document.getElementById('app'));
  window.__join = page;
</script>
</body>
</html>
