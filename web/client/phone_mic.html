<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Use this phone as a microphone for a screen. Sends sound only, and shows when it is on.">
<meta name="robots" content="noindex">
<title>Phone microphone — Nimrod</title>
<link rel="icon" type="image/svg+xml" href="/design-assets/nimrod-mark-favicon.svg">
<link rel="stylesheet" href="./layers.css">
<!-- The module stylesheet: this page can show a module (the clock) beside the microphone. -->
<link rel="stylesheet" href="./modules.css">
<style>
  /* Theme variables only; nothing here chooses a colour. The LIVE state is the accent pair the
     theme derives (`--accent-warm-deep` with its computed `--on-accent-warm-deep`), so "on" reads
     on every theme and looks nothing like "off". */
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font:17px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  #app { min-height:100vh; box-sizing:border-box;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
  #app[data-live="1"] { background:var(--accent-warm-deep); color:var(--on-accent-warm-deep); }
  .pm { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .pm h1 { font-size:1.35rem; margin:0; }
  .pm-lead, .pm-note { margin:0; color:var(--text-soft); }
  .pm-ended { margin:0; padding:10px 12px; border-radius:10px; background:var(--surface-alt); color:var(--text); font-weight:600; }
  .pm-field { display:flex; flex-direction:column; gap:6px; font-weight:600; }
  .pm-field i { font-weight:400; color:var(--text-soft); }
  .pm-field select, .pm-field input { min-height:48px; font:inherit; padding:0 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .pm-btn { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 18px;
    border-radius:14px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text);
    font:700 1rem/1.2 inherit; cursor:pointer; text-decoration:none; }
  .pm-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .pm-big { min-height:72px; font-size:1.15rem; width:100%; }
  .pm-help { border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface); }
  .pm-help summary { font-weight:700; cursor:pointer; min-height:32px; }
  .pm-help p { margin:.6em 0 0; }

  /* ---- live ------------------------------------------------------------------------------
     THE BAR AND THE FRAME. One element, shown in the TOP LAYER (popover="manual", no light
     dismiss) so no module can draw over it. It is a frame around the whole screen that takes no
     presses, with the bar across its top that does. Where popovers are unsupported it is simply
     fixed at the highest band. FIXED SIZES, ARGUED: the frame (8px) and the bar's Stop (56px tall)
     are what "unmistakable" and "one press" mean on a phone across a room; they are not a taste
     somebody tunes, and a setting that could make the frame 0px would undo the point. Listed for
     Mike rather than made a setting. */
  #app[data-view="live"] { padding-top:calc(var(--pm-bar-h, 76px) + 12px); }
  #app[data-view="live"] .pm { max-width:none; min-height:calc(100vh - var(--pm-bar-h, 76px) - 44px); }
  .pm-onair { position:fixed; inset:0; width:auto; height:auto; margin:0; padding:0; overflow:visible;
    background:transparent; color:var(--on-accent-warm-deep); pointer-events:none;
    border:8px solid var(--accent-warm-deep); box-sizing:border-box;
    z-index:calc(var(--z-cursor, 700) + 100); }
  .pm-onair:not([popover]), .pm-onair:popover-open { display:block; }
  .pm-bar { pointer-events:auto; display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 10px; margin:-8px -8px 0;
    background:var(--accent-warm-deep); color:var(--on-accent-warm-deep); }
  .pm-dot { flex:0 0 auto; width:18px; height:18px; border-radius:50%; border:3px solid currentColor;
    box-sizing:border-box; background:currentColor; }
  #app[data-live="0"] .pm-dot { background:transparent; }
  .pm-bar-text { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; line-height:1.2; }
  .pm-bar-word { font-size:1.2rem; font-weight:800; }
  .pm-bar-who { font-size:.95rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pm-stop { flex:0 0 auto; min-height:56px; min-width:96px; font-size:1.1rem;
    background:var(--surface); color:var(--text); border-color:var(--surface); }

  .pm-stage { display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0; }
  /* THE MODULE'S BOX. `contain: layout paint` makes it the containing block even for a module's
     `position:fixed` children and clips everything it draws to the box; `isolation` keeps its
     z-indexes inside. An ordinary surface, so the module looks like itself inside the warm frame. */
  .pm-show { position:relative; flex:1 1 auto; min-height:220px; border-radius:14px; overflow:hidden;
    contain:layout paint; isolation:isolate; background:var(--surface); color:var(--text); }
  .pm-show > .pm-mod { position:absolute; inset:0; }
  .pm-show > .pm-note, .pm-mod-failed { margin:0; padding:24px 16px; text-align:center; color:var(--text); font-weight:600; }
  .pm-notes { display:flex; flex-direction:column; gap:6px; }
  .pm-notes p { margin:0; }
  .pm-live { display:flex; flex-direction:column; gap:10px; text-align:center; padding:6vh 0 4vh; }
  .pm-live-word { font-size:clamp(34px, 11vw, 64px); font-weight:800; line-height:1.05; }
  .pm-live-who { font-size:1.25rem; font-weight:700; }
  .pm-live-note { font-size:1rem; font-weight:600; }
</style>
</head>
<body>
<div id="app" data-live="0"></div>
<script type="module">
  import { applyTheme, getStoredTheme, resolveThemeId } from './theme.js';
  import { mountPhoneMic } from './phone_mic_page.js';
  applyTheme(document.documentElement, resolveThemeId(getStoredTheme()));
  mountPhoneMic(document.getElementById('app'))
    .then((page) => { window.__phoneMic = page; })
    .catch((err) => { console.error('phone mic: failed to start', err); });
</script>
</body>
</html>
