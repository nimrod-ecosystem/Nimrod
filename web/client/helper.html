<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimrod — Get the Nimrod helper for this computer</title>
<link rel="icon" type="image/svg+xml" href="/design-assets/nimrod-mark-favicon.svg">
<link rel="stylesheet" href="./layers.css">
<style id="nh-style"></style>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px}
  .nh-foot{max-width:44rem;margin:24px auto 0;font-size:.9rem;color:var(--text-muted)}
  .nh-foot a{color:var(--link)}
</style>
</head>
<body>
<!--
  THE NIMROD HELPER'S PAGE (DECISIONS 2026-10-07 item 3). What the one install package carries, what it does,
  that what it hears and sees stays on the computer, and how to remove it. Linked from the ⚙ menu when a
  screen finds no speech program (page_links.js 'helper'). Works signed out: nothing here needs an account.
  Its words are nimrod_helper.js helperPageHTML, so the suite reads what a visitor reads. Colours come only
  from the theme (theme.js applyTheme), never from this file.
-->
<main id="root"></main>
<p class="nh-foot"><a href="/home.html">Your dashboards</a></p>
<script type="module">
  import { mountHelperPage, HELPER_STYLE } from './nimrod_helper.js';
  import { createProfilesClient, resolveTheme } from './profile.js';
  import { applyTheme, DEFAULT_THEME } from './theme.js';
  import { authHeaders } from './auth.js';

  applyTheme(document.documentElement, DEFAULT_THEME);
  document.getElementById('nh-style').textContent = HELPER_STYLE;
  (async () => {
    try {
      const me = await fetch('/api/me', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
      if (!me) return;
      const theme = await resolveTheme(createProfilesClient({ user: me.user }), me.user);
      if (theme) applyTheme(document.documentElement, theme);
    } catch { /* offline or signed out -- the default theme already stands */ }
  })();
  window.nimrodHelperPage = mountHelperPage(document.getElementById('root'));
</script>
</body>
</html>
