<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimrod — your screens</title>
<style>
  :root{
    --darkgreen:#0A3323; --moss:#839958; --beige:#F7F4D5; --rosy:#D3968C; --midnight:#105666;
    --bg:#F7F4D5; --cream-soft:#FBF9E9; --card:#FFFFFF; --ink:#0A3323; --ink-soft:#3c5346;
    --muted:#5d7064; --line:#e4e0c2; --rosy-deep:#a85f52; --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
  .home{max-width:880px}

  /* ---- the shell: sidebar + one panel ---- */
  .shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  .s-side{display:flex;flex-direction:column;gap:18px;padding:20px 14px;
    background:var(--cream-soft);border-right:1px solid var(--line)}
  .s-brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;padding:0 8px}
  .s-brand span{color:var(--rosy-deep)}
  .s-nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
  .s-navb{width:100%;text-align:left;padding:9px 11px;border:0;border-radius:9px;background:transparent;
    color:var(--ink-soft);font:inherit;font-size:.93rem;font-weight:600;cursor:pointer}
  .s-navb:hover{background:rgba(0,0,0,.05);color:var(--ink)}
  .s-navb.on{background:var(--moss);color:#fff}
  .s-foot{margin-top:auto;padding:0 8px;font-size:.8rem;display:flex;flex-direction:column;gap:4px}
  .s-email{color:var(--muted);word-break:break-all}
  .s-signout{color:var(--midnight)}
  .s-main{padding:22px 26px 64px;max-width:900px}


  /* ---- adulting ---- */
  .adulting h1{font-size:1.6rem;margin:0 0 .25em;letter-spacing:-.01em}
  .adulting .a-lead{margin:0 0 16px;color:var(--ink-soft);max-width:62ch}
  .adulting .a-who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .adulting .a-chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .adulting .a-chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
  .adulting .a-note{font-size:.85rem;color:var(--muted)}
  .adulting .a-host{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;max-width:560px}
  /* ---- composer ---- */
  .composer h1{font-size:1.6rem;margin:0 0 .25em;letter-spacing:-.01em}
  .composer .c-lead{margin:0 0 16px;color:var(--ink-soft);max-width:62ch}
  .composer .c-screens,.composer .c-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .composer .c-chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .composer .c-chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
  .composer .c-msg{min-height:1.3em;font-size:.85rem;font-weight:600;color:var(--midnight);margin-bottom:8px}
  .composer .c-msg.bad{color:var(--rosy-deep)}
  .composer .c-grid{gap:8px;aspect-ratio:16/9;width:100%;max-width:620px;margin-bottom:10px;
    background:var(--cream-soft);border:1px solid var(--line);border-radius:12px;padding:8px}
  .composer .c-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}
  .composer .c-slot-n{position:absolute;top:5px;left:8px;font-size:.66rem;font-weight:800;color:var(--muted)}
  .composer .c-slot-name{font-size:.85rem;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:100%}
  .composer .c-empty{color:var(--muted);font-weight:500}
  .composer .c-pick{max-width:92%;padding:4px 6px;border:1px solid var(--line);border-radius:7px;
    background:var(--card);color:var(--ink);font:inherit;font-size:.76rem}
  .composer .c-note{font-size:.8rem;color:var(--muted);margin:0 0 12px}
  .composer .c-actions{display:flex;gap:8px;flex-wrap:wrap}
  .composer .c-btn{padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .composer .c-btn:hover:not(:disabled){background:var(--cream-soft)}
  .composer .c-btn:disabled{opacity:.45;cursor:not-allowed}
  .composer .c-primary{background:var(--moss);border-color:var(--moss);color:#fff}

  @media (max-width:720px){
    .shell{grid-template-columns:1fr}
    .s-side{flex-direction:row;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);
      padding:10px 14px;flex-wrap:wrap}
    .s-nav{flex-direction:row}
    .s-foot{margin-top:0;margin-left:auto;flex-direction:row;gap:10px;align-items:center}
    .s-email{display:none}
    .s-main{padding:16px}
  }


  .h-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--line)}
  .h-brand{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
  .h-brand span{color:var(--rosy-deep)}
  .h-who{display:flex;align-items:center;gap:12px;font-size:.85rem}
  .h-email{color:var(--muted)}
  .h-signout{color:var(--midnight)}

  .h-intro{margin:26px 0 18px}
  .h-intro h1{font-size:1.8rem;margin:0 0 .3em;letter-spacing:-.01em}
  .h-intro p{margin:0;color:var(--ink-soft);max-width:60ch}

  .h-new{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .h-new input{flex:1 1 260px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
  .h-btn{padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .h-btn:hover:not(:disabled){background:var(--cream-soft)}
  .h-btn:disabled{opacity:.45;cursor:not-allowed}
  .h-primary{background:var(--moss);border-color:var(--moss);color:#fff}
  .h-primary:hover:not(:disabled){filter:brightness(.93);background:var(--moss)}

  .h-msg{min-height:1.4em;font-size:.85rem;font-weight:600;color:var(--midnight);margin-bottom:10px}
  .h-msg.bad{color:var(--rosy-deep)}

  .h-list{display:flex;flex-direction:column;gap:12px}
  .h-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .h-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .h-card-head h2{font-size:1.15rem;margin:0}
  .h-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .h-quiet{font-weight:500;font-size:.82rem;padding:7px 11px;color:var(--ink-soft)}
  .h-danger:hover:not(:disabled){background:#fbecea;border-color:var(--rosy);color:var(--rosy-deep)}
  .h-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .h-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:99px;
    background:var(--cream-soft);border:1px solid var(--line);font-size:.8rem;font-weight:600}
  .h-x{border:0;background:transparent;color:var(--muted);font:inherit;font-size:1rem;line-height:1;
    cursor:pointer;padding:0 5px;border-radius:99px}
  .h-x:hover{color:var(--rosy-deep);background:rgba(0,0,0,.05)}
  .h-none,.h-hint{font-size:.8rem;color:var(--muted)}
  /* Inputs panel. The table is dense on purpose: a clinician comparing four bindings
     wants them on one screen, not in four expanding cards. */
  .i-gate{display:flex;gap:8px;flex-wrap:wrap}
  .i-devs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:.9rem}
  .i-devs code{font-size:.8rem;background:var(--cream-soft);padding:1px 5px;border-radius:5px}
  .i-tab{width:100%;border-collapse:collapse;font-size:.85rem;margin:4px 0 10px}
  .i-tab th{text-align:left;font-weight:600;color:var(--muted);font-size:.75rem;
    text-transform:uppercase;letter-spacing:.05em;padding:0 8px 6px 0;white-space:nowrap}
  .i-tab td{padding:4px 8px 4px 0;vertical-align:middle;border-top:1px solid var(--line)}
  .i-tab select,.i-tab input{font:inherit;font-size:.85rem;padding:4px 6px;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--ink);max-width:15ch}
  .i-tab input[type=number]{width:7ch}
  .i-ctl{padding:4px 9px;font-size:.8rem;white-space:nowrap}
  .i-stale{background:rgba(164,36,59,.06)}
  .i-warn{color:var(--rosy-deep);font-size:.8rem}
  .i-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .i-add select{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink)}
  .i-log{display:grid;gap:3px;max-height:230px;overflow:auto;font-size:.85rem;margin-top:6px}
  .i-log>div{padding:3px 8px;border-radius:6px;background:var(--cream-soft)}
  /* Output routing grid. Verbs down, channels across — the shape of someone's whole
     setup on one screen, which a card-per-verb layout cannot show. */
  .o-tab{width:100%;border-collapse:collapse;font-size:.85rem;margin:6px 0 4px}
  .o-tab th{text-align:left;font-weight:600;padding:0 8px 8px 0;vertical-align:bottom}
  .o-tab thead th{font-size:.75rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;text-align:center;min-width:5.5rem}
  .o-tab tbody th{border-top:1px solid var(--line);padding:9px 12px 9px 0;font-weight:400}
  .o-tab tbody th b{display:block;font-weight:700}
  .o-tab tbody th .h-hint{display:block;line-height:1.35}
  .o-tab td{border-top:1px solid var(--line);text-align:center;padding:9px 4px}
  .o-cell{display:inline-flex;padding:6px;cursor:pointer}
  .o-cell input{width:19px;height:19px;accent-color:var(--moss);cursor:pointer}
  .o-cell input:disabled{cursor:not-allowed;opacity:.35}
  .o-tab .o-off{opacity:.45}
  .o-nowhere{background:rgba(164,36,59,.06)}
  .o-warn{display:inline-block;margin-top:3px;font-size:.72rem;font-weight:700;color:var(--rosy-deep)}
  .o-chans{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px;font-size:.9rem}
  .o-chans li{display:flex;align-items:center;gap:10px}
  .o-chans li b{min-width:9rem}
  .o-chans .o-off{opacity:.5}
  .o-stage{display:grid;gap:5px;margin:10px 0}
  .out-msg{padding:8px 12px;border-radius:9px;background:var(--cream-soft);
    border-left:3px solid var(--line);font-size:.9rem}
  .out-alert{border-left-color:var(--rosy-deep);font-weight:700}
  .out-notify{border-left-color:var(--moss)}
  .out-status{border-left-color:var(--muted);opacity:.85}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (max-width:760px){
    .o-tab thead th{min-width:0;font-size:.62rem}
    .o-tab tbody th{padding-right:6px}
    .o-cell{padding:3px}
  }
  .i-ok{border-left:3px solid var(--moss)}
  .i-no{border-left:3px solid var(--rosy-deep);color:var(--ink-soft)}
  @media (max-width:760px){
    .i-tab,.i-tab tbody,.i-tab tr,.i-tab td{display:block;width:100%}
    .i-tab thead{display:none}
    .i-tab tr{border-top:1px solid var(--line);padding:8px 0}
    .i-tab td{border:0;padding:2px 0}
    .i-tab select,.i-tab input{max-width:none;width:100%}
  }
  .h-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    padding:10px 18px;background:var(--cream-soft);border-bottom:1px solid var(--line);
    font-size:.92rem}
  .h-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* the arranger, folded into the screen it arranges */
  .h-arrange{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px}
  .h-arrange-body{margin-top:10px}
  .h-arrange-body[hidden]{display:none}
  .composer.c-embedded h1{display:none}
  .composer.c-embedded .c-lead{margin-top:0}
  .h-add select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.85rem}
  .h-empty,.h-loading{color:var(--muted);text-align:center;padding:28px;background:var(--card);
    border:1px dashed var(--line);border-radius:var(--radius)}

  @media (max-width:520px){
    .h-card-head{flex-direction:column;align-items:stretch}
    .h-actions{display:grid;grid-template-columns:1fr 1fr}
    .h-actions .h-primary{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div id="banner"></div>
<div id="root"><p class="h-loading" style="max-width:880px;margin:40px auto">Loading…</p></div>

<script type="module">
import { createProfilesClient } from './profile.js';
import { createState } from './state.js';
import { createEvents } from './events.js';
import { createBus } from './bus.js';
import { createLocalBackend, seedStarterScreen } from './local_store.js';
import { authHeaders } from './auth.js';
import { listManifests } from './module.js';
import { mountHome } from './home.js';

// Importing a module registers it, which is what puts it in the "Add module" picker.
// This list IS the catalog a person can choose from.
import './modules/clock.js';
import './modules/camera.js';
import './modules/photos.js';
import './modules/youtube.js';
import './modules/personal.js';
import './modules/educational.js';
import './modules/director.js';
import './modules/sprint.js';
import './modules/quests.js';
import './modules/progress.js';
import './modules/wordforge.js';
import './modules/lessons.js';
import './modules/algebra.js';

const root = document.getElementById('root');

// The Adulting board namespaces its own state key as `adulting-board:<profileId>`, so the
// profile can be recovered from the key when no explicit one is passed.
const keyPid = (key) => String(key).split(':')[1] || '';

// Signed in? A Google session cookie rides along automatically; a paired device key works
// too. 401 is NOT a dead end: the whole page runs against browser storage instead, so
// someone can try the real thing before deciding to hand over an email address. Signing in
// is then an upgrade — keep this, and use it on your other devices — rather than a gate.
function localBanner() {
  document.getElementById('banner').innerHTML = `
    <div class="h-banner">
      <span><b>You're not signed in.</b> Everything here is saved on this device only —
        close the browser and it stays, but it won't follow you to another one.</span>
      <a class="h-btn h-primary" href="/auth/login">Sign in to keep it</a>
    </div>`;
}

(async () => {
  let me = null;
  let signedIn = false;
  try {
    const r = await fetch('/api/me', { headers: authHeaders(new URLSearchParams(location.search).get('user')) });
    if (r.status === 401) { me = null; }
    else if (!r.ok) throw new Error(`/api/me -> ${r.status}`);
    else { me = await r.json(); signedIn = true; }
  } catch (e) {
    root.innerHTML = '<p class="h-loading" style="max-width:880px;margin:40px auto">' +
      'Could not reach the server. It will retry when the connection returns.</p>';
    setTimeout(() => location.reload(), 6000);
    console.error('home boot failed', e);
    return;
  }

  try {
    // One choice, here: after this line nothing below can tell which backend it got.
    const backend = signedIn ? null : createLocalBackend();
    if (!signedIn) { localBanner(); await seedStarterScreen(backend.profiles); }

    const profiles = signedIn ? createProfilesClient({ user: me.user }) : backend.profiles;
    await mountHome(root, {
      email: signedIn ? (me.email || '') : '',
      signedIn,
      profiles,
      manifests: listManifests(),
      // The composer edits each screen's `settings` blob — the same key the kiosk reads
      // its theme, voice and layout from.
      makeSettings: signedIn
        ? (pid) => createState({ url: profiles.stateURL(pid, 'settings'), user: me.user })
        : backend.makeSettings,
      // The Adulting tab mounts a real module, so it needs the same handle factories a
      // screen gives one. `forPid` lets a mounted module make sibling handles (its points
      // ledger) against the profile it was mounted for.
      user: signedIn ? me.user : null,
      bus: createBus(),
      makeState: signedIn
        ? (key, opts, forPid) =>
            createState({ url: profiles.stateURL(forPid || keyPid(key), key), user: me.user, ...opts })
        : backend.makeState,
      makeEvents: signedIn
        ? (key, opts, forPid) =>
            createEvents({ url: profiles.eventsURL(forPid || keyPid(key), key), user: me.user, ...opts })
        : backend.makeEvents,
      // Input bindings live here rather than against a screen — see profile.js.
      makeUserState: signedIn
        ? (key, opts) => createState({ url: profiles.userStateURL(key), user: me.user, ...opts })
        : backend.makeUserState,
    });
  } catch (e) {
    root.innerHTML = '<p class="h-loading" style="max-width:880px;margin:40px auto">' +
      'Signed in, but your screens could not be loaded. Reload to try again.</p>';
    console.error('home mount failed', e);
  }
})();
</script>
</body>
</html>
