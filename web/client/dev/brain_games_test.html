<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brain games — test</title>
<link rel="stylesheet" href="../modules.css">
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem} h2{font-size:.95rem;margin:16px 0 4px}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #host{position:absolute;left:-9999px;width:800px;height:450px}
</style>
</head>
<body>
<h1>brain games (row 2.45)</h1>
<p>Quick rounds of four kinds: which one is different, remember the order, quick count, what comes next.
Our own questions, on the shared miss flow; one switch, touch or voice; each player at their own level;
nothing timed unless that is turned on.</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>

<script type="module">
import { harness, rig, sleep, fakeTimers } from './quiz_test_rig.js';
import { getManifest, listManifests } from '../module.js';
import '../modules/brain_games.js';
import '../modules/think_games.js';
import '../modules/word_builder.js';
import '../modules/word_games.js';
import { GAME, GAMES, MIX_ORDER, LINES, DEFAULTS, judgeItem, answerOf, orderAnswer, numberOptions, codesFromSpeech, ladderGame } from '../modules/brain_games.js';
import { BANKS, ODD, COUNT, NEXT, ORDER, SHAPE_NAMES, shapeSvg } from '../brain_banks.js';
import { BANKS as THINK } from '../think_banks.js';
import { PUZZLES } from '../word_builder_words.js';
import { UNKNOWN, FLOW_LINES, numberWord } from '../quiz_flow.js';
import { createBus } from '../bus.js';
import { PLAY_STATE_TOPIC } from '../game_start.js';
import { emptyLadder, LADDER_KEY } from '../adaptive_play.js';
import { levelRating } from '../rating.js';
import { auditFields, auditAcross } from '../settings_audit.js';
import { normalizeField } from '../settings_fields.js';

const { check, section, finish } = harness();

function ladderStore(init = {}) {
  let v = { ...init };
  const h = { load: async () => {}, get: () => v, set: (p) => { v = { ...v, ...p }; }, destroy() { h.destroyed = true; }, peek: () => v };
  return h;
}
// The sections written before 2026-10-02's Start button test the game in play (and in the yes / no
// shape they were written for), so `R` opens it started with `answerBy: 'yesno'`; `fresh: true` mounts
// it as it now ships.
const R = (saved = {}, opts = {}) => {
  const store = opts.store || ladderStore();
  const s = opts.fresh ? saved : { autostart: true, answerBy: 'yesno', ...saved };
  const r = rig(GAME, { saved: s, ...opts, extra: { makeState: (k) => (k === LADDER_KEY ? store : null), ...(opts.extra || {}) } });
  return Object.assign(r, { ladder: store, item: () => r.probe().item, st: () => r.inst.impl.__state() });
};
const tap = (r, v) => r.host.querySelector(`[data-pick="${CSS.escape(String(v))}"]`)?.click();
const key = (r, label) => [...r.host.querySelectorAll('.qz-key')].find((b) => b.textContent.trim() === label);
const askText = (r) => r.host.querySelector('.wg-ask')?.textContent.trim() || '';

try {
  section('the banks: our own questions, at five levels');
  {
    const all = Object.values(BANKS).flat();
    check('every id unique, and none shared with the thinking games or the word builder (one ladder per screen)',
      new Set([...all, ...Object.values(THINK).flat(), ...PUZZLES].map((q) => q.id)).size === all.length + Object.values(THINK).flat().length + PUZZLES.length);
    for (const [k, list] of Object.entries(BANKS)) {
      const per = [1, 2, 3, 4, 5].map((l) => list.filter((q) => q.level === l).length);
      check(`${k}: at least 8 questions at each of levels 1-5`, per.every((n) => n >= 8), per.join(','));
    }
    check('different: four tiles and the odd one once; shapes are three alike, words are three of a kind',
      ODD.every((q) => q.tiles.length === 4 && q.tiles.filter((t) => t === q.odd).length === 1
        && new Set(q.tiles.filter((t) => t !== q.odd)).size === (q.shapes ? 1 : 3)),
      JSON.stringify(ODD.find((q) => q.tiles.filter((t) => t === q.odd).length !== 1)));
    check('different: level 1 is shapes, drawn here in currentColor (no colour carries the answer)',
      ODD.filter((q) => q.level === 1).every((q) => q.shapes) && SHAPE_NAMES.every((s) => /currentColor/.test(shapeSvg(s)) && !/#[0-9a-f]{3,6}/i.test(shapeSvg(s))));
    check('count: the number is the dots, 1-4 at level 1 and up to 20 at level 5',
      COUNT.every((q) => q.n === q.rows.reduce((a, b) => a + b, 0)) && COUNT.filter((q) => q.level === 1).every((q) => q.n <= 4)
        && Math.max(...COUNT.map((q) => q.n)) === 20);
    check('what comes next: every counting-on pattern really steps evenly to its answer',
      NEXT.filter((q) => /^each one is \d+ (more|less)$/.test(q.rule)).every((q) => {
        const d = q.seq[1] - q.seq[0]; return q.seq.every((x, i) => i === 0 || x - q.seq[i - 1] === d) && q.answer === q.seq[q.seq.length - 1] + d;
      }));
    check('remember the order: two things at level 1 up to five (and one extra) at level 5; no repeats; the extra is not in the order',
      ORDER.filter((q) => q.level === 1).every((q) => q.seq.length === 2) && ORDER.filter((q) => q.level === 5).every((q) => q.seq.length === 5 && q.extra.length === 1)
        && ORDER.every((q) => new Set(q.picks).size === q.picks.length && !q.extra.some((x) => q.seq.includes(x))));
    const text = JSON.stringify(BANKS) + JSON.stringify(LINES);
    check('no site copy names the person this was first built for', !/christine|cici|her screen/i.test(text));
    check('no line says she / her', !/\b(she|her|hers|herself)\b/i.test(Object.values(LINES).join(' ')));
  }

  section('judging, pure');
  {
    const odd = { kind: 'odd', tiles: ['circle', 'square', 'circle', 'circle'], odd: 'square', same: 'circles' };
    check('different: "the square" right, "a circle" wrong, "a banana" cannot be judged',
      judgeItem(odd, 'the square') === true && judgeItem(odd, 'a circle') === false && judgeItem(odd, 'a banana') === null);
    const cnt = { kind: 'count', n: 5, rows: [3, 2] };
    check('count: "five" and "5" right; *** any other number is a real answer, and wrong ***',
      judgeItem(cnt, 'five') === true && judgeItem(cnt, '5') === true && judgeItem(cnt, 'seven') === false && judgeItem(cnt, 'hello') === null);
    check('the number choices: the answer and its neighbours, never below one', numberOptions(5).join() === '4,5,6' && numberOptions(1).join() === '1,2,3');
    const nx = NEXT.find((q) => q.id === 'bb-next-2-2_4_6');
    check('what comes next: 2, 4, 6 -> 8', nx && answerOf(nx) === '8' && judgeItem(nx, 'eight') === true && judgeItem(nx, '7') === false);
    const ord = { kind: 'order', seq: ['star', 'heart'], extra: [], picks: ['heart', 'star'] };
    check('order: the answer is the board\'s codes in order', orderAnswer(ord) === 'ba' && judgeItem(ord, 'ba') === true && judgeItem(ord, 'ab') === false);
    check('order: spoken names to codes ("star then heart")', codesFromSpeech(ord, 'star then heart') === 'ba' && codesFromSpeech(ord, 'stars') === 'b');
  }

  section('the settings');
  {
    const m = getManifest(GAME);
    check('built on the new core, needs nothing', m.core === 'new' && m.dependsOn === 'local');
    const f = (k) => m.settings.find((s) => s.key === k);
    check('which game: a mix and the four', (f('game')?.options || []).map((o) => o.value).join(',') === GAMES.join(','));
    check('rounds of five by default; *** no time pressure by default (quick look off) ***', f('roundSize').default === 5 && f('quickLookMs').default === 0 && DEFAULTS.quickLookMs === 0);
    const all = { ...FLOW_LINES, ...LINES };
    const missing = Object.keys(all).filter((k) => { const s = f(k); return !s || s.kind !== 'text' || s.default !== all[k]; });
    check('*** every spoken line is an editable text setting ***', missing.length === 0, missing.join(','));
    const fields = m.settings.map(normalizeField).filter(Boolean);
    const errs = auditFields(fields, { type: GAME }).filter((x) => x.severity !== 'info');
    check('the settings audit finds nothing to warn about', errs.length === 0, JSON.stringify(errs));
    const byModule = Object.fromEntries(listManifests().filter((x) => Array.isArray(x.settings))
      .map((x) => [x.type, x.settings.map(normalizeField).filter(Boolean)]));
    const clash = auditAcross(byModule).filter((x) => x.severity === 'error');
    check('*** no key is declared as a different kind than another module declares it ***', clash.length === 0, JSON.stringify(clash));
  }

  section('which one is different: touch, switch, voice');
  {
    const r = R({ game: 'odd' });
    const it = r.item();
    check('a level-1 shapes question for a new player, four tiles', it.kind === 'odd' && it.level === 1 && r.host.querySelectorAll('[data-tiles] [data-pick]').length === 4);
    check('said: "Which one is different: a, b, c or d?" then the first offer',
      r.said[0].startsWith(`Which one is different: ${it.tiles.slice(0, 3).join(', ')} or ${it.tiles[3]}?`) && /Is it the \w+\?$/.test(r.said[0]), r.said[0]);
    const same = it.tiles.find((t) => t !== it.odd);
    tap(r, same);
    check('touching one of the three: "Not that one." and "three of them are ..."',
      r.last().startsWith(`Not that one. Here is a hint: three of them are ${it.same}.`) && r.probe().misses === 1, r.last());
    tap(r, it.odd);
    check('touching the different one: right, and why', r.phase() === 'celebrate' && r.last() === `Yes! The ${it.odd} is the different one. The others are ${it.same}.`, r.last());
    await sleep(10);
    check('one School point', r.points().length === 1);
    r.inst.destroy();

    const s = R({ game: 'odd' });
    const is = s.item();
    check('the switch offers each different tile once', s.probe().candidates.length === 2);
    let guard = 0;
    while (s.probe().candidate !== is.odd && guard++ < 4) s.host.querySelector('[data-act="no"]').click();
    s.host.querySelector('[data-act="yes"]').click();
    check('the switch: No past the others, Yes on the different one: right, no miss', s.phase() === 'celebrate' && s.probe().misses === 0);
    s.inst.destroy();

    const v = R({ game: 'odd' });
    v.eng.hear({ text: `the ${v.item().odd}`, confidence: 0.9 });
    check('aloud: right', v.phase() === 'celebrate');
    v.inst.destroy();
  }

  section('quick count: no clock unless asked for');
  {
    const r = R({ game: 'count' });
    const it = r.item();
    check('the dots on screen are the number', r.host.querySelectorAll('[data-dots] .qz-dot').length === it.n);
    check('*** nothing is timed: no timer is waiting ***', r.timers.count() === 0);
    check('three number tiles, one of them right', r.host.querySelectorAll('[data-choices] [data-pick]').length === 3);
    r.eng.hear({ text: String(it.n + 3), confidence: 0.95 });
    check('a wrong number aloud: a miss, and a hint that takes a choice away', r.probe().misses === 1 && /Here is a hint: it is not \d+\./.test(r.last()), r.last());
    tap(r, it.n);
    check('the right tile: "There are N."', r.phase() === 'celebrate' && r.last() === `Yes! There are ${it.n}.`, r.last());
    r.inst.destroy();

    const t = fakeTimers();
    const delays = [];
    const q = R({ game: 'count', quickLookMs: 2000 }, { extra: { setTimer: (fn, ms) => { delays.push(ms); return t.set(fn, ms); }, clearTimer: t.clear } });
    check('quick look ON: one timer, for the chosen time', delays.includes(2000));
    t.flush();
    check('...the dots are hidden, and the question is still open (nothing ends the turn)',
      !q.host.querySelector('[data-dots]') && q.host.querySelector('[data-hidden]') && q.phase() === 'asking');
    q.inst.destroy();

    const t2 = fakeTimers();
    const d2 = [];
    const f = R({ game: 'count', quickLookMs: 2000 }, { extra: { flashLimitPerSecond: 0.1,
      setTimer: (fn, ms) => { d2.push(ms); return t2.set(fn, ms); }, clearTimer: t2.clear } });
    check('*** a screen with a flash limit of one every ten seconds: the hide waits at least that long ***', d2.some((ms) => ms >= 10000), d2.join(','));
    f.inst.destroy();
  }

  section('what comes next: the rule is the first hint');
  {
    const r = R({ game: 'next' });
    const it = r.item();
    check('said with the numbers', r.said[0].startsWith(`What comes next: ${it.seq.join(', ')}?`), r.said[0]);
    const wrong = numberOptions(it.answer).find((x) => x !== it.answer);
    tap(r, wrong);
    check('a miss: the rule ("each one is 1 more")', r.probe().hints[0] === it.rule, r.probe().hints.join('|'));
    r.eng.hear({ text: String(it.answer), confidence: 0.95 });
    check('the answer aloud: "N comes next: the rule."', r.phase() === 'celebrate' && r.last() === `Yes! ${it.answer} comes next: ${it.rule}.`, r.last());
    r.inst.destroy();
  }

  section('remember the order: look, Ready, then pick');
  {
    const r = R({ game: 'order' });
    const it = r.item();
    check('level 1: two shapes shown, numbered, and said', it.seq.length === 2 && r.host.querySelectorAll('[data-study] li').length === 2
      && r.said[0].startsWith(`Remember these, in order: ${it.seq.join(', ')}.`), r.said[0]);
    check('the board is only Ready while looking', r.host.querySelectorAll('.qz-key').length === 1 && key(r, 'Ready'));
    r.eng.hear({ text: it.seq[0], confidence: 0.95 });
    check('*** an answer before Ready: "Have a good look, then say ready." NOT a miss ***', r.probe().misses === 0 && r.last() === LINES.studyFirstLine, r.last());
    key(r, 'Ready').click();
    check('Ready: the things are hidden, "Now pick them in the same order."', r.last() === 'Now pick them in the same order.'
      && !r.host.querySelector('[data-study]') && r.host.querySelectorAll('[data-slots] li[data-empty]').length === 2, r.last());
    check('...and the board is the things (mixed) and Undo', r.host.querySelectorAll('.qz-key[data-letter]').length === 2 && key(r, 'Undo'));
    key(r, it.seq[1]).click();
    key(r, it.seq[0]).click();
    check('the wrong order: a miss, and "the first one was the ..."', r.probe().misses === 1
      && new RegExp(`Here is a hint: the first one was the ${it.seq[0]}\\.`).test(r.last()), r.last());
    key(r, it.seq[0]).click();
    check('a pick fills the first slot', r.host.querySelector('[data-slots] li[data-slot="0"]')?.textContent.includes(it.seq[0]));
    key(r, it.seq[1]).click();
    check('the right order: right, checked as soon as the last one is picked', r.phase() === 'celebrate' && r.last() === `Yes! The order was ${it.seq.join(', ')}.`, r.last());
    r.inst.destroy();

    const v = R({ game: 'order' });
    const iv = v.item();
    v.eng.hear({ text: 'ready', confidence: 0.95 });
    check('"ready" aloud', v.st().studied === true && v.last() === 'Now pick them in the same order.');
    v.eng.hear({ text: `${iv.seq[0]} then ${iv.seq[1]}`, confidence: 0.95 });
    check('the order aloud: right', v.phase() === 'celebrate');
    v.inst.destroy();

    const s = R({ game: 'order' });
    const is = s.item();
    s.publish(`${GAME}/select`);
    check('one switch: Select on Ready', s.st().studied === true);
    for (const name of is.seq) {
      const rowEls = [...s.host.querySelectorAll('.qz-row')];
      const at = rowEls.map((row) => row.textContent.trim()).indexOf(name);
      const cur = Math.max(0, rowEls.findIndex((row) => row.dataset.on === '1'));
      for (let i = 0; i < (at - cur + rowEls.length) % rowEls.length; i++) s.publish(`${GAME}/next`);
      s.publish(`${GAME}/select`);
    }
    check('...then walk to each thing in turn and select it: right', s.phase() === 'celebrate', `${s.phase()} ${s.probe().entry}`);
    s.inst.destroy();

    const t = fakeTimers();
    const q = R({ game: 'order', quickLookMs: 4000 }, { extra: { setTimer: t.set, clearTimer: t.clear } });
    t.flush();
    check('quick look on: after the time, the things hide by themselves and the picking starts', q.st().studied === true && q.last() === 'Now pick them in the same order.');
    q.inst.destroy();
  }

  section('rounds: short, with a score at the end; the mix changes kind each round');
  {
    const r = R({ game: 'odd', roundSize: 3 });
    for (let i = 0; i < 3; i++) {
      tap(r, r.item().odd);
      if (i < 2) r.timers.flush();
    }
    check('the third of three: "That is the end of the round: 3 of 3 right."', /That is the end of the round: 3 of 3 right\.$/.test(r.last()), r.last());
    r.inst.destroy();
    const m = R({ game: 'mix', mixBy: 'round', roundSize: 2 });
    const kinds = [];
    for (let i = 0; i < 8; i++) { kinds.push(m.item().kind); m.eng.skip(); }
    check('mix by ROUND (the setting): a round of each kind in turn', kinds.join(',') === MIX_ORDER.flatMap((k) => [k, k]).join(','), kinds.join(','));
    m.inst.destroy();
  }

  section('*** THE MIX BUG (Mike, 2026-10-02: "Brain games is just which one is different as far as I can tell. I even have the which game set to mix") ***');
  {
    // Played the way a person plays it - answering, the celebration, the next question by itself -
    // not by skipping. Four questions must already be four different kinds.
    const answer = (r) => {
      const it = r.item();
      if (it.kind === 'odd') tap(r, it.odd);
      else if (it.kind === 'count') tap(r, it.n);
      else if (it.kind === 'next') tap(r, it.answer);
      else { r.eng.hear({ text: 'ready', confidence: 0.95 }); r.eng.hear({ text: it.seq.join(' then '), confidence: 0.95 }); }
      return it.kind;
    };
    const m = R({ game: 'mix' });
    const kinds = [];
    for (let i = 0; i < 8; i++) {
      kinds.push(answer(m));
      check(`question ${i + 1} (${kinds[i]}) answered right`, m.phase() === 'celebrate', `${m.phase()} ${m.last()}`);
      m.timers.flush();
    }
    check('*** the default mix changes kind EVERY question: the first four are all four kinds ***',
      new Set(kinds.slice(0, 4)).size === 4 && MIX_ORDER.every((k) => kinds.slice(0, 4).includes(k)), kinds.join(','));
    check('...and keeps cycling (the next four are all four again)', new Set(kinds.slice(4, 8)).size === 4, kinds.join(','));
    check('every question went straight on to the next, with no "another one?" between', m.phase() === 'asking' && m.probe().serial === 9);
    m.inst.destroy();
    // Where a mix starts is chosen when the panel starts, so coming back does not always open on the same kind.
    const late = R({ game: 'mix' }, { rand: () => 0.6 });
    check('a different start (rand 0.6): opens on the third kind, then carries on in order',
      late.item().kind === MIX_ORDER[2], late.item().kind);
    late.eng.skip();
    check('...then the fourth', late.item().kind === MIX_ORDER[3], late.item().kind);
    late.inst.destroy();
    const f = getManifest(GAME).settings.find((s) => s.key === 'mixBy');
    check('"In a mix, change the kind": every question (default) or every round', f && f.default === 'question'
      && f.options.map((o) => o.value).join(',') === 'question,round' && DEFAULTS.mixBy === 'question');
  }

  section('*** see-through: the game draws no background of its own (the panel setting shows) ***');
  {
    const r = R({ game: 'odd' });
    // A theme's colours, set where a kiosk sets them, so a game that painted `--bg` / `--surface` would show it.
    r.host.style.setProperty('--bg', 'rgb(1, 2, 3)');
    r.host.style.setProperty('--surface', 'rgb(4, 5, 6)');
    const root = r.host.querySelector('[data-quiz-root]');
    const bg = root && getComputedStyle(root).backgroundColor;
    check('the game\'s root is transparent, so solid / veil / clear on the panel all show', bg === 'rgba(0, 0, 0, 0)', bg);
    check('...and the image under it is none', root && getComputedStyle(root).backgroundImage === 'none');
    r.host.style.removeProperty('--bg'); r.host.style.removeProperty('--surface');
    r.inst.destroy();
  }

  section('*** TWO PLAYERS, EACH AT THEIR OWN LEVEL ***');
  {
    const ladder = emptyLadder();
    ladder.players['name:ann'] = { name: 'Ann', games: { [ladderGame('count')]: { rating: levelRating(5), n: 80, floor: 5, recent: [], review: {} } } };
    const store = ladderStore({ ladder });
    const r = R({ game: 'count', players: 'Ann, Bob' }, { store });
    await sleep(0);
    r.eng.skip();
    const annQ = r.item();
    check('Ann first, said first', r.last().startsWith('Ann, your turn. How many dots'), r.last());
    check('*** Ann counts a lot of dots (level 4-5) ***', annQ.level >= 4 && annQ.n >= 10, JSON.stringify(annQ));
    tap(r, annQ.n);
    await sleep(10);
    check('Ann\'s right answer earns a point', r.points().length === 1);
    r.timers.flush();
    const bobQ = r.item();
    check('*** Bob, new, counts a few (level 1-2) ***', r.last().startsWith('Bob, your turn.') && bobQ.level <= 2 && bobQ.n <= 6, JSON.stringify(bobQ));
    tap(r, bobQ.n);
    await sleep(10);
    check('*** Bob\'s right answer does NOT pay into the screen\'s points (a setting) ***', r.points().length === 1);
    const sc = r.scores[r.scores.length - 1];
    check('the published score names both: "Ann 1 · Bob 1"', sc && sc.detail === 'Ann 1 · Bob 1', JSON.stringify(sc));
    const saved = store.peek().ladder;
    check('both on the saved ladder under the brain games\' own name', saved.players['name:ann'].games[ladderGame('count')].n === 81
      && saved.players['name:bob'].games[ladderGame('count')].n === 1);
    r.inst.destroy();
  }

  section('grammar');
  {
    const r = R({ game: 'odd' });
    const g = r.lastGrammar();
    check('the tiles\' names and [unk]', g.open && g.words.includes(UNKNOWN) && r.item().tiles.every((t) => g.words.includes(t)));
    r.inst.destroy();
  }

  // =====================================================================
  section('*** IT WAITS FOR START, SILENTLY (Mike, 2026-10-02 late: "Brain games just starts talking") ***');
  {
    const bus = createBus();
    const states = [];
    bus.subscribe(PLAY_STATE_TOPIC, (p) => states.push(p));
    const r = R({}, { fresh: true, bus });
    const gate = () => r.inst.impl.__gate();
    check('*** opens waiting: not started, NOTHING SAID ***', gate().begun === false && r.said.length === 0, JSON.stringify(r.said));
    check('a Start button is up, lit for a switch', !!r.host.querySelector('[data-start][data-on="1"]'));
    check('*** the grammar is closed: a waiting game does not take the room\'s words ***', !r.grammars.some((g) => g.open));
    check('the shell is told it is not playing', states.length && states[states.length - 1].playing === false);
    check('*** the demo is on: the computer has a question up (silently) ***', gate().demo === true && !!gate().demoSnap?.item
      && gate().agent === 'computer');
    // Play the demo for a while: the computer walks to the answer and takes it.
    for (let i = 0; i < 12; i++) r.timers.flush();
    check('*** ...and answers questions, and none of it is said, scored or paid ***', r.said.length === 0
      && r.points().length === 0 && !r.scores.some((s) => s.source === GAME && s.value > 0) && r.chimes.length === 0,
      JSON.stringify({ said: r.said, pts: r.points().length }));
    check('the ladder never heard of the demo', !Object.keys(r.ladder.peek().ladder?.players || {}).length
      && r.inst.impl.__session.asked() === 0);
    // Any press starts it.
    r.publish(`${GAME}/next`);
    check('*** a press (next) starts the real game: the demo stops, the question is asked aloud ***', gate().begun === true
      && gate().demo === false && r.said.length === 1 && !!r.item());
    check('...Start is gone, the grammar opens, the shell is told it is playing', !r.host.querySelector('[data-start]')
      && r.lastGrammar()?.open === true && states[states.length - 1].playing === true);
    // Pause and go on.
    r.publish(`${GAME}/pause`);
    check('*** pause: "Go on" is up, the grammar closes ***', gate().paused === true && /Go on/.test(r.host.querySelector('[data-start]')?.textContent || '')
      && r.lastGrammar()?.open === false);
    const n = r.said.length;
    r.publish(`${GAME}/next`);
    check('...a press goes on, and the question is asked again', gate().paused === false && r.said.length === n + 1);
    r.inst.destroy();
  }
  {
    const r = R({}, { fresh: true });
    r.host.querySelector('[data-start]').click();
    check('the Start button starts it', r.inst.impl.__gate().begun === true && r.said.length === 1);
    r.inst.destroy();
    const v = R({}, { fresh: true });
    v.publish(`${GAME}/play`, { game: 'count' });
    check('*** "play quick count" said aloud starts THAT game ***', v.inst.impl.__gate().begun && v.item()?.kind === 'count');
    v.inst.destroy();
    const a = R({ autostart: true }, { fresh: true });
    check('autostart on: it starts at once', a.inst.impl.__gate().begun === true && a.said.length === 1);
    a.inst.destroy();
    const off = R({ attract: false }, { fresh: true });
    check('"While nobody is playing: it waits, still": no demo', off.inst.impl.__gate().demo === false && !!off.host.querySelector('[data-start]'));
    off.inst.destroy();
    const rm = R({}, { fresh: true, reducedMotion: true });
    check('reduced motion: no demo', rm.inst.impl.__gate().demo === false);
    rm.inst.destroy();
    const alone = R({ autostartAlone: 'on' }, { fresh: true, extra: { panelCount: 1 } });
    check('alone on the dashboard, set to start by itself then: it does', alone.inst.impl.__gate().begun === true);
    alone.inst.destroy();
    const m = getManifest(GAME);
    check('"start" said aloud is in the manifest', m.voice?.start === 'play');
    check('the rows are there: when it opens (off), the demo (on)', m.settings.find((s) => s.key === 'autostart')?.default === false
      && m.settings.find((s) => s.key === 'attract')?.default === true);
  }

  section('*** SAY THE ANSWER BY DEFAULT, NOT YES / NO (Mike, 2026-10-02 late) ***');
  {
    check('the default is "say it, tap it, or step through the answers"', DEFAULTS.answerBy === 'choices'
      && getManifest(GAME).settings.find((s) => s.key === 'answerBy')?.default === 'choices');
    const r = R({ game: 'count', answerBy: 'choices' });
    const it = r.item();
    check('*** asked WITHOUT an offer: no "Is it 3?" after the question ***', r.said.length === 1 && !/Is it/.test(r.last()), r.last());
    check('no Yes / No buttons', ![...r.host.querySelectorAll('button[data-act]')].some((b) => /^(yes|no)$/.test(b.dataset.act)));
    r.inst.impl.hear({ text: numberWord(it.n), confidence: 0.95 });
    check('*** saying the number is answering ***', r.phase() === 'celebrate', r.phase());
    r.inst.destroy();
    const o = R({ game: 'odd', answerBy: 'choices' });
    o.inst.impl.hear({ text: o.item().odd, confidence: 0.95 });
    check('*** saying the shape\'s name is answering ***', o.phase() === 'celebrate', o.phase());
    o.inst.destroy();
    // THE SWITCH STILL WORKS: it walks the answers themselves.
    const s = R({ game: 'count', answerBy: 'choices' });
    const want = String(s.item().n);
    const cands = s.probe().candidates;
    check('the switch\'s stops ARE the answers', s.eng.stops().filter((x) => x.act === 'pick').map((x) => x.value).join() === cands.join());
    let lit = s.probe().lit;
    check('the first answer is lit on its tile', lit === cands[0] && s.host.querySelector(`[data-pick="${CSS.escape(cands[0])}"]`)?.dataset.on === '1');
    let guard = 0;
    while (s.probe().lit !== want && guard++ < 5) s.publish(`${GAME}/next`);
    check('next walks to the right one, and says it as it gets there', s.probe().lit === want && s.last() === want, s.last());
    s.publish(`${GAME}/select`);
    check('*** select answers it: right ***', s.phase() === 'celebrate');
    s.inst.destroy();
    // YES / NO IS AN OPTION (a nod and a shake).
    const y = R({ game: 'count', answerBy: 'yesno' });
    check('*** yes / no: "Is it ...?" is offered, Yes and No are the stops ***', /Is it/.test(y.last())
      && y.eng.stops().map((x) => x.act).slice(0, 2).join() === 'yes,no', y.last());
    y.inst.destroy();
    const two = R({ game: 'count', answerBy: 'choices', twoSwitch: 'yesno' });
    check('two switches that are Yes and No mean the yes / no shape whatever "Answering" says', two.probe().offers === 'yesno');
    two.inst.destroy();
  }

  finish();
} catch (err) { finish(err); }
</script>
</body>
</html>
