<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>simple math — test</title>
<link rel="stylesheet" href="../modules.css">
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem} h2{font-size:.95rem;margin:16px 0 4px}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #host{position:absolute;left:-9999px;width:800px;height:450px}
</style>
</head>
<body>
<h1>simple math (row 2.45)</h1>
<p>Plus, minus and times within a range that is a setting. Answer by switch (one number offered at a
time: "Is it 7?"), on a number pad, or aloud. Hints: how to count it (with dots), then a range.</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>

<script type="module">
import { harness, rig, sleep, answerByChecks, personLadderChecks } from './quiz_test_rig.js';
import { getManifest, listManifests } from '../module.js';
import '../modules/simple_math.js';
import '../modules/algebra.js';
import { GAME, LINES, DEFAULTS, makeProblems, padBoard, FOLDED_INTO, mathBank, MATH_LEVELS } from '../modules/simple_math.js';
import { BEGINNER, BEGINNER_DEFAULTS_FOR_MATH } from '../modules/algebra.js';
import { LADDER_KEY } from '../adaptive_play.js';
import { UNKNOWN, FLOW_LINES, numberWord } from '../quiz_flow.js';
import { auditFields, walkCosts } from '../settings_audit.js';
import { normalizeField } from '../settings_fields.js';

const { check, section, finish } = harness();
// The sections written before 2026-10-02 late test the yes / no shape ("Is it 7?"), so `R` pins it;
// `ship` mounts the panel as it now ships (say it, tap it, or step through the numbers).
const R = (saved = {}, opts = {}) => rig('simple_math', { saved: { answerBy: 'yesno', ...saved }, ...opts });
const ship = (saved = {}, opts = {}) => rig('simple_math', { saved, ...opts });
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

try {
  section('the problems stay inside the range they were asked for');
  {
    const add = makeProblems({ ops: 'add', maxNumber: 10 }, rand, 200);
    check('plus within 10: every sum is 10 or less, no zeros', add.every((p) => p.op === 'add' && p.answer <= 10 && p.a >= 1 && p.b >= 1),
      JSON.stringify(add.find((p) => p.answer > 10 || p.a < 1 || p.b < 1)));
    const sub = makeProblems({ ops: 'sub', maxNumber: 10 }, rand, 200);
    check('minus within 10: never below one, never above ten', sub.every((p) => p.op === 'sub' && p.answer >= 1 && p.a <= 10 && p.answer === p.a - p.b));
    const mul = makeProblems({ ops: 'mul', maxNumber: 5 }, rand, 200);
    check('times within 5: both numbers 5 or less', mul.every((p) => p.op === 'mul' && p.a <= 5 && p.b <= 5 && p.answer === p.a * p.b));
    const mix = makeProblems({ ops: 'addsub', maxNumber: 10 }, rand, 200);
    check('plus and minus: both turn up', mix.some((p) => p.op === 'add') && mix.some((p) => p.op === 'sub'));
    const all = makeProblems({ ops: 'all', maxNumber: 12 }, rand, 300);
    check('all three: all three turn up', ['add', 'sub', 'mul'].every((o) => all.some((p) => p.op === o)));
    check('an unknown setting falls back to the default, not to nothing',
      makeProblems({ ops: 'banana', maxNumber: 'x' }, rand, 20).length === 20);
  }

  section('the settings');
  {
    const m = getManifest(GAME);
    check('built on the new core, nothing to fetch', m.core === 'new' && m.dependsOn === 'local');
    const f = (k) => m.settings.find((s) => s.key === k);
    check('which sums is a setting (plus / minus / times / mixes)', (f('ops')?.options || []).length >= 4);
    check('how big the numbers get is a setting', (f('maxNumber')?.options || []).map((o) => o.value).join(',') === '5,10,12,20');
    check('answer by offers or a number pad is a setting', (f('answerWith')?.options || []).map((o) => o.value).join(',') === 'offer,pad');
    check('dots with the hint is a setting', !!f('dots'));
    const all = { ...FLOW_LINES, ...LINES };
    const missing = Object.keys(all).filter((k) => { const s = f(k); return !s || s.kind !== 'text' || s.default !== all[k]; });
    check('*** every spoken line is an editable text setting ***', missing.length === 0, missing.join(','));
    const errs = auditFields(m.settings.map(normalizeField).filter(Boolean), { type: GAME }).filter((x) => x.severity !== 'info');
    check('the settings audit finds nothing to warn about', errs.length === 0, JSON.stringify(errs));
    check('no line says she / her', !/\b(she|her|hers|herself)\b/i.test(Object.values(LINES).join(' ')));
  }

  // =====================================================================================
  section('asking, and the switch path: one number at a time');
  {
    const r = R();
    const it = r.probe().item;
    const sym = { add: '+', sub: '−', mul: '×' }[it.op];
    check('the sum on screen', r.host.querySelector('.wg-ask')?.textContent.replace(/\s/g, '') === `${it.a}${sym}${it.b}=?`,
      r.host.querySelector('.wg-ask')?.textContent);
    const word = { add: 'plus', sub: 'minus', mul: 'times' }[it.op];
    check('...and said, with the first number offered', r.said[0].startsWith(`What is ${it.a} ${word} ${it.b}?`) && /Is it \d+\?$/.test(r.said[0]), r.said[0]);
    const cands = r.probe().candidates;
    check('three numbers are offered, one of them right, none below zero, none the same',
      cands.length === 3 && cands.includes(String(it.answer)) && new Set(cands).size === 3 && cands.every((c) => Number(c) >= 0), cands.join(','));
    let guard = 0;
    while (r.probe().candidate !== String(it.answer) && guard++ < 5) r.host.querySelector('[data-act="no"]').click();
    r.host.querySelector('[data-act="yes"]').click();
    check('No, No, Yes on the right one: right', r.phase() === 'celebrate');
    check('...the pair says it', r.last() === `Yes! ${it.a} ${word} ${it.b} is ${it.answer}.`, r.last());
    await sleep(10);
    check('...one School point', r.points().length === 1);
    r.inst.destroy();
  }

  section('*** the miss flow and the hints (with dots) ***');
  {
    const r = R({ ops: 'add', maxNumber: 5 });
    const it = r.probe().item;
    check('no dots before a hint (the default is dots WITH the hint)', !r.host.querySelector('.qz-dot'));
    r.eng.hear({ text: String(it.answer + 1), confidence: 0.95 });
    check('a confident wrong number: Mike’s line, then how to count it',
      r.last().startsWith(`It sounded like you said ${it.answer + 1}. That is incorrect. Here is a hint: start at ${it.a} and count on ${it.b} more.`), r.last());
    check('...and the dots appear: one row for each number', r.host.querySelectorAll('.qz-dotrow').length === 2
      && r.host.querySelectorAll('.qz-dot').length === it.a + it.b);
    r.eng.hear({ text: String(it.answer + 1), confidence: 0.95 });
    r.eng.hear({ text: 'try again', confidence: 0.9 });
    const h = r.probe().hints[1];
    check('try again: the second hint is a range', /^it is more than \d+ and less than \d+$/.test(h), h);
    check('*** ...which never names the answer ***', !new RegExp(`\\b${it.answer}\\b`).test(h), h);
    r.inst.destroy();

    const s = R({ ops: 'sub', maxNumber: 10, dots: 'always' });
    const is = s.probe().item;
    check('"always": dots from the start; minus shows the ones taken away hollow',
      s.host.querySelectorAll('.qz-dot').length === is.a && s.host.querySelectorAll('.qz-dot[data-away]').length === is.b);
    s.inst.destroy();

    const m = R({ ops: 'mul', maxNumber: 5, dots: 'always' });
    const im = m.probe().item;
    check('times: rows of dots', m.host.querySelectorAll('.qz-dotrow').length === im.a && m.host.querySelectorAll('.qz-dot').length === im.a * im.b);
    m.inst.destroy();
  }

  section('by voice');
  {
    const r = R({ ops: 'add', maxNumber: 10 });
    const it = r.probe().item;
    const words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
    r.eng.hear({ text: `it's ${words[it.answer]}`, confidence: 0.9 });
    check('"it\'s seven": right', r.phase() === 'celebrate');
    r.inst.destroy();
    const u = R();
    const iu = u.probe().item;
    u.eng.hear({ text: String(iu.answer), confidence: 0.3 });
    check('unsure below the threshold, even when right', u.phase() === 'unsure');
    u.eng.press('confirm');
    check('...Yes: right', u.phase() === 'celebrate');
    u.inst.destroy();
    const n = R();
    n.eng.hear({ text: 'banana', confidence: 0.9 });
    check('a word that is not a number: not caught, not a miss', n.probe().misses === 0 && n.phase() === 'asking');
    const g = n.lastGrammar();
    check('the grammar: number words, and [unk]', g.open && g.words.includes('seven') && g.words.includes(UNKNOWN));
    n.inst.destroy();
  }

  section('the number pad (a setting)');
  {
    check('the pad: 1-9, then 0, Delete, Check', padBoard().map((row) => row.map((k) => k.key ?? k.cmd).join('')).join('|')
      === '123|456|789|0erasecheck', JSON.stringify(padBoard()));
    const r = R({ ops: 'mul', maxNumber: 12, answerWith: 'pad' }, { rand: () => 0.99 });
    const it = r.probe().item;
    check('no Yes/No on the pad', !r.host.querySelector('[data-act="yes"]') && r.host.querySelectorAll('[data-letter]').length === 10);
    for (const d of String(it.answer)) r.host.querySelector(`[data-letter="${d}"]`).click();
    check('typing the answer checks it: right', r.phase() === 'celebrate', `${it.a}x${it.b} ${r.probe().entry}`);
    r.inst.destroy();
  }

  // =====================================================================================
  // ROW 2.45, 2026-10-01: "The simple math isn't a separate game... the math module should have some
  // questions for absolute beginners." The game is now Math's Beginner level; the old type stays.
  // =====================================================================================
  // A state handle of the full shape (the calculator game's quest mode reads one too).
  const ladderStore = () => {
    let v = {};
    return { load: async () => {}, get: () => v, set: (p) => { v = { ...v, ...p }; }, destroy() {}, peek: () => v,
      startPolling() {}, flush() {}, subscribe: (fn) => { fn(v); return () => {}; } };
  };

  section('*** AN EXISTING SIMPLE MATH PANEL KEEPS WORKING, EXACTLY AS IT WAS SET ***');
  {
    const m = getManifest(GAME);
    check('the type is still registered, and says it is folded into Math', !!m && m.foldedInto === 'algebra' && FOLDED_INTO === 'algebra');
    const r = R({ ops: 'mul', maxNumber: 5, answerWith: 'pad', dots: 'always' });
    const it = r.probe().item;
    check('its saved settings still apply: a times question within 5, on the number pad, with dots',
      it.op === 'mul' && it.a <= 5 && it.b <= 5 && r.probe().entryMode === 'digits' && !!r.host.querySelector('.qz-dot'));
    check('*** it stays on the FIXED sums somebody chose: no ladder, no turn chip ***',
      !('id' in it) && !r.host.querySelector('.qz-turn') && m.settings.find((s) => s.key === 'mathLevel').default === 'fixed');
    r.inst.destroy();
    const n = R();
    check('a panel nobody configured: still plus and minus within ten, as before', ['add', 'sub'].includes(n.probe().item.op));
    n.inst.destroy();
    const math = getManifest('algebra');
    const kindOf = (man, k) => normalizeField(man.settings.find((s) => s.key === k) || {})?.kind;
    const keys = m.settings.map((s) => s.key);
    const missing = keys.filter((k) => kindOf(math, k) !== kindOf(m, k));
    check('*** every key the old panel saved means the same thing on Math (same key, same kind) ***', missing.length === 0, missing.join(','));
    const store = ladderStore();
    const a = R({ mathLevel: 'adaptive' }, { extra: { makeState: (k) => (k === LADDER_KEY ? store : null) } });
    const ia = a.probe().item;
    check('the ladder is one setting away on it: adaptive starts at counting', ia.op === 'count' && ia.level === 1 && typeof ia.id === 'string');
    a.inst.destroy();
  }

  section('the beginner ladder');
  {
    const bank = mathBank();
    check('every problem has a unique id', new Set(bank.map((p) => p.id)).size === bank.length);
    check('six levels: counting, plus within 5, plus/minus within 10, within 20, times to 5, times to 10',
      MATH_LEVELS.map((l) => l.ops.join('+') + l.max).join(',') === 'count5,add5,add+sub10,add+sub20,mul5,mul10');
    check('a problem sits at the FIRST level that asks it (2 + 2 is level 2, not 3 or 4)', bank.find((p) => p.id === 'add:2+2').level === 2);
    check('every answer is right, and none is below one', bank.every((p) => p.answer >= 1 && p.answer === (
      p.op === 'count' ? p.a : p.op === 'add' ? p.a + p.b : p.op === 'sub' ? p.a - p.b : p.a * p.b)));
    check('counting: the dots ARE the question, so they show without a hint', (() => {
      const r = R({ ops: 'count', maxNumber: 5 });
      const ok = r.host.querySelectorAll('.qz-dot').length === r.probe().item.a && r.said[0].startsWith('How many dots are there?');
      r.inst.destroy();
      return ok;
    })());
  }

  section('*** MATH, AT ITS BEGINNER LEVEL ***');
  {
    const store = ladderStore();
    const r = rig('algebra', { saved: { pool: BEGINNER }, extra: { makeState: (k) => (k === LADDER_KEY ? store : ladderStore()) } });
    const mode = () => r.inst.impl.__mode();
    const probe = () => r.inst.impl.__probe();
    const eng = () => r.inst.impl.__engine;
    check('Beginner shows the one-at-a-time game, not the calculator', mode() === 'beginner'
      && !!r.host.querySelector('[data-quiz-root]') && !r.host.querySelector('.al-calc'));
    const it = probe().item;
    check('an absolute beginner starts by counting dots', it.op === 'count' && it.level === 1
      && r.host.querySelectorAll('.qz-dot').length === it.a, JSON.stringify(it));
    eng().hear({ text: String(it.answer), confidence: 0.95 });
    check('a right answer aloud: right', probe().phase === 'celebrate');
    await sleep(10);
    check('...and a School point, under Math\'s own identifier', (r.store.points || []).length === 1
      && (r.store.points[0].data.source || r.store.points[0].data?.source) === 'algebra', JSON.stringify(r.store.points));
    const serial = probe().serial;
    r.timers.flush();
    check('*** after the celebration, the next question by itself (no "another one?") ***', probe().serial === serial + 1 && probe().phase === 'asking');
    r.publish('algebra/next');
    check('algebra/next walks the choices', probe().highlight === 1);
    r.publish('algebra/prev');
    r.publish('algebra/submit');
    check('*** the one verb Math has today (algebra/submit) answers as select (Yes on the offer) ***',
      probe().phase === 'celebrate' || probe().misses === 1, `${probe().phase} ${probe().misses}`);
    r.timers.flush();
    for (let i = 0; i < 12; i++) {
      const q = probe().item;
      eng().hear({ text: String(q.answer), confidence: 0.95 });
      r.timers.flush();
    }
    const ops = new Set();
    for (let i = 0; i < 8; i++) {
      const q = probe().item; ops.add(q.op);
      eng().hear({ text: String(q.answer), confidence: 0.95 }); r.timers.flush();
    }
    check('*** right after right, it moves on past counting by itself ***', !ops.has('count'), [...ops].join(','));
    check('the ladder is saved where every game on the screen can read it', !!store.peek().ladder?.players?.player?.games?.math);

    r.setCfg({ pool: 'mixed' });
    await sleep(20);
    check('*** changing the level to Mixed takes the beginner game down and puts the calculator up ***',
      mode() === 'calculator' && !r.host.querySelector('[data-quiz-root]') && !!r.host.querySelector('.al-calc'));
    check('the beginner game said its score is gone', r.scores.some((s) => s.source === 'algebra' && s.gone));
    const said = r.said.length;
    r.publish('speech/answer', { text: 'five', confidence: 0.99 });
    r.publish('algebra/next');
    check('*** and it is really gone: nothing it subscribed to still answers ***', r.said.length === said);
    r.setCfg({ pool: BEGINNER });
    check('and back again', mode() === 'beginner' && !!r.host.querySelector('[data-quiz-root]'));
    r.inst.destroy();

    const plain = rig('algebra', {});
    await sleep(20);
    check('*** a Math panel that never chose a level is still the calculator (the default did not change) ***',
      plain.inst.impl.__mode() === 'calculator' && !!plain.host.querySelector('.al-calc'));
    plain.inst.destroy();
  }

  section('Math\'s settings: each row shows only at the level it belongs to');
  {
    const m = getManifest('algebra');
    const fields = m.settings.map(normalizeField).filter(Boolean);
    const f = (k) => fields.find((x) => x.key === k);
    check('"Beginner" is the first choice under Which problems, and Mixed is still the default',
      f('pool').options[0].value === BEGINNER && f('pool').default === 'mixed');
    const applies = (k, v) => !f(k).appliesWhen || f(k).appliesWhen(v) !== false;
    check('at Mixed: the calculator rows show, the beginner rows do not',
      applies('roundLength', { pool: 'mixed' }) && !applies('answerWith', { pool: 'mixed' }) && !applies('players', { pool: 'mixed' }));
    check('at Beginner: the opposite', !applies('roundLength', { pool: BEGINNER }) && applies('answerWith', { pool: BEGINNER })
      && applies('players', { pool: BEGINNER }));
    check('at Beginner, adaptive by default: players and the ladder show, the fixed sums do not',
      applies('adapt', { pool: BEGINNER }) && !applies('ops', { pool: BEGINNER })
        && applies('ops', { pool: BEGINNER, mathLevel: 'fixed' }) && !applies('adapt', { pool: BEGINNER, mathLevel: 'fixed' }));
    check('Math\'s beginner level starts adaptive; the old panel starts fixed',
      f('mathLevel').default === 'adaptive' && BEGINNER_DEFAULTS_FOR_MATH.mathLevel === 'adaptive');
    // `streakEvery` reads like a duration to the audit and has since 2026-09-05; it is a count of
    // answers, not a time, and it is not this change's to rename (a rename needs a `legacy` read).
    const errs = auditFields(fields, { type: 'algebra' })
      .filter((x) => x.severity !== 'info' && !(x.code === 'duration-key' && x.key === 'streakEvery'));
    check('the settings audit finds nothing new to warn about', errs.length === 0, JSON.stringify(errs));
    const shown = (v) => fields.filter((x) => !x.appliesWhen || x.appliesWhen(v) !== false);
    const worst = ['mixed', BEGINNER].map((p) => walkCosts(shown({ pool: p }), { level: 'standard' }).worst?.total || 0);
    const worstFixed = walkCosts(shown({ pool: BEGINNER, mathLevel: 'fixed' }), { level: 'standard' }).worst?.total || 0;
    check('*** with only the rows that apply, no level\'s menu costs more than 12 presses to change one thing ***',
      Math.max(...worst, worstFixed) <= 12, `${worst.join(',')},${worstFixed}`);
    check('no row on Math says she / her', !/\b(she|her|hers|herself)\b/i.test(fields.map((x) => `${x.label} ${x.note || ''}`).join(' ')));
  }

  section('*** SAY THE NUMBER BY DEFAULT, NOT "IS IT 7?" (Mike\'s brain-games ruling, 2026-10-02 late, carried here) ***');
  {
    const m = getManifest(GAME);
    const right = (r) => String(r.probe().item.answer);
    answerByChecks({ check, mount: (s) => ship(s), type: GAME, name: 'plus and minus', saved: { ops: 'addsub' },
      defaults: DEFAULTS, manifest: m, right, say: (r) => numberWord(r.probe().item.answer) });
    answerByChecks({ check, mount: (s) => ship(s), type: GAME, name: 'counting', saved: { ops: 'count', maxNumber: 5 },
      defaults: DEFAULTS, manifest: m, right, say: (r) => numberWord(r.probe().item.answer) });
    const a = ship({});
    a.inst.impl.hear({ text: numberWord(a.probe().item.answer + 7), confidence: 0.95 });
    check('*** a number that is none of the three on screen is still heard, and is a miss ***', a.probe().misses === 1, a.last());
    a.inst.destroy();
    const fields = getManifest('algebra').settings.map(normalizeField).filter(Boolean);
    const row = fields.find((x) => x.key === 'answerBy');
    const applies = (v) => !row.appliesWhen || row.appliesWhen(v) !== false;
    check('Math, at Beginner: the same Answering row, say-it by default', BEGINNER_DEFAULTS_FOR_MATH.answerBy === 'choices'
      && row?.default === 'choices' && applies({ pool: BEGINNER }));
    check('...hidden where it changes nothing: on the number pad, and away from Beginner',
      !applies({ pool: BEGINNER, answerWith: 'pad' }) && !applies({ pool: 'mixed' }));
    const own = getManifest(GAME).settings.map(normalizeField).filter(Boolean).find((x) => x.key === 'answerBy');
    check('...and on the old panel, hidden on the number pad', own.appliesWhen({ answerWith: 'pad' }) === false && own.appliesWhen({}) !== false);
  }

  section('*** THE LEVEL FOLLOWS THE PERSON, with "Start this game at" and their usual start (2026-10-06) ***');
  await personLadderChecks({ check, name: 'Simple math', game: 'math', saved: { mathLevel: 'adaptive' },
    mount: ({ saved, store, extra }) => R(saved, { extra: { makeState: (k) => (k === LADDER_KEY ? store : null), ...extra } }) });

  finish();
} catch (err) { finish(err); }
</script>
</body>
</html>
