<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>name that — state, animal, person — test</title>
<link rel="stylesheet" href="../modules.css">
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem} h2{font-size:.95rem;margin:16px 0 4px}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #host{position:absolute;left:-9999px;width:800px;height:450px}
</style>
</head>
<body>
<h1>name that (row 2.45)</h1>
<p>Name that state (text clues, no map download), animal, or PERSON — built from the family's own
recorded messages: the clip plays, then "Who is this?", answered by switch from a few names or
aloud. Person's miss flow is gentle by default and a setting.</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>

<script type="module">
import { harness, rig, sleep, answerByChecks, personLadderChecks } from './quiz_test_rig.js';
import { getManifest } from '../module.js';
import '../modules/name_that.js';
import { GAME, GAMES, STATES, ANIMALS, LINES, DEFAULTS, personFromFileName, ANIMAL_BANK, STATE_BANK, STATE_CAPITALS,
  ladderGame, knownBank, isKnown, KNOWN_ADAPTER, KNOWN_FLOOR, PERSON_KINDS, PERSON_WHO, knownSourceHtml } from '../modules/name_that.js';
import { triviaPackRows } from '../modules/trivia.js';
import { DIFFICULTY_LEVELS } from '../packs.js';
import { UNKNOWN, FLOW_LINES } from '../quiz_flow.js';
import { auditFields } from '../settings_audit.js';
import { normalizeField } from '../settings_fields.js';

const { check, section, finish } = harness();

// A fake media source: flat files and/or one folder per person. Every seam is injected, so nothing
// here reaches a network, a folder, or a real <video>.
function media({ flat = [], albums = {}, sources = null } = {}) {
  const src = { id: 's1', label: 'Family', kind: 'agent', base_url: 'http://agent.test' };
  const played = [];
  let handlers = null;
  const released = [];
  return {
    played, released,
    end: () => { const h = handlers; handlers = null; h?.onEnded?.(); },
    fail: () => { const h = handlers; handlers = null; h?.onError?.(new Error('nope')); },
    playing: () => !!handlers,
    ctx: {
      sources: { list: async () => (sources || [src]) },
      resolveListing: async (s, album) => ({ album, albums: album ? [] : Object.keys(albums), items: [] }),
      listItemNames: async (s, album) => (album ? (albums[album.split('/').pop()] || []) : flat)
        .map((n) => ({ path: album ? `${album}/${n}` : n, name: n,
          kind: /\.(mp3|m4a|wav|ogg)$/i.test(n) ? 'audio' : /\.(jpg|png)$/i.test(n) ? 'image'
            : /\.(mp4|webm|mov|m4v)$/i.test(n) ? 'video' : null })),
      resolveItemUrl: async (s, path) => ({ url: `blob:${path}`, release: () => released.push(path) }),
      playClip: (host, clip, h) => { handlers = h; played.push(clip); return { stop: () => { handlers = null; } }; },
    },
  };
}
// The sections written before 2026-10-02 late test the yes / no shape ("Is it a cow?"), so `R` pins it;
// `ship` mounts the game as it now ships (say it, tap it, or step through the names).
const R = (saved = {}, extra = {}, opts = {}) => rig('name_that', { saved: { answerBy: 'yesno', ...saved }, extra, ...opts });
const ship = (saved = {}, extra = {}, opts = {}) => rig('name_that', { saved, extra, ...opts });
const waitFor = async (fn, ms = 1500) => { const t0 = Date.now(); while (!fn() && Date.now() - t0 < ms) await sleep(10); return fn(); };

try {
  // =====================================================================================
  section('the data: fifty states, and the animals; no hint gives the answer away');
  {
    check('fifty states', STATES.length === 50 && new Set(STATES.map((s) => s.answer)).size === 50);
    check('each has a nickname, a capital and a region', STATES.every((s) => s.nickname && s.capital && s.region));
    const give = STATES.filter((s) => [1, 2].some((n) => {
      const h = s.hints?.[n - 1] || '';
      return h.toLowerCase().includes(s.answer.toLowerCase());
    }));
    check('*** no state hint names the state (Oklahoma City, Indianapolis) ***', give.length === 0, give.map((s) => s.answer).join(','));
    check('no nickname names its state either', STATES.every((s) => !s.nickname.toLowerCase().includes(s.answer.toLowerCase())),
      STATES.filter((s) => s.nickname.toLowerCase().includes(s.answer.toLowerCase())).map((s) => s.answer).join(','));
    check('a real list of animals', ANIMALS.length >= 15);
    check('each animal: a question, a hint, an explanation', ANIMALS.every((a) => a.ask && a.hint && a.explain));
    const aGive = ANIMALS.filter((a) => new RegExp(`\\b${a.answer}`, 'i').test(`${a.ask} ${a.hint}`));
    check('*** no animal question or hint names the animal ***', aGive.length === 0, aGive.map((a) => a.answer).join(','));
    check('no line says she / her', !/\b(she|her|hers|herself)\b/i.test(Object.values(LINES).join(' ')
      + JSON.stringify(ANIMALS) + JSON.stringify(STATES)));
  }

  section('names from file names');
  {
    check('"Annie - how we met.mp4" -> Annie', personFromFileName('Annie - how we met.mp4') === 'Annie');
    check('"Uncle Bob 2.mp4" -> Uncle Bob', personFromFileName('Uncle Bob 2.mp4') === 'Uncle Bob');
    check('"carol_smith.webm" -> carol smith', personFromFileName('carol_smith.webm') === 'carol smith');
    check('"Dave.MOV" -> Dave', personFromFileName('Dave.MOV') === 'Dave');
  }

  section('the settings');
  {
    const m = getManifest(GAME);
    check('built on the new core; its media is local', m.core === 'new' && m.dependsOn === 'local');
    const f = (k) => m.settings.find((s) => s.key === k);
    check('which game: animal, state, person', (f('game')?.options || []).map((o) => o.value).join(',') === GAMES.join(','));
    check('*** the gentler miss flow for PERSON is a setting, gentle by default ***',
      f('personMiss')?.default === 'gentle' && (f('personMiss')?.options || []).map((o) => o.value).join(',') === 'gentle,standard');
    check('where the messages are: a source and a folder', f('sourceId')?.kind === 'choice' && f('album')?.kind === 'text');
    const all = { ...FLOW_LINES, ...LINES };
    const missing = Object.keys(all).filter((k) => { const s = f(k); return !s || s.kind !== 'text' || s.default !== all[k]; });
    check('*** every spoken line is an editable text setting ***', missing.length === 0, missing.join(','));
    const errs = auditFields(m.settings.map(normalizeField).filter(Boolean), { type: GAME })
      .filter((x) => x.severity !== 'info');
    check('the settings audit finds nothing to warn about', errs.length === 0, JSON.stringify(errs));
  }

  // =====================================================================================
  section('name that animal: the standard flow');
  {
    const r = R({ game: 'animal' });
    const it = r.probe().item;
    check('the question is asked, with one animal offered', r.said[0].startsWith(it.ask) && /Is it (a |an )?[a-z ]+\?$/i.test(r.said[0]), r.said[0]);
    const wrong = r.probe().candidates.find((c) => c !== it.answer);
    r.eng.hear({ text: `it's a ${wrong}`, confidence: 0.95 });
    check('"it\'s a pig" is heard as pig; wrong: Mike’s line and the hint',
      r.last().startsWith(`It sounded like you said ${wrong}. That is incorrect. Here is a hint: ${it.hint}.`), r.last());
    r.eng.hear({ text: it.answer, confidence: 0.95 });
    check('right: the explanation', r.phase() === 'celebrate' && r.last() === `Yes! ${it.explain}`, r.last());
    r.inst.destroy();
    const s = R({ game: 'animal' });
    let guard = 0;
    while (s.probe().candidate !== s.probe().item.answer && guard++ < 5) s.eng.press('no');
    s.eng.press('yes');
    check('by switch: No, No, Yes', s.phase() === 'celebrate');
    s.inst.destroy();
  }

  section('name that state');
  {
    const r = R({ game: 'state' });
    const it = r.probe().item;
    check('asked by its nickname, with a state offered', r.said[0].startsWith(`Which state is known as ${it.nickname}?`), r.said[0]);
    check('the nickname is on a card on screen', r.host.querySelector('.qz-card')?.textContent.includes(it.nickname));
    r.eng.hear({ text: `I think it is ${it.answer}`, confidence: 0.95 });
    check('a two-word state inside a sentence is found; the capital is in the explanation',
      r.phase() === 'celebrate' && r.last().includes(it.capital), r.last());
    r.inst.destroy();
    const n = R({ game: 'state' });
    const words = n.lastGrammar().words;
    check('the grammar has every state, and [unk]', STATES.every((s) => words.includes(s.answer.toLowerCase())) && words.includes(UNKNOWN));
    n.inst.destroy();
    const p = R({ game: 'animal' });
    p.publish('name_that/play', { game: 'state' });
    check('"play name that state" switches game (name_that/play)', p.probe().game === 'state' && p.stored().game === 'state');
    p.inst.destroy();
  }

  // =====================================================================================
  section('*** name that person: no messages yet is said plainly ***');
  {
    const none = media({ sources: [] });
    const r = R({ game: 'person', personWho: 'own' }, none.ctx);
    await waitFor(() => r.phase() === 'empty');
    check('no source: "empty", with what to do about it', r.phase() === 'empty'
      && /media source/i.test(r.host.textContent), r.host.textContent.slice(0, 200));
    check('...and nothing said aloud to the room', r.said.length === 0);
    r.inst.destroy();

    const one = media({ flat: ['Annie - hello.mp4', 'Annie - again.mp4'] });
    const o = R({ game: 'person', personWho: 'own' }, one.ctx);
    await waitFor(() => o.phase() === 'empty');
    check('one person: needs at least two, and says so', o.phase() === 'empty' && /two people/i.test(o.host.textContent), o.host.textContent.slice(0, 200));
    o.inst.destroy();
  }

  section('*** name that person: the clip plays FIRST, and nothing talks over it ***');
  {
    const m = media({ flat: ['Annie - how we met.mp4', 'Bob - hello.mp4', 'Bob 2.mp4', 'notes.txt'], albums: { Carol: ['birthday.mp4'] } });
    const r = R({ game: 'person', personWho: 'own' }, m.ctx);
    await waitFor(() => m.played.length === 1);
    const it = r.probe().item;
    check('people from file names AND from a folder per person', ['Annie', 'Bob', 'Carol'].includes(it?.answer), it?.answer);
    check('a clip of that person is playing', m.played.length === 1 && String(m.played[0].path).includes(it.answer === 'Carol' ? 'Carol/' : it.answer));
    check('*** the question is NOT said while the clip plays ***', r.said.length === 0, r.said.join(' | '));
    check('*** and the grammar is closed while it plays (it would hear the clip) ***', r.lastGrammar()?.open === false);
    check('"Who is this?" is on screen already', /Who is this\?/.test(r.host.textContent));
    m.end();
    check('the clip ends: the question is said, with a name offered', /^Who is this\? Is it [A-Za-z ]+\?$/.test(r.last()), r.last());
    check('...and the grammar opens, with every name in it', r.lastGrammar().open && ['annie', 'bob', 'carol'].every((n) => r.lastGrammar().words.includes(n)));
    const wrong = r.probe().candidates.find((c) => c !== it.answer);
    r.eng.hear({ text: wrong, confidence: 0.95 });
    check('*** a miss is GENTLE by default: whose message it was, and listen again ***',
      r.phase() === 'gentle' && r.last() === `That was ${it.answer}'s message. Let's listen again?`, r.last());
    check('*** never "incorrect" ***', !r.said.join(' ').includes('incorrect'));
    const before = r.said.length;
    r.host.querySelector('[data-act="replay"]').click();
    await waitFor(() => m.played.length === 2);   // the clip's address is resolved first
    check('"Listen again" plays the clip again', m.played.length === 2);
    check('...says nothing over it, and stays on the choice (no "another one?" since 2026-10-02)', r.said.length === before && r.phase() === 'gentle');
    m.end();
    check('...and still says nothing when it ends: the choice is on screen', r.said.length === before && r.phase() === 'gentle', r.last());
    await sleep(10);
    check('nothing paid for a miss', r.points().length === 0);
    r.host.querySelector('[data-act="onward"]').click();
    await waitFor(() => m.played.length === 3);
    m.end();
    const it2 = r.probe().item;
    r.eng.hear({ text: it2.answer, confidence: 0.95 });
    check('right: "That was X."', r.phase() === 'celebrate' && r.last() === `Yes! That was ${it2.answer}.`, r.last());
    await sleep(10);
    const pts = r.points();
    check('one point, and *** the points log does not carry anybody\'s name ***', pts.length === 1
      && !/annie|bob|carol/i.test(JSON.stringify(pts)), JSON.stringify(pts));
    r.inst.destroy();
    check('destroy stops the clip', !m.playing());
  }

  section('name that person set to the standard flow, and a clip that fails');
  {
    const m = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol.mp4'] });
    const r = R({ game: 'person', personWho: 'own', personMiss: 'standard' }, m.ctx);
    await waitFor(() => m.played.length === 1);
    m.fail();
    check('a clip that will not play does not strand the question: it is asked', /Who is this\?/.test(r.last()), r.last());
    const it = r.probe().item;
    const wrong = r.probe().candidates.find((c) => c !== it.answer);
    r.eng.hear({ text: wrong, confidence: 0.95 });
    check('"standard": Mike’s line, the hint (first letter)',
      r.last().startsWith(`It sounded like you said ${wrong}. That is incorrect. Here is a hint: it starts with ${it.answer[0].toUpperCase()}.`), r.last());
    r.eng.hear({ text: it.answer.toLowerCase(), confidence: 0.95 });
    check('...a name said in lower case is still right', r.phase() === 'celebrate');
    r.inst.destroy();
  }

  section('*** SAY THE NAME BY DEFAULT, NOT "IS IT A COW?" (Mike\'s brain-games ruling, 2026-10-02 late, carried here) ***');
  {
    const m = getManifest(GAME);
    const mount = (saved) => ship(saved);
    const right = (r) => r.probe().item.answer;
    answerByChecks({ check, mount, type: GAME, name: 'animal', saved: { game: 'animal' }, defaults: DEFAULTS, manifest: m, right });
    answerByChecks({ check, mount, type: GAME, name: 'state', saved: { game: 'state' }, defaults: DEFAULTS, manifest: m, right });
    const s = ship({ game: 'state' });
    const other = STATES.find((x) => !s.probe().candidates.includes(x.answer)).answer;
    s.inst.impl.hear({ text: other, confidence: 0.95 });
    check('*** a state that is not one of the three on screen is still heard, and is a miss ***', s.probe().misses === 1, s.last());
    s.inst.destroy();
    // The person game: the clip first, then "Who is this?" with nothing offered after it.
    const md = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol.mp4'] });
    const p = ship({ game: 'person', personWho: 'own' }, md.ctx);
    await waitFor(() => md.played.length === 1);
    md.end();
    check('person: when the clip ends, "Who is this?" and NO name offered', p.last() === LINES.askPerson && p.probe().offers === 'choices', p.last());
    p.inst.impl.hear({ text: p.probe().item.answer, confidence: 0.95 });
    check('person: saying the name is right', p.phase() === 'celebrate');
    p.inst.destroy();
  }

  // =====================================================================================
  section('*** HARDER LEVELS (row 2.63): every question has a difficulty, in the words question packs use ***');
  {
    const words = Object.keys(DIFFICULTY_LEVELS);
    for (const [name, list] of [['animal', ANIMAL_BANK], ['state', STATE_BANK]]) {
      check(`${name}: every question is very easy, easy, medium or hard, with its ladder level`,
        list.every((q) => words.includes(q.difficulty) && q.level === DIFFICULTY_LEVELS[q.difficulty] && q.id), JSON.stringify(list.find((q) => !words.includes(q.difficulty))));
      const have = words.filter((w) => list.some((q) => q.difficulty === w));
      check(`*** ${name}: all four levels have questions (${have.join(', ')}) ***`, have.length === 4, have.join(','));
      check(`${name}: every id is unique`, new Set(list.map((q) => q.id)).size === list.length);
    }
    check('each game on the ladder under its own name', GAMES.map(ladderGame).join() === 'name_animal,name_state,name_person');
    check('the animal sounds are the easiest; what an animal looks like is the next level',
      ANIMALS.find((a) => a.answer === 'cow').difficulty === 'very easy' && ANIMALS.find((a) => a.answer === 'elephant').difficulty === 'easy');
    const badDecoys = ANIMALS.filter((a) => a.decoys && (a.decoys.length < 2 || a.decoys.some((d) => d === a.answer || !ANIMALS.some((x) => x.answer === d))));
    check('*** every animal decoy is another animal in the game (so it is heard, and judged wrong) ***', badDecoys.length === 0, badDecoys.map((a) => a.answer).join(','));
    check('medium and hard animals are offered beside animals easy to mix them up with', ANIMALS.filter((a) => ['medium', 'hard'].includes(a.difficulty)).every((a) => a.decoys));
    check('hard states are asked from their CAPITAL', STATE_CAPITALS.length >= 45 && STATE_CAPITALS.every((s) => s.kind === 'capital' && s.difficulty === 'hard'));
    check('*** no state is asked from a capital that names it (Oklahoma City, Indianapolis) ***',
      STATE_CAPITALS.every((s) => !s.capital.toLowerCase().includes(s.answer.toLowerCase())));
    check('the nickname questions are very easy to medium; fifty of them still', STATES.length === 50 && STATES.every((s) => s.kind === 'nickname' && s.level <= 3));
    check('a capital question\'s hints never name the state', STATE_CAPITALS.every((s) => s.hints.every((h) => !h.toLowerCase().includes(s.answer.toLowerCase()))));
  }

  section('*** THE LADDER: each player at their own level (row 2.63) ***');
  {
    const ladderStore = () => { let d = {}; const subs = new Set(); return { get: () => d, set: (p) => { d = { ...d, ...p }; for (const f of [...subs]) f(d); },
      load: async () => d, flush: async () => {}, subscribe: (fn) => { subs.add(fn); return () => subs.delete(fn); }, startPolling() {}, destroy() {} }; };
    const L = (saved = {}, extra = {}, store = ladderStore()) => Object.assign(
      rig('name_that', { saved: { answerBy: 'yesno', ...saved }, extra: { makeState: (k) => (k === 'ratings' ? store : null), ...extra } }),
      { ladder: store, session: function () { return this.inst.impl.__session; } });
    for (const g of ['animal', 'state']) {
      const r = L({ game: g });
      const lv = [];
      for (let i = 0; i < 8; i++) { lv.push(r.probe().item.level); r.eng.skip(); }
      check(`*** ${g}: a new player is asked very easy and easy questions only (levels ${[...new Set(lv)].join(',')}) ***`, lv.every((l) => l <= 2), lv.join(','));
      r.inst.destroy();
      const h = L({ game: g, startLevel: 4, adapt: false });
      check(`*** ${g}: a player started at the hardest level is asked hard questions ***`, h.probe().item.difficulty === 'hard', JSON.stringify(h.probe().item));
      h.inst.destroy();
    }
    const c = L({ game: 'state', startLevel: 4, adapt: false });
    const it = c.probe().item;
    check('*** a hard state: "Which state has X as its capital?", with the capital on the card ***',
      c.said[0].startsWith(`Which state has ${it.capital} as its capital?`) && c.host.querySelector('.qz-card')?.textContent === it.capital, c.said[0]);
    const region = STATES.filter((s) => s.region === it.region).map((s) => s.answer);
    check('...and the other two names offered are from the same region', c.probe().candidates.every((n) => region.includes(n)), c.probe().candidates.join(','));
    c.eng.hear({ text: it.answer, confidence: 0.95 });
    check('...right: "X is the capital of Y."', c.last() === `Yes! ${it.capital} is the capital of ${it.answer}.`, c.last());
    c.inst.destroy();
    const a = L({ game: 'animal', startLevel: 4, adapt: false });
    const ai = a.probe().item;
    check('a hard animal is offered beside its own decoys', a.probe().candidates.filter((n) => n !== ai.answer).every((n) => ai.decoys.includes(n)), a.probe().candidates.join(','));
    a.eng.hear({ text: ai.answer, confidence: 0.95 });
    const row = a.session().playerRow(a.session().currentPlayer().id, 'name_animal');
    check('a right answer goes on the ladder, once', row.n === 1, JSON.stringify(row));
    a.inst.destroy();
    const t = L({ game: 'animal', players: 'Ann, Bob' });
    check('*** two players: "Ann, your turn." in front of the question, and her name on screen ***',
      t.said[0].startsWith('Ann, your turn. ') && t.host.querySelector('.qz-turn')?.dataset.turn === 'name:ann', t.said[0]);
    t.inst.destroy();
    const m = getManifest(GAME);
    for (const k of ['players', 'gameStart', 'adapt', 'startLevel'])
      check(`the ladder's "${k}" row is in the settings`, m.settings.some((s) => s.key === k));
  }

  section('*** NAME THAT PERSON\'S TWO LEVELS: seeing them, then hearing them only (row 2.63) ***');
  {
    const md = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol - hello.mp3', 'Carol - hello.jpg', 'Dee.mp3'] });
    const r = R({ game: 'person', personWho: 'own', startLevel: 2, adapt: false }, md.ctx);
    await waitFor(() => md.played.length === 1);
    const it = r.probe().item;
    check('*** level 2: the message plays as SOUND ONLY (nothing of them on screen) ***', it.level === 2 && it.voiceOnly === true && md.played[0].voiceOnly === true, JSON.stringify(md.played[0]));
    check('...and no picture is fetched for it', !md.played[0].pictureUrl);
    md.end();
    r.inst.destroy();
    const md1 = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol - hello.mp3', 'Carol - hello.jpg', 'Dee.mp3'] });
    const s = R({ game: 'person', personWho: 'own', levelsAtOnce: 1, adapt: false }, md1.ctx);
    await waitFor(() => md1.played.length === 1);
    const it1 = s.probe().item;
    check('*** level 1: a video, or a voice WITH its picture ***', it1.level === 1 && md1.played[0].voiceOnly === false
      && (md1.played[0].kind === 'video' || !!md1.played[0].pictureUrl), JSON.stringify(md1.played[0]));
    const bank = s.inst.impl.__session.allQuestions('name_person');
    check('a person heard only with no picture (Dee) has only the voice question; the others have both',
      bank.filter((q) => q.answer === 'Dee').map((q) => q.level).join() === '2'
      && ['Annie', 'Bob', 'Carol'].every((n) => bank.filter((q) => q.answer === n).map((q) => q.level).sort().join() === '1,2'), JSON.stringify(bank.map((q) => [q.answer, q.level])));
    check('*** the ladder\'s question ids do not carry anybody\'s name ***', bank.every((q) => !/annie|bob|carol|dee/i.test(q.id)), bank.map((q) => q.id).join(','));
    md1.end();
    s.inst.destroy();
  }

  section('*** KNOWN PEOPLE AND CHARACTERS (row 2.63, Mike 2026-10-07: "who came up with the theory of relativity or which character did this") ***');
  {
    // Made-up questions in the shape Trivia's rows have (triviaPackRows); the real packs are checked at the end.
    const ROWS = [
      { question: 'Who painted the blue barn?', answer: 'Ada Lane', wrong: ['Bo Ruiz', 'Cy Moss', 'Di Park'], level: 3, answerKind: 'person',
        explain: 'Ada Lane painted the blue barn.', sources: [{ url: 'https://example.org/barn', title: 'Example' }] },
      { question: 'Which puppet sings in the tin band?', answer: 'Tobo', wrong: ['Rilla', 'Mux'], level: 1, answerKind: 'character' },
      { question: 'Who rode the red bike first?', answer: 'Eve Holt', wrong: ['Fin Ott', 'Gus Ray', 'Hal Ng'], level: 4, answerKind: 'person' },
      { question: 'What colour is the barn?', answer: 'Blue', wrong: ['Red', 'Green', 'Grey'], level: 1 },
      { question: 'Who only has one wrong name?', answer: 'Ivo Pell', wrong: ['Jo Wu'], level: 2, answerKind: 'person' },
    ];
    const bank = knownBank(ROWS);
    check('only questions whose answer is a person or a character, with two wrong names at least', bank.length === 3
      && bank.every((q) => isKnown(q) && PERSON_KINDS.includes(q.answerKind)), JSON.stringify(bank.map((q) => q.answer)));
    check('*** a known-people question starts at easy at the lowest: very easy is our own people ***',
      KNOWN_FLOOR === 2 && bank.find((q) => q.answer === 'Tobo').level === 2 && bank.find((q) => q.answer === 'Eve Holt').level === 4);
    check('its id is the question key the "this question is wrong" log uses', bank.every((q) => q.id === `known:${q.key}`));
    const ada = bank.find((q) => q.answer === 'Ada Lane');
    check('judged by name: the whole name, a surname alone, a wrong name', KNOWN_ADAPTER.judge(ada, 'it was Ada Lane') === true
      && KNOWN_ADAPTER.judge(ada, 'Lane') === true && KNOWN_ADAPTER.judge(ada, 'Bo Ruiz') === false && KNOWN_ADAPTER.judge(ada, '') === null);
    const cands = KNOWN_ADAPTER.candidates(ada, DEFAULTS, () => 0.4);
    check('three names offered: the answer and two of its wrong ones', cands.length === 3 && cands.includes('Ada Lane')
      && cands.filter((c) => ada.wrong.includes(c)).length === 2, cands.join(','));
    check('hints: a wrong name taken away, then the first letter', KNOWN_ADAPTER.hint(ada, 1, DEFAULTS) === 'it is not Bo Ruiz'
      && KNOWN_ADAPTER.hint(ada, 2, DEFAULTS) === 'it starts with A');
    check('its explanation is the pack\'s, else "The answer is X."', KNOWN_ADAPTER.explain(ada, 'Ada Lane', DEFAULTS) === ada.explain
      && KNOWN_ADAPTER.explain(bank.find((q) => q.answer === 'Tobo'), '', DEFAULTS) === 'The answer is Tobo.');
    check('the source line after the answer (plain words on a screen)', /Source: Example/.test(knownSourceHtml(ada)) && !/<a /.test(knownSourceHtml(ada))
      && /<a /.test(knownSourceHtml(ada, { onScreen: false })));
    const m = getManifest(GAME);
    const who = m.settings.find((s) => s.key === 'personWho');
    check('*** "who to ask about": both by default, only our own (the game as it was), or only known people ***',
      who?.default === 'both' && (who.options || []).map((o) => o.value).join() === 'both,own,known' && PERSON_WHO.join() === 'both,own,known');
    const known = { knownPeopleRows: async () => ROWS };

    // No media source at all, the default: the game plays known people instead of saying "connect a source".
    const none = media({ sources: [] });
    const r = R({ game: 'person' }, { ...none.ctx, ...known });
    await waitFor(() => r.probe().item && r.phase() === 'asking');
    const it = r.probe().item;
    check('*** no messages of our own: known people are asked, as text, no clip ***', isKnown(it) && none.played.length === 0
      && r.said[0]?.startsWith(it.question), JSON.stringify([it, r.said[0]]));
    check('...a new player gets easy ones first (level 2)', it.level === 2, String(it.level));
    check('...no "Listen again", nothing on the left', !r.host.querySelector('[data-act="replay"]') && !r.host.querySelector('[data-media]'));
    const wrong = r.probe().candidates.find((c) => c !== it.answer);
    r.eng.hear({ text: wrong, confidence: 0.95 });
    check('*** a miss on a known person is the usual flow, not the gentle one ***', /That is incorrect/.test(r.last()) && r.phase() !== 'gentle', r.last());
    r.eng.hear({ text: it.answer, confidence: 0.95 });
    check('right: celebrated, and recorded on Name that person\'s ladder', r.phase() === 'celebrate'
      && r.inst.impl.__session.playerRow(r.inst.impl.__session.currentPlayer().id, 'name_person').n === 1);
    r.inst.destroy();

    // Our own people AND known people: both on one ladder.
    const md = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol.mp4'] });
    const b = R({ game: 'person', levelsAtOnce: 1, adapt: false }, { ...md.ctx, ...known });
    await waitFor(() => md.played.length === 1);
    check('*** both: a new player starts with our own people (very easy, a clip) ***', !isKnown(b.probe().item) && b.probe().item.level === 1);
    const all = b.inst.impl.__session.allQuestions('name_person');
    check('...and the ladder holds both kinds', all.some(isKnown) && all.some((q) => !isKnown(q)), String(all.length));
    md.end();
    b.inst.destroy();
    const h = R({ game: 'person', startLevel: 4, adapt: false }, { ...media({ flat: ['Annie.mp4', 'Bob.mp4'] }).ctx, ...known });
    await waitFor(() => h.probe().item);
    check('...started at hard: a hard known-people question', isKnown(h.probe().item) && h.probe().item.answer === 'Eve Holt', JSON.stringify(h.probe().item));
    h.inst.destroy();

    // Only known people: messages present, never played.
    const mk = media({ flat: ['Annie.mp4', 'Bob.mp4', 'Carol.mp4'] });
    const k = R({ game: 'person', personWho: 'known' }, { ...mk.ctx, ...known });
    await waitFor(() => k.probe().item);
    for (let i = 0; i < 5; i++) { check(`known only, question ${i + 1}: a known person, no clip`, isKnown(k.probe().item) && mk.played.length === 0); k.eng.skip(); }
    k.inst.destroy();

    // The real packs, as Trivia reads them: the shipped ones carry tagged people (web/tools/tag_answer_kinds.py).
    const real = knownBank(await triviaPackRows({ reviews: null }));
    check(`*** the shipped packs' tagged people are drawn (${real.length}) ***`, real.length >= 12
      && real.some((q) => q.answer === 'Jane Austen') && real.every((q) => q.level >= KNOWN_FLOOR), String(real.length));
  }

  section('*** THE LEVEL FOLLOWS THE PERSON, with "Start this game at" and their usual start (row 2.63) ***');
  for (const g of ['animal', 'state']) {
    await personLadderChecks({ check, name: `Name that ${g}`, game: ladderGame(g), saved: { game: g },
      mount: ({ saved, store, extra }) => rig('name_that', { saved: { answerBy: 'yesno', ...saved },
        extra: { makeState: (k) => (k === 'ratings' ? store : null), ...extra } }) });
  }

  finish();
} catch (err) { finish(err); }
</script>
</body>
</html>
