<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>subtitles — what is said near the screen, written on it — test</title>
<link rel="stylesheet" href="../layers.css">
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem} h2{font-size:.95rem;margin:16px 0 4px}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #under{position:fixed;inset:0;opacity:0}
  .answers{position:fixed;left:0;right:0;height:120px}
</style>
</head>
<body>
<h1>subtitles</h1>
<p>Row 2.42. Subtitles is a MODE, off by default. Each line has words and a speaker; the speaker is a
guess that changes the LABEL and never whether the line is shown. Mike: <i>"My worry is that it won't
always pick her up as her so some things will be missed."</i></p>
<div id="host"></div>
<div id="results"></div>
<div id="summary">running…</div>

<script type="module">
import {
  createSubtitles, speakerLabel, placeSubtitles, devicePrior, subtitlesOptionsFrom,
  SUBTITLES_DEFAULTS, SUBTITLES_FIELDS, SUBTITLE_SIZES, ANSWER_AREA_SELECTORS,
  captionPieces, earLabel, SUBTITLE_ACTIONS,
  resolveSubtitleStyle, eyeChartFontSize, SUBTITLE_STYLES, SUBTITLE_STYLE_VAR, SUBTITLE_STYLE_FALLBACK,
} from '../subtitles.js';
import { createOutputBus } from '../output.js';
import { defaultChannels } from '../output_channels.js';
import { THEMES, applyTheme, contrast } from '../theme.js';
import { normalizeField } from '../settings_fields.js';
import { auditFields } from '../settings_audit.js';

const out = document.getElementById('results');
let passed = 0, failed = 0;
function check(name, cond, detail = '') {
  const ok = !!cond; ok ? passed++ : failed++;
  const d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(d);
}
function section(t) { const h = document.createElement('h2'); h.textContent = t; out.append(h); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function fakeClock() {
  let t = 0; let n = 1; const timers = new Map();
  return {
    now: () => t,
    setTimer: (fn, ms) => { const id = n++; timers.set(id, { at: t + ms, fn }); return id; },
    clearTimer: (id) => { timers.delete(id); },
    advance(ms) { t += ms; for (const [id, x] of [...timers].sort((a, b) => a[1].at - b[1].at)) if (x.at <= t) { timers.delete(id); x.fn(); } },
    pending: () => timers.size,
  };
}
const rgb = (s) => { const m = String(s).match(/rgba?\(([^)]+)\)/); if (!m) return null;
  const p = m[1].split(',').map((x) => parseFloat(x)); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; };
const hex = ({ r, g, b }) => '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
const host = document.getElementById('host');

(async () => {
try {
  section('*** a MODE: off by default, and its settings pass the audit ***');
  check('*** subtitles are OFF by default (a profile turns them on; this file never does) ***',
    SUBTITLES_DEFAULTS.on === false && SUBTITLES_FIELDS.find((f) => f.key === 'subtitlesOn').default === false);
  const bad = auditFields(SUBTITLES_FIELDS.map(normalizeField).filter(Boolean), { type: 'subtitles' })
    .filter((f) => f.severity === 'error');
  check('the settings pass the settings audit', bad.length === 0, JSON.stringify(bad));
  check('a duration is stored in ms', SUBTITLES_FIELDS.some((f) => f.key === 'subtitlesHoldMs'));
  check('the options read from a settings row, broken values falling back',
    subtitlesOptionsFrom({ subtitlesOn: true, subtitlesLines: 99, subtitlesSize: 'huge' }).on === true
    && subtitlesOptionsFrom({ subtitlesLines: 99 }).lines === SUBTITLES_DEFAULTS.lines
    && subtitlesOptionsFrom({ subtitlesSize: 'huge' }).size === 'large'
    && subtitlesOptionsFrom({ subtitlesOn: 'yes' }).on === false);

  section('*** the speaker display rule ***');
  check('no speaker is Unknown', speakerLabel(null).label === 'Unknown' && speakerLabel(undefined).kind === 'unknown');
  check('a confident match is named', speakerLabel({ name: 'Alex', confidence: 0.95 }).label === 'Alex');
  check('*** an unsure match is marked unsure, with the guess ***',
    speakerLabel({ name: 'Alex', confidence: 0.6 }).label === 'Unsure (maybe Alex)'
    && speakerLabel({ name: 'Alex', confidence: 0.6 }).kind === 'unsure');
  check('a very weak match is Unknown', speakerLabel({ name: 'Alex', confidence: 0.1 }).kind === 'unknown');
  check('*** a name with no confidence is never shown plainly ***',
    speakerLabel({ name: 'Alex' }).kind === 'unsure' && speakerLabel({ name: 'Alex', confidence: 'x' }).kind === 'unsure');
  check('*** only people who set themselves up are named: a name off the list is Unknown ***',
    speakerLabel({ name: 'Stranger', confidence: 0.99 }, { enrolled: ['Alex', 'Sam'] }).kind === 'unknown'
    && speakerLabel({ name: 'sam', confidence: 0.99 }, { enrolled: ['Alex', 'Sam'] }).kind === 'named');
  check('the screen’s own lines are labelled as the screen', speakerLabel({ self: true }).kind === 'screen');
  check('garbage is Unknown, not an error',
    speakerLabel(42).kind === 'unknown' && speakerLabel({ name: 7, confidence: 1 }).kind === 'unknown');
  check('the threshold is a setting', speakerLabel({ name: 'Alex', confidence: 0.7 }, { sureAt: 0.6 }).kind === 'named');
  check('a phone usually with somebody makes them likely, never certain',
    speakerLabel(devicePrior({ near: 'Alex' })).label === 'Unsure (maybe Alex)' && devicePrior({}) === null);

  section('*** THE RULE: a line is never dropped because of who said it ***');
  {
    const clock = fakeClock();
    const subs = createSubtitles(host, { settings: { subtitlesOn: true }, now: clock.now,
      setTimer: clock.setTimer, clearTimer: clock.clearTimer, reducedMotion: false });
    const a = subs.add({ text: 'I want some water', source: 'phone', speaker: { name: 'Alex', confidence: 0.5 } });
    check('*** an UNSURE match is SHOWN — the words, with the name marked as a guess ***',
      !!a && subs.lines().length === 1 && /I want some water/.test(subs.element().textContent)
      && /Unsure \(maybe Alex\)/.test(subs.element().textContent), subs.element().textContent);
    const b = subs.add({ text: 'still here', speaker: { name: 'Alex', confidence: 0.01 } });
    check('*** a match too weak to guess is still SHOWN, as Unknown ***', !!b && b.who.kind === 'unknown'
      && /still here/.test(subs.element().textContent));
    const c = subs.add({ text: 'and again', speaker: { garbage: true, confidence: NaN } });
    check('*** a broken speaker is still SHOWN ***', !!c && /and again/.test(subs.element().textContent));
    subs.update({ subtitlesOn: true, subtitlesLines: 6 });
    const d = subs.add({ text: 'named', speaker: { name: 'Nobody', confidence: 1 } });
    check('a speaker off the enrolled list is shown too', !!d);
    let dropped = 0;
    for (const conf of [0, 0.2, 0.39, 0.4, 0.5, 0.79, 0.8, 1, NaN, -1, 2, null, undefined, 'x']) {
      if (!subs.add({ text: `line ${conf}`, speaker: { name: 'Alex', confidence: conf } })) dropped++;
    }
    check('*** swept every kind of confidence: not one line dropped ***', dropped === 0, `dropped ${dropped}`);
    check('what the recogniser could not make out is shown, not lost',
      subs.add({ text: '[unk]' })?.text === SUBTITLES_DEFAULTS.unclearText);
    check('empty text is the one thing that shows nothing', subs.add({ text: '   ' }) === null && subs.add({}) === null);
    subs.destroy();
  }

  section('*** a mode: off keeps nothing ***');
  {
    const subs = createSubtitles(host, { reducedMotion: false });
    check('*** with the mode off a line is not shown and not kept ***',
      subs.add({ text: 'private' }) === null && subs.lines().length === 0 && subs.element().hidden === true);
    subs.setOn(true);
    subs.add({ text: 'hello' });
    check('turned on, it shows', subs.lines().length === 1 && subs.element().hidden === false);
    subs.setOn(false);
    check('*** turned off, the screen is cleared and nothing is kept ***',
      subs.lines().length === 0 && subs.element().hidden === true && subs.element().children.length === 0);
    subs.destroy();
    check('destroy takes its element with it', !host.querySelector('.subs'));
  }

  section('a few lines of history, each going by itself');
  {
    const clock = fakeClock();
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesLines: 3, subtitlesHoldMs: 15000 },
      now: clock.now, setTimer: clock.setTimer, clearTimer: clock.clearTimer, reducedMotion: false });
    for (const t of ['one', 'two', 'three', 'four']) subs.add({ text: t });
    check('only the last few lines are on screen', subs.lines().map((l) => l.text).join() === 'two,three,four',
      subs.lines().map((l) => l.text).join());
    check('...oldest first, newest at the bottom', subs.element().lastElementChild.textContent.includes('four'));
    clock.advance(14999);
    check('a line stays for its time', subs.lines().length === 3);
    clock.advance(1);
    check('*** ...then goes by itself — nothing waits for a press ***', subs.lines().length === 0 && subs.element().hidden === true);
    subs.update({ subtitlesOn: true, subtitlesHoldMs: 0 });
    subs.add({ text: 'kept' });
    clock.advance(10 * 60000);
    check('"until newer lines replace it" keeps a line', subs.lines().length === 1);
    subs.destroy();
  }

  section('*** the site’s own speech: tapped from the speech channel ***');
  {
    const spoken = [];
    const fakeSpeech = { name: 'speech', concurrency: 1, available: () => true,
      present(item, { done }) { spoken.push(item.text); done(); return null; } };
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesLines: 6, subtitlesHoldMs: 0 },
      boardSpeaker: () => ({ name: 'Alex' }), reducedMotion: false });
    const bus = createOutputBus({ channels: { speech: subs.tap(fakeSpeech) }, routing: { status: [], say: ['speech'], notify: [], alert: ['speech'] } });
    bus.say('Good morning');
    check('*** what the screen says is written as it is said ***',
      spoken.join() === 'Good morning' && subs.lines().some((l) => l.text === 'Good morning' && l.who.kind === 'screen'),
      JSON.stringify(subs.lines()));
    bus.emit({ verb: 'say', text: 'I love you', source: 'board' });
    check('*** the talking board’s words are the PERSON’s, named ***',
      subs.lines().some((l) => l.text === 'I love you' && l.who.kind === 'named' && l.who.label === 'Alex'));
    bus.setMuted('speech', true);
    bus.say('not said');
    check('what is muted is not said, so it is not written', !subs.lines().some((l) => l.text === 'not said'));
    bus.setMuted('speech', false);
    subs.update({ subtitlesOn: true, subtitlesScreen: false, subtitlesHoldMs: 0, subtitlesLines: 6 });
    bus.say('quiet one');
    check('"include what the screen says" off: spoken, not written',
      spoken.includes('quiet one') && !subs.lines().some((l) => l.text === 'quiet one'));
    const tapped = [];
    const spy = { tap: (a) => { tapped.push(a); return a; } };
    const ch = defaultChannels({ captions: spy });
    check('defaultChannels taps the speech channel when handed subtitles',
      !ch.speech || (tapped.length === 1 && tapped[0].name === 'speech'));
    check('...and nothing else', tapped.every((a) => a.name === 'speech'));
    bus.destroy(); subs.destroy();
  }

  section('the recogniser’s words');
  {
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0 }, reducedMotion: false });
    const a = subs.heard({ text: 'hello there', verb: null, woke: false });
    check('*** what the recogniser heard is shown, as Unknown when nobody is identified ***',
      a && a.who.kind === 'unknown' && a.source === 'room');
    const b = subs.heard({ text: 'water please' }, { source: 'phone', speaker: devicePrior({ near: 'Alex' }) });
    check('from the pillow phone: shown, marked "Unsure (maybe …)"', b && b.who.label === 'Unsure (maybe Alex)' && b.source === 'phone');
    subs.destroy();
  }

  section('*** non-modal, large, still when asked ***');
  {
    const under = document.createElement('button');
    under.id = 'under'; under.textContent = 'a control under the subtitles';
    document.body.append(under);
    under.focus();
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0 }, reducedMotion: true });
    const el = subs.element();
    for (let i = 0; i < 50 && getComputedStyle(el).position !== 'fixed'; i++) await sleep(50);
    subs.add({ text: 'Can you hear me?' });
    check('its stylesheet arrived', getComputedStyle(el).position === 'fixed', getComputedStyle(el).position);
    check('it is a polite log to a screen reader, never an alert',
      el.getAttribute('role') === 'log' && el.getAttribute('aria-live') === 'polite');
    check('*** it takes no focus ***', document.activeElement === under);
    check('*** it takes no presses ***', getComputedStyle(el).pointerEvents === 'none');
    const box = el.getBoundingClientRect();
    const hit = document.elementFromPoint(box.left + box.width / 2, box.top + box.height / 2);
    check('*** a press on it reaches whatever is underneath ***', hit === under, hit && (hit.id || hit.className));
    const px = parseFloat(getComputedStyle(el.querySelector('.subs-line')).fontSize);
    check('*** large: at least 24px ***', px >= 24, String(px));
    check('*** reduced motion: no animation ***', el.classList.contains('subs-still')
      && getComputedStyle(el.querySelector('.subs-line')).animationName === 'none',
      getComputedStyle(el.querySelector('.subs-line')).animationName);
    subs.setReducedMotion(false);
    check('...and it can be turned back', !el.classList.contains('subs-still'));
    subs.update({ subtitlesOn: true, subtitlesSize: 'largest', subtitlesHoldMs: 0 });
    const px2 = parseFloat(getComputedStyle(el.querySelector('.subs-line')).fontSize);
    check('a bigger size is bigger', px2 > px, `${px} -> ${px2}`);

    section('*** readable on every theme (measured) ***');
    const worst = [];
    for (const [id, t] of Object.entries(THEMES)) {
      const v = t.vars || {};
      const r = contrast(v['--on-dark'], v['--letterbox']);
      if (!(r >= 7)) worst.push(`${id} ${r.toFixed(2)}`);
    }
    check(`*** every theme’s caption pair clears 7:1 (AAA) — ${Object.keys(THEMES).length} themes ***`,
      worst.length === 0, worst.join('; '));
    const measured = [];
    for (const id of Object.keys(THEMES)) {
      applyTheme(document.documentElement, id);
      const line = el.querySelector('.subs-line');
      const fg = rgb(getComputedStyle(line).color); const bg = rgb(getComputedStyle(line).backgroundColor);
      const r = fg && bg && bg.a === 1 ? contrast(hex(fg), hex(bg)) : 0;
      measured.push({ id, r });
    }
    const lowest = measured.reduce((m, x) => (x.r < m.r ? x : m), measured[0]);
    check('*** ...and measured on the rendered line, in the browser, on every theme ***',
      measured.every((x) => x.r >= 7), `lowest ${lowest.id} ${lowest.r.toFixed(2)}`);
    applyTheme(document.documentElement, 'default');
    subs.destroy(); under.remove();
  }

  section('*** it stays out of a game’s answers ***');
  {
    check('bottom when nothing is in the way', placeSubtitles({ viewportH: 800, boxH: 100, avoid: [] }) === 'bottom');
    check('*** top when the bottom would cover an answer ***',
      placeSubtitles({ viewportH: 800, boxH: 100, avoid: [{ top: 650, bottom: 780, width: 400, height: 130 }] }) === 'top');
    check('*** dock when both would — it asks for room rather than cover them ***',
      placeSubtitles({ viewportH: 800, boxH: 100, avoid: [{ top: 0, bottom: 800, width: 400, height: 800 }] }) === 'dock');
    check('something invisible is not in the way',
      placeSubtitles({ viewportH: 800, boxH: 100, avoid: [{ top: 650, bottom: 780, width: 0, height: 0 }] }) === 'bottom');
    check('the known answer rows are looked for, and anything marked data-answer-area',
      ANSWER_AREA_SELECTORS.includes('[data-answer-area]') && ANSWER_AREA_SELECTORS.includes('.choice-card'));

    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0 }, reducedMotion: true });
    const el = subs.element();
    const bottomAns = document.createElement('div');
    bottomAns.className = 'answers'; bottomAns.setAttribute('data-answer-area', ''); bottomAns.style.bottom = '0';
    document.body.append(bottomAns);
    subs.add({ text: 'Which one is bigger?' });
    check('*** a game’s answers at the bottom: the subtitles go to the top ***', el.dataset.place === 'top', el.dataset.place);
    const lb = el.getBoundingClientRect(); const ab = bottomAns.getBoundingClientRect();
    check('...and really do not overlap them on screen', lb.bottom <= ab.top, `${lb.bottom} vs ${ab.top}`);
    const topAns = document.createElement('div');
    topAns.className = 'answers'; topAns.setAttribute('data-answer-area', ''); topAns.style.top = '0';
    document.body.append(topAns);
    subs.add({ text: 'Both rows taken' });
    check('answers at both ends: dock, and the screen is asked to make room',
      el.dataset.place === 'dock' && !!document.documentElement.style.getPropertyValue('--subtitles-reserve'),
      document.documentElement.style.getPropertyValue('--subtitles-reserve'));
    bottomAns.remove(); topAns.remove();
    subs.add({ text: 'clear again' });
    check('gone again: back to the bottom, and the room is given back',
      el.dataset.place === 'bottom' && !document.documentElement.style.getPropertyValue('--subtitles-reserve'));
    subs.destroy();
  }

  // ==== ROW 2.47: SUBTITLES THAT REFINE ====
  section('row 2.47: a fast guess, corrected in place; unsure words marked; scroll back; the crawl; the online route');
  {
    const o = subtitlesOptionsFrom({});
    check('*** defaults: the theme\'s style (rolling up when it names none), unsure words marked, both ears shown, the route LOCAL ***',
      o.styleChoice === 'theme' && o.style === 'flow' && o.lowAt === SUBTITLES_DEFAULTS.lowAt && o.lowAt > 0 && o.ears === 'both' && o.route === 'local');
    check('*** the online route is on ONLY for the exact word "online" - anything broken is local ***',
      subtitlesOptionsFrom({ subtitlesRoute: 'online' }).route === 'online'
      && ['Online', 'cloud', true, 1, null].every((x) => subtitlesOptionsFrom({ subtitlesRoute: x }).route === 'local'));
    const rf = SUBTITLES_FIELDS.find((f) => f.key === 'subtitlesRoute');
    check('...its choice says where the sound goes, and the field defaults to local',
      rf && rf.default === 'local' && rf.options.some((x) => x.value === 'online' && /sends the room’s sound/.test(x.label)));
    check('captionPieces: a word under the threshold is low; one with no number is NOT (no number is not doubt)',
      JSON.stringify(captionPieces({ words: [{ w: 'a', conf: 0.9 }, { w: 'b', conf: 0.2 }, { w: 'c' }] }, { lowAt: 0.6 }).map((p) => p.low)) === '[false,true,false]');
    check('captionPieces: "do not mark" (0) marks nothing',
      captionPieces({ words: [{ w: 'b', conf: 0.1 }] }, { lowAt: 0 })[0].low === false);
    check('captionPieces: a changed word is flagged against what was there',
      JSON.stringify(captionPieces({ text: 'turn it up' }, { before: [{ w: 'turn' }, { w: 'it' }, { w: 'off' }] }).map((p) => p.changed)) === '[false,false,true]');

    const clock = fakeClock();
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 15000, subtitlesLines: 3 },
      now: clock.now, setTimer: clock.setTimer, clearTimer: clock.clearTimer, reducedMotion: false });
    const box = subs.element();
    subs.caption({ id: 'g1', ear: 'room', text: 'computer please', partial: true, words: [] });
    const p1 = box.querySelector('[data-caption="g1"]');
    check('*** a partial shows at once, marked as still being heard ***', !!p1 && p1.classList.contains('subs-partial'));
    subs.caption({ id: 'g1', ear: 'room', text: 'computer please turn it off', words: [
      { w: 'computer', conf: 0.9 }, { w: 'please', conf: 0.9 }, { w: 'turn', conf: 0.5 }, { w: 'it', conf: 0.9 }, { w: 'off', conf: 0.4 }] });
    const low = [...box.querySelectorAll('[data-caption="g1"] .subs-low')].map((e) => e.textContent);
    check('*** the fast guess: its unsure words are marked ***', low.join() === 'turn,off', low.join());
    const lowEl = box.querySelector('.subs-low');
    const cs = getComputedStyle(lowEl);
    check('*** ...by SHAPE, not colour alone: dotted underline and italics, and "not sure" in words ***',
      /dotted/.test(cs.textDecorationStyle || cs.textDecoration) && cs.fontStyle === 'italic' && lowEl.title === 'not sure'
      && cs.color === getComputedStyle(box.querySelector('[data-caption="g1"] .subs-text')).color, `${cs.textDecoration} ${cs.fontStyle}`);
    const before = box.getBoundingClientRect();
    subs.caption({ id: 'g2', ear: 'room', text: 'hello there', words: [{ w: 'hello', conf: 0.9 }, { w: 'there', conf: 0.9 }] });
    const p2 = box.querySelector('[data-caption="g2"]');
    const top1 = p1.getBoundingClientRect().top;
    subs.caption({ id: 'g1', ear: 'room', text: 'computer please turn it up', revised: true, words: [
      { w: 'computer', conf: 0.9 }, { w: 'please', conf: 0.9 }, { w: 'turn', conf: 0.9 }, { w: 'it', conf: 0.9 }, { w: 'up', conf: 0.95 }] });
    const p1b = box.querySelector('[data-caption="g1"]');
    check('*** a later pass corrects the SAME line: same element, same place, nothing re-ordered ***',
      p1b === p1 && box.firstElementChild === p1 && p1.nextElementSibling === p2 && Math.abs(p1.getBoundingClientRect().top - top1) < 1
      && subs.lines().length === 2 && subs.lines()[0].text === 'computer please turn it up' && subs.lines()[0].revised === true);
    check('*** ...the changed word flashes once; the rest does not ***',
      [...p1.querySelectorAll('.subs-fixed')].map((e) => e.textContent).join() === 'up' && !p1.querySelector('.subs-low'));
    subs.caption({ id: 'g1', ear: 'room', text: 'computer please turn it up', revised: true, words: [
      { w: 'computer', conf: 0.9 }, { w: 'please', conf: 0.9 }, { w: 'turn', conf: 0.9 }, { w: 'it', conf: 0.9 }, { w: 'up', conf: 0.95 }] });
    check('the same words again (the line closing) redraw nothing: the highlight is not lost', !!p1.querySelector('.subs-fixed'));
    subs.caption({ id: 'g1', ear: 'room', text: '' });
    check('a later pass that heard NOTHING keeps what was shown (words are never taken away by a blank)',
      subs.lines()[0].text === 'computer please turn it up');
    // Two ears.
    subs.caption({ id: 'g3', ear: 'room', text: 'I would like some water', agreed: false,
      others: [{ ear: 'phone1', text: 'I would like some coffee', confidence: 0.6 }] });
    const alt = box.querySelector('[data-caption="g3"] .subs-alt');
    check('*** two ears disagree: both are shown, the other introduced in words ("Phone heard: ...") ***',
      !!alt && alt.textContent === 'Phone heard: I would like some coffee', alt?.textContent);
    subs.caption({ id: 'g4', ear: 'room', text: 'yes', agreed: true, others: [] });
    check('two ears agree: one line, marked agreed', box.querySelector('[data-caption="g4"]').classList.contains('subs-agreed'));
    check('the line from a phone ear is sourced "phone"', subs.caption({ id: 'g5', ear: 'phone1', text: 'from the pillow' }).source === 'phone');
    check('earLabel names what a person would call it', earLabel('phone2') === 'Phone' && earLabel('room') === 'Room microphone');
    // Scroll back.
    check('only the last three are on screen', subs.lines().length === 3);
    check('*** everything since the mode came on is kept (in memory) to scroll back through ***', subs.history().length === 5);
    const n = subs.earlier();
    const hist = box.querySelector('.subs-hist');
    check('*** earlier(): the older lines are drawn, the live ones step aside ***',
      n === 3 && !!hist && box.classList.contains('subs-back') && /computer please turn it up/.test(hist.textContent)
      && /lines? back|The start/.test(hist.textContent) && getComputedStyle(box.querySelector('[data-caption="g5"]')).display === 'none', hist?.textContent);
    subs.caption({ id: 'g6', ear: 'room', text: 'something new' });
    check('a new line while looking back does not yank the view', subs.scrolledBack() === 4 && /computer please/.test(box.querySelector('.subs-hist').textContent));
    clock.advance(SUBTITLES_DEFAULTS.backMs + 1);
    check('*** NEVER A STATE ONLY AN INPUT CAN LEAVE: back to the latest lines by itself ***',
      subs.scrolledBack() === 0 && !box.querySelector('.subs-hist') && !box.classList.contains('subs-back'));
    subs.earlier(); subs.latest();
    check('latest() returns at once', subs.scrolledBack() === 0);
    check('the scroll-back actions exist for a switch, bound to nothing by default',
      SUBTITLE_ACTIONS.map((a) => a.id).join() === 'subtitles/earlier,subtitles/latest' && SUBTITLE_ACTIONS.every((a) => a.topic));
    subs.setOn(false);
    check('*** turned off: the history is gone too (nothing kept, nothing to scroll back to) ***',
      subs.history().length === 0 && subs.earlier() === 0);
    subs.setOn(true);
    const off = createSubtitles(host, { settings: {} });
    check('*** a caption with the mode off is not shown and not kept ***', off.caption({ id: 'x', text: 'private' }) === null
      && off.history().length === 0);
    off.destroy();
    const bad = auditFields(SUBTITLES_FIELDS.map(normalizeField).filter(Boolean), { type: 'subtitles' }).filter((f) => f.severity === 'error');
    check('the new fields pass the settings audit', bad.length === 0, JSON.stringify(bad));
    subs.destroy();
  }

  section('*** a corrected word\'s outline restarts at most once a flash period ***');
  {
    const { worstInAnySecond } = await import('../flash_limit.js');
    const { SUBS_FIX_MS } = await import('../subtitles.js');
    const cssText = await fetch('../subtitles.css').then((r) => r.text());
    check('the outline length in JS matches the stylesheet (1.2 s)', SUBS_FIX_MS === 1200 && /\.subs-fixed\s*\{\s*animation:\s*subs-fix 1\.2s/.test(cssText));
    // A recogniser flipping the last word every `gap` ms for ten seconds. An ONSET is a draw whose
    // outlined words start their outline fresh (no negative delay).
    const churn = (L, gap) => {
      const clock = fakeClock();
      const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0 },
        now: clock.now, setTimer: clock.setTimer, clearTimer: clock.clearTimer, reducedMotion: false,
        ...(L !== undefined ? { flashLimit: () => L } : {}) });
      const box = subs.element();
      const onsets = []; let marked = 0, passes = 0, right = true;
      for (let t = 0; t <= 10000; t += gap) {
        const text = `turn it ${passes % 2 ? 'up' : 'off'}`;
        subs.caption({ id: 'x', ear: 'room', text });
        passes++;
        const p = box.querySelector('[data-caption="x"]');
        if (p.querySelector('.subs-text').textContent !== text) right = false;
        const fx = [...p.querySelectorAll('.subs-fixed')];
        if (fx.length) marked++;
        if (fx.length && fx.every((e) => !e.style.animationDelay)) onsets.push(clock.now());
        clock.advance(gap);
      }
      subs.destroy();
      return { worst: worstInAnySecond(onsets), onsets, marked, passes, right };
    };
    check('(before: a pass every 100 ms restarted the outline 11 times in a closed second)',
      worstInAnySecond(Array.from({ length: 101 }, (_, k) => k * 100)) === 11);
    for (const L of [3, 1]) {
      for (const gap of [100, 250]) {
        const c = churn(L, gap);
        check(`limit ${L}, a correction every ${gap} ms: worst second ${c.worst} fresh outlines (<= ${L}); every pass corrected and marked`,
          c.worst <= L && c.worst >= 1 && c.right && c.marked === c.passes - 1, JSON.stringify({ w: c.worst, m: c.marked, p: c.passes }));
      }
    }
    // 2026-10-01 (Mike): no flash limit unless one is set, so a host that passes none is not limited -
    // every correction gets its own fresh outline, as before the audit.
    const d = churn(undefined, 100);
    check('*** a host with no limit is not held: every correction gets a fresh outline ***',
      d.onsets.length === d.passes - 1 && d.worst > 3 && d.right, JSON.stringify({ w: d.worst, o: d.onsets.length, p: d.passes }));
    const slow = churn(3, 1500);
    check('*** a correction every 1.5 s gets a fresh outline every time (normal use unchanged) ***',
      slow.onsets.length === slow.passes - 1, JSON.stringify(slow));
  }

  // ==== ROW 2.47 (note AQ, 2026-10-01): STYLES ====
  section('*** styles: rolling up (not a crawl), plain, eye chart, running text; the theme names a default ***');
  {
    check('*** the person\'s choice wins; "theme" means the theme\'s; nothing usable means rolling up ***',
      resolveSubtitleStyle('plain', 'snake') === 'plain' && resolveSubtitleStyle('theme', 'snake') === 'snake'
      && resolveSubtitleStyle(undefined, ' "eyechart" ') === 'eyechart' && resolveSubtitleStyle('theme', 'nonsense') === 'flow'
      && resolveSubtitleStyle(null, null) === 'flow' && resolveSubtitleStyle(42, '') === 'flow' && SUBTITLE_STYLE_FALLBACK === 'flow');
    const sf = SUBTITLES_FIELDS.find((f) => f.key === 'subtitlesStyle');
    check('*** the Star Wars crawl is gone; a stored "crawl" reads as rolling up, which is what was meant ***',
      !SUBTITLE_STYLES.includes('crawl') && !sf.options.some((o) => o.value === 'crawl')
      && resolveSubtitleStyle('crawl', 'plain') === 'flow' && subtitlesOptionsFrom({ subtitlesStyle: 'crawl' }).styleChoice === 'flow');
    check('the style setting defaults to "whatever the theme uses" and offers every style',
      sf.default === 'theme' && SUBTITLE_STYLES.every((s) => sf.options.some((o) => o.value === s)));
    check('*** every theme names a real style: High contrast plain, the rest rolling up ***',
      Object.values(THEMES).every((t) => SUBTITLE_STYLES.includes(t.vars[SUBTITLE_STYLE_VAR]))
      && THEMES.contrast.vars[SUBTITLE_STYLE_VAR] === 'plain' && THEMES.default.vars[SUBTITLE_STYLE_VAR] === 'flow'
      && Object.entries(THEMES).filter(([id]) => id !== 'contrast').every(([, t]) => t.vars[SUBTITLE_STYLE_VAR] === 'flow'));

    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0 }, reducedMotion: true });
    const box = subs.element();
    applyTheme(document.documentElement, 'contrast');
    subs.add({ text: 'one' });
    check('*** the theme\'s default is read off the page: High contrast draws plain captions ***',
      subs.style() === 'plain' && box.dataset.style === 'plain' && !box.classList.contains('subs-panel'), subs.style());
    applyTheme(document.documentElement, 'default');
    subs.restyle();
    check('...a theme change shows at once with restyle()', subs.style() === 'flow' && box.classList.contains('subs-roll'));
    applyTheme(document.documentElement, 'contrast');
    subs.add({ text: 'two' });
    check('...and at the next line by itself', subs.style() === 'plain');
    subs.update({ subtitlesOn: true, subtitlesHoldMs: 0, subtitlesStyle: 'snake' });
    check('*** the person\'s own choice overrides the theme\'s ***', subs.style() === 'snake' && box.classList.contains('subs-snake'));
    subs.update({ subtitlesOn: true, subtitlesHoldMs: 0, subtitlesStyle: 'theme' });
    check('...and "whatever the theme uses" gives it back', subs.style() === 'plain');
    const themed = createSubtitles(host, { settings: { subtitlesOn: true }, themeStyle: () => 'eyechart', reducedMotion: true });
    check('a host can hand the theme\'s style in instead', themed.style() === 'eyechart');
    themed.destroy();
    applyTheme(document.documentElement, 'default');
    subs.destroy();
  }

  section('*** rolling up: newest at the bottom, older lines glide up; instant when still ***');
  {
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 3, subtitlesStyle: 'flow' },
      reducedMotion: false });
    const box = subs.element();
    subs.add({ text: 'first line' });
    subs.add({ text: 'second line' });
    const [a, b] = box.querySelectorAll(':scope > .subs-line');
    check('*** the newest is at the bottom, the older above it ***',
      /second/.test(b.textContent) && a.getBoundingClientRect().top < b.getBoundingClientRect().top);
    const glides = (el) => el.getAnimations().filter((an) => !(an instanceof CSSAnimation));
    check('*** the older line glides up from where it was (no jump) ***',
      glides(a).length === 1 && /translateY\([1-9]/.test(JSON.stringify(glides(a)[0].effect.getKeyframes()[0].transform)),
      JSON.stringify(glides(a).map((x) => x.effect.getKeyframes()[0])));
    check('...the new one rises in at the bottom', getComputedStyle(b).animationName === 'subs-rise', getComputedStyle(b).animationName);
    check('one panel, the lines left-aligned like a message thread',
      box.classList.contains('subs-panel') && getComputedStyle(a).textAlign === 'start'
      && rgb(getComputedStyle(box).backgroundColor)?.a === 1, getComputedStyle(box).backgroundColor);
    subs.add({ text: 'third line' }); subs.add({ text: 'fourth line' });
    check('the oldest leaves at the top; the order holds',
      subs.lines().map((l) => l.text).join() === 'second line,third line,fourth line'
      && /fourth/.test(box.querySelector(':scope > .subs-line:last-of-type').textContent));
    for (const an of box.getAnimations({ subtree: true })) an.cancel();
    subs.setReducedMotion(true);
    subs.add({ text: 'fifth line' });
    check('*** reduced motion: the same layout, moved instantly (no glide, no rise) ***',
      box.getAnimations({ subtree: true }).length === 0 && box.classList.contains('subs-roll')
      && getComputedStyle(box.querySelector(':scope > .subs-line:last-of-type')).animationName === 'none');
    subs.destroy();
  }

  section('*** the eye chart: newest largest, each older line smaller, never below the floor ***');
  {
    check('eyeChartFontSize: the newest is the chosen size; each step is a fraction; the floor is in px',
      eyeChartFontSize(0) === 'max(24px, 1em)' && eyeChartFontSize(2, { shrink: 0.8, smallestPx: 32 }) === 'max(32px, 0.64em)',
      eyeChartFontSize(2, { shrink: 0.8, smallestPx: 32 }));
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 6,
      subtitlesStyle: 'eyechart', subtitlesSize: 'largest' }, reducedMotion: true });
    const box = subs.element();
    for (let i = 1; i <= 6; i++) subs.add({ text: `line ${i}` });
    const sizes = () => [...box.querySelectorAll(':scope > .subs-line')].map((e) => parseFloat(getComputedStyle(e).fontSize));
    const px = sizes();
    const chosen = parseFloat(getComputedStyle(box).fontSize);
    check('*** the newest line is the chosen size ***', Math.abs(px[5] - chosen) < 0.6, `${px[5]} vs ${chosen}`);
    check('*** each older line is no larger than the one below it, and the next is a step smaller ***',
      px.every((x, i) => i === 0 || px[i - 1] <= x + 0.01) && Math.abs(px[4] - Math.max(24, chosen * 0.8)) < 0.6, px.join(' '));
    check('*** never below the floor (24 px, WCAG\'s large text) ***', px.every((x) => x >= 24 - 0.01), px.join(' '));
    subs.update({ subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 6, subtitlesStyle: 'eyechart', subtitlesSize: 'largest',
      subtitlesSmallestPx: 32, subtitlesShrink: 0.7 });
    const px2 = sizes();
    check('the floor and the step are settings', px2.every((x) => x >= 32 - 0.01) && Math.abs(px2[4] - Math.max(32, chosen * 0.7)) < 0.6, px2.join(' '));
    subs.earlier(3);
    const hp = [...box.querySelectorAll('.subs-hist > .subs-line:not(.subs-mark)')].map((e) => e.style.fontSize);
    check('scrolled back, the earlier lines are an eye chart too', hp.length && hp[hp.length - 1] === 'max(32px, 1em)', hp.join(' | '));
    subs.latest();
    subs.update({ subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 6, subtitlesStyle: 'flow' });
    check('another style clears the sizes', [...box.querySelectorAll(':scope > .subs-line')].every((e) => !e.style.fontSize));
    check('a broken step or floor is its default',
      subtitlesOptionsFrom({ subtitlesShrink: 0.01, subtitlesSmallestPx: 3 }).shrink === SUBTITLES_DEFAULTS.shrink
      && subtitlesOptionsFrom({ subtitlesSmallestPx: '40' }).smallestPx === 24);
    subs.destroy();
  }

  section('*** running text ("snake"): the lines run on across the width, newest words in view ***');
  {
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 2, subtitlesStyle: 'snake' },
      reducedMotion: true });
    const box = subs.element();
    for (let i = 1; i <= 12; i++) subs.add({ text: `this is what was said in number ${i}` });
    const ln = box.querySelector(':scope > .subs-line');
    check('*** the lines run on: inline, not a box each ***', getComputedStyle(ln).display === 'inline');
    check('more lines are kept than rows, so short lines still fill a row', subs.lines().length > 2 && subs.lines().length <= 6, String(subs.lines().length));
    const fs = parseFloat(getComputedStyle(box).fontSize);
    check('*** the panel is the chosen number of rows high ***', box.clientHeight <= fs * (2 * 1.25 + 0.36) + 2 && box.clientHeight >= fs * 2,
      `${box.clientHeight} vs ${fs}`);
    const last = box.querySelector(':scope > .subs-line:last-of-type').getBoundingClientRect();
    const br = box.getBoundingClientRect();
    check('*** ...scrolled to the newest words ***',
      box.scrollTop + box.clientHeight >= box.scrollHeight - 1 && last.bottom <= br.bottom + 1 && last.top >= br.top - 1,
      `${box.scrollTop}+${box.clientHeight} of ${box.scrollHeight}`);
    subs.destroy();
  }

  section('*** every style keeps everything that exists: no line dropped, corrected in place, unsure marks, scroll back, off keeps nothing, readable ***');
  for (const style of SUBTITLE_STYLES) {
    const clock = fakeClock();
    const subs = createSubtitles(host, { settings: { subtitlesOn: true, subtitlesHoldMs: 0, subtitlesLines: 3, subtitlesStyle: style },
      now: clock.now, setTimer: clock.setTimer, clearTimer: clock.clearTimer, reducedMotion: false });
    const box = subs.element();
    let dropped = 0;
    for (const conf of [0, 0.5, 1, NaN, null, 'x']) if (!subs.add({ text: `line ${conf}`, speaker: { name: 'Alex', confidence: conf } })) dropped++;
    subs.caption({ id: 'k', ear: 'room', text: 'turn it off', words: [{ w: 'turn', conf: 0.9 }, { w: 'it', conf: 0.9 }, { w: 'off', conf: 0.3 }] });
    const p = box.querySelector('[data-caption="k"]');
    const lowOk = [...p.querySelectorAll('.subs-low')].map((e) => e.textContent).join() === 'off';
    const top = p.getBoundingClientRect().top;
    subs.caption({ id: 'k', ear: 'room', text: 'turn it up', revised: true, words: [{ w: 'turn', conf: 0.9 }, { w: 'it', conf: 0.9 }, { w: 'up', conf: 0.9 }] });
    const same = box.querySelector('[data-caption="k"]') === p && Math.abs(p.getBoundingClientRect().top - top) < 1
      && [...p.querySelectorAll('.subs-fixed')].map((e) => e.textContent).join() === 'up';
    const n = subs.earlier();
    const backOk = n > 0 && !!box.querySelector('.subs-hist') && getComputedStyle(p).display === 'none';
    clock.advance(SUBTITLES_DEFAULTS.backMs + 1);
    const backAgain = subs.scrolledBack() === 0 && p.isConnected && getComputedStyle(p).display !== 'none';
    const fg = rgb(getComputedStyle(p).color); const bg = rgb(getComputedStyle(p).backgroundColor);
    const ratio = fg && bg && bg.a === 1 ? contrast(hex(fg), hex(bg)) : 0;
    subs.setOn(false);
    const offOk = subs.lines().length === 0 && subs.history().length === 0 && box.hidden;
    check(`*** ${style}: no line dropped, corrected in place, unsure marked, scroll back and back by itself, off keeps nothing, ${ratio.toFixed(1)}:1 ***`,
      subs.style() === style && dropped === 0 && lowOk && same && backOk && backAgain && offOk && ratio >= 7,
      JSON.stringify({ dropped, lowOk, same, backOk, backAgain, offOk, ratio }));
    subs.destroy();
  }
} catch (e) {
  check('unexpected error', false, String((e && e.stack) || e));
}
const sum = document.getElementById('summary');
sum.textContent = failed === 0 ? `ALL PASS — ${passed} checks` : `${failed} FAILED / ${passed} passed`;
sum.className = failed ? 'fail' : 'pass';
sum.dataset.done = 'true'; sum.dataset.failed = String(failed);
})();
</script>
</body>
</html>
