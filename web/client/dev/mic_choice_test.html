<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mic choice - which microphone, by name, with a level you can see (notes CW/CX)</title>
<style>body{font:14px system-ui;margin:16px}.pass{color:#060}.fail{color:#b00;font-weight:600}</style>
</head>
<body>
<h1>mic choice <span id="summary">running…</span></h1>
<p>Mike, 2026-10-26: "Switching mics has to be something easy and intuitive for the end user." Devices → Microphone,
by name; "Test the microphones" shows a live level beside each and "Use this one"; calls open the chosen one.</p>
<div id="out"></div>
<script type="module">
import { MIC_KEY, IN_PREFIX, refreshMics, knownMics, setMicsForTest, micIdFor, micField, levelOf, openMicTester, TESTER_IDLE_MS } from '../mic_choice.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;
function check(name, ok, detail = '') {
  const p = document.createElement('div');
  p.className = ok ? 'pass' : 'fail';
  p.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? `   ${detail}` : ''}`;
  out.append(p);
  if (ok) passed += 1; else failed += 1;
}
function section(t) { const h = document.createElement('h2'); h.textContent = t; out.append(h); }
const J = (v) => JSON.stringify(v);
const tick = () => new Promise((r) => setTimeout(r, 0));
const MICS = [{ id: 'default', label: 'Default' }, { id: 'usb1', label: 'USB Composite Device Mono' }, { id: 'cam1', label: 'HD Camera Mono' }];

try {
  section('the list and the row');
  await refreshMics({ list: async () => MICS });
  check('*** the microphones, by name (the browser\'s "default" alias left out) ***', J(knownMics().map((m) => m.label)) === J(['USB Composite Device Mono', 'HD Camera Mono']));
  const f = micField();
  check('*** Devices -> Microphone: first "This computer\'s own default", then each by name ***',
    f.key === MIC_KEY && f.default === '' && J(f.options.map((o) => o.label)) === J(['This computer’s own default', 'USB Composite Device Mono', 'HD Camera Mono']), J(f.options));
  check('one microphone: nothing to choose, no row', micField([{ id: 'a', label: 'Only one' }]) === null);
  check('*** a choice is kept by NAME, and means that microphone\'s device id now ***', micIdFor(`${IN_PREFIX}HD Camera Mono`) === 'cam1'
    && micIdFor(`${IN_PREFIX}hd camera`) === 'cam1');
  check('the default, or a microphone that is not plugged in: none (the computer\'s default is used, never silence)',
    micIdFor('') === null && micIdFor(`${IN_PREFIX}Blue Yeti`) === null);
  check('a level from samples: silence is 0, a loud signal fills the bar', levelOf(new Uint8Array(64).fill(128)) === 0
    && levelOf(Uint8Array.from({ length: 64 }, (_, i) => (i % 2 ? 200 : 56))) === 1);

  section('*** "Test the microphones" ***');
  setMicsForTest(MICS.slice(1));
  const opened = [], released = [], picked = [];
  let timers = [];
  const fakeStream = (id) => ({ id });
  class FakeAC {
    createMediaStreamSource(s) { return { connect() {}, s }; }
    createAnalyser() { const a = { fftSize: 0, loud: false, getByteTimeDomainData(buf) { buf.fill(128); if (a.loud) for (let i = 0; i < buf.length; i += 2) buf[i] = 220; } }; this.last = a; (FakeAC.all = FakeAC.all || []).push(a); return a; }
    close() { FakeAC.closed = true; }
  }
  const rafs = [];
  const t = openMicTester(document.body, {
    list: knownMics(), current: `${IN_PREFIX}USB Composite Device Mono`,
    open: async (id) => { opened.push(id); return fakeStream(id); }, close: (id) => released.push(id),
    onPick: (v) => picked.push(v), AudioContextImpl: FakeAC,
    setTimer: (fn, ms) => { timers.push({ fn, ms }); return timers.length; }, clearTimer: (h) => { if (timers[h - 1]) timers[h - 1].fn = null; },
    raf: (fn) => rafs.push(fn),
  });
  await tick(); await tick();
  const box = () => document.querySelector('[data-mic-tester]');
  check('*** it lists every microphone by name, the one in use marked, each with a level bar and "Use this one" ***',
    !!box() && box().querySelectorAll('[data-mic-row]').length === 2 && /USB Composite Device Mono \(in use\)/.test(box().textContent)
    && box().querySelectorAll('[data-mic-level]').length === 2 && box().querySelectorAll('[data-mic-use]').length === 3);
  check('each microphone is opened to hear it', J(opened) === J(['usb1', 'cam1']) && t.live() === 2, J(opened));
  FakeAC.all[1].loud = true;
  rafs.splice(0).forEach((fn) => fn());
  const bars = [...box().querySelectorAll('[data-mic-level]')].map((b) => b.style.width);
  check('*** say something: the bar of the microphone that hears it moves, the other does not ***', bars[0] === '0%' && bars[1] === '100%', J(bars));
  check(`it closes by itself after ${TESTER_IDLE_MS / 1000} seconds untouched (never a gate)`, timers.some((x) => x.fn && x.ms === TESTER_IDLE_MS));
  box().querySelector('[data-mic-use="in:HD Camera Mono"]').click();
  check('*** "Use this one" chooses it (the row\'s value) and closes, letting every microphone go ***',
    J(picked) === J(['in:HD Camera Mono']) && !box() && J(released.sort()) === J(['cam1', 'usb1']) && FakeAC.closed === true, J({ picked, released }));
  const t2 = openMicTester(document.body, { list: knownMics(), open: async (id) => fakeStream(id), close() {}, AudioContextImpl: FakeAC, raf() {} });
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('Escape closes it', !box());
  const t3 = openMicTester(document.body, { list: knownMics(), open: async (id) => fakeStream(id), close() {}, onPick: (v) => picked.push(v), AudioContextImpl: FakeAC, raf() {} });
  box().querySelector('[data-mic-use=""]').click();
  check('"Use this computer\'s own default" sets it back to the default', picked[picked.length - 1] === '' && !box());
  void t2; void t3;
  section('*** "Test the speakers" (note CX: "Same for speakers") ***');
  {
    const { openSpeakerTester, speakerKey } = await import('../speakers.js');
    const tones = [];
    class ToneAC {
      constructor() { this.currentTime = 0; this.destination = {}; }
      setSinkId(id) { this.sink = id; return Promise.resolve(); }
      createOscillator() { const me = this; return { frequency: {}, connect() {}, start() { tones.push(me.sink); }, stop() {} }; }
      createGain() { return { gain: { setValueAtTime() {}, linearRampToValueAtTime() {} }, connect() {} }; }
      resume() {}
      close() {}
    }
    const picks = [];
    const spk = [{ deviceId: 'tv1', label: 'TV speakers' }, { deviceId: 'usb1', label: 'USB Composite Device Analog Stereo' }];
    openSpeakerTester(document.body, { list: spk, current: { [speakerKey('calls')]: 'out:TV speakers' }, onPick: (k, v) => picks.push([k, v]), AudioContextImpl: ToneAC });
    const st = () => document.querySelector('[data-speaker-tester]');
    check('*** every speaker by name, the one calls use marked, each with "Play a sound here", "Calls here" and "Music here" ***',
      !!st() && st().querySelectorAll('[data-speaker-row]').length === 2 && /TV speakers \(calls\)/.test(st().textContent)
      && st().querySelectorAll('[data-speaker-play]').length === 2 && st().querySelectorAll('[data-speaker-use]').length === 4);
    st().querySelector('[data-speaker-play="usb1"]').click();
    await tick(); await tick();
    check('*** "Play a sound here" plays a short tone on THAT speaker alone ***', JSON.stringify(tones) === '["usb1"]', JSON.stringify(tones));
    st().querySelector(`[data-speaker-use="${speakerKey('calls')}"][data-speaker-value="out:USB Composite Device Analog Stereo"]`).click();
    check('*** "Calls here" writes Devices -> Speakers "Calls play on", and stays open to choose music too ***',
      JSON.stringify(picks) === JSON.stringify([[speakerKey('calls'), 'out:USB Composite Device Analog Stereo']]) && !!st(), JSON.stringify(picks));
    st().querySelector('[data-speaker-reset]').click();
    check('"Both on this computer\'s own speaker" puts both back, and closes', picks.slice(-2).every(([, v]) => v === '') && !st());
  }
  section('*** a microphone that sends nothing at all (note CY) ***');
  {
    const { allZero, watchDeadMic, DEAD_MIC_MS, DEAD_MIC_TEXT } = await import('../mic_choice.js');
    check('exact zeros are "nothing at all"; the faintest real noise is not; an empty buffer proves nothing',
      allZero(new Float32Array(64)) && !allZero(Float32Array.from({ length: 64 }, (_, i) => (i === 40 ? 0.0003 : 0))) && !allZero(new Float32Array(0)));
    // A fake clock and a fake audio graph whose samples the test sets.
    let t0 = 0, q = [];
    const io = { now: () => t0, setTimer: (f, ms) => { q.push({ f, at: t0 + ms }); return q.length; }, clearTimer: (h) => { if (q[h - 1]) q[h - 1].f = null; } };
    const run = (ms) => { const end = t0 + ms; for (;;) { const due = q.filter((x) => x.f && x.at <= end).sort((a, b) => a.at - b.at)[0]; if (!due) break; t0 = due.at; const f = due.f; due.f = null; f(); } t0 = end; };
    let level = 0;
    class GraphAC {
      constructor() { this.state = 'running'; GraphAC.made = (GraphAC.made || 0) + 1; }
      resume() { return Promise.resolve(); }
      createMediaStreamSource() { return { connect() {}, disconnect() {} }; }
      createAnalyser() { return { fftSize: 0, getFloatTimeDomainData(b) { b.fill(0); if (level) b[7] = level; } }; }
      close() { GraphAC.closed = (GraphAC.closed || 0) + 1; }
    }
    class S { constructor(t) { this.t = t; } }
    const track = { enabled: true, readyState: 'live' };
    let dead = 0;
    const w = watchDeadMic({ track, onDead: () => { dead += 1; }, AudioContextImpl: GraphAC, Stream: S, ...io });
    run(DEAD_MIC_MS - 500);
    check('zeros for less than the limit: nothing said yet (a microphone still waking up)', dead === 0);
    run(1000);
    check(`*** exact zeros for ${DEAD_MIC_MS / 1000} s: said, once ***`, dead === 1);
    run(DEAD_MIC_MS * 3);
    check('...and only once, and the watch lets its audio go', dead === 1 && GraphAC.closed === 1);
    void w;
    dead = 0; level = 0.0004;
    const wq = watchDeadMic({ track, onDead: () => { dead += 1; }, AudioContextImpl: GraphAC, Stream: S, ...io });
    run(DEAD_MIC_MS * 3);
    check('*** a quiet room on a working microphone (0.0004) is never called dead ***', dead === 0);
    wq.stop();
    dead = 0; level = 0;
    const muted = { enabled: false, readyState: 'live' };
    const wm = watchDeadMic({ track: muted, onDead: () => { dead += 1; }, AudioContextImpl: GraphAC, Stream: S, ...io });
    run(DEAD_MIC_MS * 3);
    check('*** muted on purpose (the track switched off): zeros, and nothing said ***', dead === 0);
    wm.stop();
    class Asleep extends GraphAC { constructor() { super(); this.state = 'suspended'; } }
    watchDeadMic({ track, onDead: () => { dead += 1; }, AudioContextImpl: Asleep, Stream: S, ...io });
    run(DEAD_MIC_MS * 3);
    check('an audio context that will not run measures nothing, so says nothing (never a guess)', dead === 0);
    const ws = watchDeadMic({ track, onDead: () => { dead += 1; }, AudioContextImpl: GraphAC, Stream: S, ...io });
    run(1000); ws.stop(); run(DEAD_MIC_MS * 3);
    check('stopped (the call ended): nothing said afterwards', dead === 0);
    check('no microphone, or no Web Audio: an inert watch, no error', typeof watchDeadMic({ track: null }).stop === 'function'
      && typeof watchDeadMic({ track, AudioContextImpl: null }).stop === 'function');
    // The tester: a microphone whose samples are all exact zeros says so beside its (still) bar.
    let tNow = 0;
    const frames = [];
    class FloatAC {
      constructor() { this.state = 'running'; }
      resume() {}
      createMediaStreamSource() { return { connect() {} }; }
      createAnalyser() { const id = FloatAC.n = (FloatAC.n || 0) + 1; return { fftSize: 0, getByteTimeDomainData(b) { b.fill(128); },
        getFloatTimeDomainData(b) { b.fill(0); if (id === 1) b[3] = 0.002; } }; }
      close() {}
    }
    openMicTester(document.body, { list: [{ id: 'usb1', label: 'USB Composite Device Mono' }, { id: 'cam1', label: 'HD Camera Mono' }],
      open: async (id) => ({ id }), close() {}, AudioContextImpl: FloatAC, raf: (fn) => frames.push(fn), now: () => tNow });
    await tick(); await tick();
    const step = () => frames.splice(0).forEach((fn) => fn());
    step(); tNow = DEAD_MIC_MS + 10; step();
    const notes = [...document.querySelectorAll('[data-mic-tester] [data-mic-dead]')].map((n) => n.hidden);
    check('*** "Test the microphones": the one sending exact zeros says "No sound at all from this one"; the working one does not ***',
      JSON.stringify(notes) === '[true,false]', JSON.stringify(notes));
    document.querySelector('[data-mic-tester] [data-mic-close]').click();
    check('the words say what is wrong and where to look, and name nobody', /No sound is coming/.test(DEAD_MIC_TEXT) && /Test the microphones/.test(DEAD_MIC_TEXT));
  }
  check('names nobody', !/taylor|cici|her screen/i.test(await (await fetch('../mic_choice.js')).text()));
} catch (err) {
  check('the suite ran to the end', false, String(err && err.stack || err));
}
document.getElementById('summary').textContent = failed ? `${failed} FAILED / ${passed} passed` : `ALL PASS - ${passed} checks`;
</script>
</body>
</html>
