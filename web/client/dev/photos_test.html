<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>photos module — integration test</title>
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .skip{color:#b8860b}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #host{width:320px;margin-top:12px}
  .photos .stage{position:relative;width:100%;aspect-ratio:4/3;background:#0c1a14;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .photos .stage img,.photos .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .photos .status{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(10,51,35,.72);font-size:.85rem}
  .photos .nav{display:flex;justify-content:space-between;margin-top:6px}
  .photos .gear,.photos .settings{display:none}
</style>
<!-- The module stylesheet is REQUIRED here, not decoration: the `[hidden]` check below is
     about a rule in this file outranking the browser's own, so a page without it would
     pass while the live screen fails. -->
<link rel="stylesheet" href="../modules.css">
</head>
<body>
<h1>photos module — integration test</h1>
<p>Mounts the real <code>photos</code> module against the live server + a media agent
(<code>?agent=</code>, default <code>http://127.0.0.1:8770</code>).</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>

<script type="module">
import { createBus } from '../bus.js';
import { createState } from '../state.js';
import { createEvents } from '../events.js';
import { createProfilesClient } from '../profile.js';
import { mountModule } from '../module.js';
import { pressRetry } from './press_controls.js';
import { createMediaSourcesClient } from '../media_sources.js';
import '../modules/photos.js';   // registers 'photos'
import '../modules/youtube.js';  // a module with no copyFromSibling, as the control
import '../modules/settings.js'; // the Settings module - one of the three doors
import { getManifest } from '../module.js';
import { normalizeField, fieldValue, displayValue, fieldItems, fieldsFor } from '../settings_fields.js';
import { createLocalBackend } from '../local_store.js';
import { listingFailure, slideshowItems } from '../modules/photos.js';
import { folderError, kindOf } from '../folder_source.js';

const params = new URLSearchParams(location.search);
const AGENT = (params.get('agent') || 'http://127.0.0.1:8770').replace(/\/+$/, '');
const USER = params.get('user') || 'photos-test-user';
const out = document.getElementById('results');
let passed = 0, failed = 0, skipped = 0;

// *** A SUITE THAT CANNOT RUN MUST NOT REPORT RED. ***
//
// The section below mounts the real photos module against a REAL media agent on 8770. With no
// agent running, "module resolves source and renders an image" is not a failing assertion about
// the module, it is an assertion about a photo that does not exist -- and `run_all.html` already
// says what that costs: *"folded into failures it is the noise that trains everybody to read red
// as normal."* `media_stall` and `personal` preflight for this reason; `photos` and
// `media_sources` had been missed.
function skip(name, why) {
  skipped++;
  const d = document.createElement('div');
  d.className = 'skip';
  d.textContent = `NOT RUN  ${name}   ${why}`;
  out.append(d);
}
async function agentUp(base) {
  try {
    const r = await fetch(`${base}/health`, { signal: AbortSignal.timeout(2500) });
    return r.ok;
  } catch { return false; }
}

function section(t) { const h = document.createElement('h2'); h.textContent = t; out.append(h); }
function check(name, cond, detail = '') {
  const ok = !!cond; ok ? passed++ : failed++;
  const line = document.createElement('div');
  line.className = ok ? 'pass' : 'fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(line);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const base = (u) => { try { return new URL(u).pathname.split('/').pop(); } catch { return u; } };
const curSrc = () => { const el = document.querySelector('#host .stage')?.firstChild; return el ? el.src : null; };
// A picture that REALLY LOADS. Rigs used `data:,x` as a stand-in picture, which the browser fails to
// load -- harmless while a failed picture did nothing, but since 2026-10-02 a failed picture is skipped
// and three in a row take the source down, so a rig that means "a working photo" must use one.
const OKPIC = (tag) => 'data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="3"><desc>${tag}</desc></svg>`);

(async () => {
  // *** FIRST, AND BEFORE ANY NETWORK CALL. ***
  //
  // Everything below this needs a running media agent and a live API, so on a static server
  // the suite dies at the first request and reports "0 passed". Placed after that, these seven
  // checks would never run at all — which is how §E-fail's "wrong words" sat unfixed and
  // unnoticed for days. The words are pure; they need no server; so they go here.
  {
    const src = { label: 'Family photos' };

    // THE BUG THESE GUARD. Every failure used to say "Source X unreachable", which describes a
    // media agent that has stopped answering. For a folder on THIS device whose permission has
    // lapsed it is simply wrong, and it sends whoever reads it to check a network for a problem
    // that is one click away.
    const perm = listingFailure(folderError('permission', 'x', 'f1'), src);
    check('*** a lapsed folder permission does not claim the source is unreachable ***',
      !/unreachable/i.test(perm.text), perm.text);
    check('...it says the permission lapsed', /permission/i.test(perm.text), perm.text);
    // "Retry" is ACTIVELY WRONG here: retrying cannot work, because the browser will not
    // re-grant access without a user gesture aimed at asking for it. The button is the gesture.
    check('*** ...and it offers Allow rather than Retry, because retrying cannot work ***',
      perm.action === 'Allow' && perm.retry === false, JSON.stringify(perm));

    const missing = listingFailure(folderError('missing', 'x', 'f1'), src);
    check('a folder the device no longer has says so, and offers no button to fix it here',
      /no longer has/i.test(missing.text) && !missing.action && !missing.retry,
      JSON.stringify(missing));

    const album = listingFailure(folderError('album', 'x', 'f1'), src, 'Holiday');
    check('a missing album names the album', /Holiday/.test(album.text), album.text);

    // CONTROL: the original sentence survives where it is TRUE. A fix that made every message
    // friendlier would have thrown away the one case the old wording was right about.
    const down = listingFailure(new Error('/list -> 500'), src);
    check('CONTROL: an agent that really is unreachable still says so',
      /unreachable/i.test(down.text) && down.retry === true, down.text);
    check('...and so does a failure with no code at all',
      /unreachable/i.test(listingFailure(null, src).text));
  }

  // *** PRESS THE CONTROLS A PERSON ACTUALLY TOUCHES. ***
  //
  // Everything below this file's API section drives `bus.publish('photos/next')` - the TOPIC.
  // On 2026-09-05 the topic worked perfectly and the ARROW UNDER THE PHOTO did nothing, for
  // every module with a bare `emit()`, because `bus.route()` dropped payload-less signals.
  // Nine controls across five modules were dead and the suite was green, because no test
  // pressed a button. `dev/unpressed_controls.py` lists the rest.
  //
  // This runs with NO server and NO agent: it asserts the control is WIRED to its topic,
  // which is exactly what broke, and needs neither a listing nor a byte of image data.
  {
    section('the controls a person touches — pressed, not published');
    const bus = createBus();
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;width:600px;height:380px';
    document.body.append(host);

    const fired = { next: 0, prev: 0 };
    bus.subscribe('photos/next', () => fired.next++);
    bus.subscribe('photos/prev', () => fired.prev++);

    let cfg = { sourceId: 'src-1', intervalMs: 3600000, fit: 'contain' };
    const subs = [];
    const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
                    subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
    const source = { id: 'src-1', label: 'Test source', kind: 'agent', base_url: 'http://127.0.0.1:9' };
    const inst = mountModule('photos', {
      mount: host, bus, state,
      events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
      user: USER, profileId: 'p',
      sources: { list: async () => [source], add: async () => source, remove: async () => {} },
    });
    inst.init();
    await sleep(120);

    const btn = (sel) => host.querySelector(sel);
    check('the next arrow exists', !!btn('[data-next]'));
    check('the prev arrow exists', !!btn('[data-prev]'));

    btn('[data-next]')?.click();
    await sleep(40);
    check('*** PRESSING the next arrow reaches photos/next ***', fired.next === 1, `fired=${fired.next}`);

    btn('[data-prev]')?.click();
    await sleep(40);
    check('*** PRESSING the prev arrow reaches photos/prev ***', fired.prev === 1, `fired=${fired.prev}`);

    btn('[data-next]')?.click(); btn('[data-next]')?.click();
    await sleep(40);
    check('every press counts — they are not debounced away', fired.next === 3, `fired=${fired.next}`);

    // the gear opens the panel's own settings, and an option there writes through to state
    const gear = btn('[data-gear]'), panel = host.querySelector('[data-settings]');
    check('the gear exists and its panel starts closed', !!gear && panel?.hidden === true);
    gear?.click(); await sleep(40);
    check('pressing the gear opens the settings panel', panel?.hidden === false);
    gear?.click(); await sleep(40);
    check('pressing it again closes it', panel?.hidden === true);

    const opt = host.querySelector('[data-opt="fit"]');
    if (opt) {
      opt.value = 'cover';
      opt.dispatchEvent(new Event('change', { bubbles: true }));
      await sleep(40);
      check('changing a gear option writes the declared type through to state', cfg.fit === 'cover', JSON.stringify(cfg.fit));
    }

    // and `hidden` must actually HIDE - four modules set display:flex on .status, which
    // outranks the browser's own [hidden] rule. That is why a "Loading photos..." sheet sat
    // over the photos on the live site while the code that hid it was already correct.
    const st = host.querySelector('[data-status]');
    if (st) {
      st.hidden = true; await sleep(20);
      check('*** [hidden] on .status actually hides it (needs modules.css loaded) ***',
        getComputedStyle(st).display === 'none', getComputedStyle(st).display);
    }

    inst.destroy();
    host.remove();
  }

  // *** ROW 2.49: THE COLOUR GRADE (lut.js) IS OFF BY DEFAULT, AND OFF MEANS UNTOUCHED. ***
  // Photos are the module that matters most. With no grade chosen on this device the picture
  // element must come out EXACTLY as before: the one inline style photos.js always set (object-fit)
  // and nothing else. Then, with a grade saved and its photos switch on, the next picture gets it.
  {
    section('the colour grade: off by default, and off leaves the photo exactly as it was');
    const { GRADE_KEY, saveGrade, compileLut, parseCube, FILTER_ID } = await import('../lut.js');
    let saved = null;
    try { saved = localStorage.getItem(GRADE_KEY); localStorage.removeItem(GRADE_KEY); } catch { /* private */ }
    const ITEMS = [1, 2, 3].map((i) => ({ id: 'g' + i, path: 'g' + i + '.jpg', name: 'g' + i, kind: 'image', url: OKPIC('g' + i) }));
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
    document.body.append(host);
    let cfg = { sourceId: 'src-1', intervalMs: 3600000, fit: 'contain' };
    const subs = [];
    const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
                    subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
    const source = { id: 'src-1', label: 'Test source', kind: 'agent', base_url: 'http://127.0.0.1:9' };
    const inst = mountModule('photos', {
      mount: host, bus: createBus(), state, instanceId: 'photos-grade',
      events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
      user: USER, profileId: 'p',
      sources: { list: async () => [source], add: async () => source, remove: async () => {} },
      resolveListing: async () => ({ items: ITEMS.map((it) => ({ ...it })), albums: [], album: '', count: ITEMS.length }),
    });
    inst.init();
    await sleep(150);
    const shown = () => host.querySelector('.stage')?.firstChild;
    const el1 = shown();
    check('PRECONDITION: a photo is on screen', el1 && el1.tagName === 'IMG', host.innerHTML.slice(0, 200));
    check('*** no grade: the photo\'s style is exactly what it always was (object-fit, nothing else) ***',
      el1 && el1.getAttribute('style') === 'object-fit: contain;' && !el1.style.filter, el1 && el1.getAttribute('style'));
    check('...and no filter was put in the page', !document.getElementById(FILTER_ID));
    try {
      saveGrade({ name: 'Invert', compiled: compileLut(parseCube('LUT_1D_SIZE 2\n1 1 1\n0 0 0').lut), targets: { photos: true } });
      host.querySelector('[data-next]').click();
      await sleep(80);
      const el2 = shown();
      check('with a grade and its photos switch ON, the next photo is graded', el2 && el2 !== el1
        && el2.style.filter.includes(FILTER_ID), el2 && el2.getAttribute('style'));
      saveGrade({ name: 'Invert', compiled: compileLut(parseCube('LUT_1D_SIZE 2\n1 1 1\n0 0 0').lut), targets: { photos: false } });
      host.querySelector('[data-next]').click();
      await sleep(80);
      const el3 = shown();
      check('switched off again: the next photo is untouched', el3 && el3.getAttribute('style') === 'object-fit: contain;',
        el3 && el3.getAttribute('style'));
    } finally {
      try { if (saved == null) localStorage.removeItem(GRADE_KEY); else localStorage.setItem(GRADE_KEY, saved); } catch { /* private */ }
      inst.destroy();
      host.remove();
    }
  }

  // *** "SETTING PHOTOS TO 30 SECONDS DOESN'T SEEM TO WORK NOW." *** (Mike, 2026-09-29, live.)
  //
  // The setting was stored and read correctly the whole time. Measured on the real kiosk with
  // two photos panels on one grid: the panel set to 30 s changed every 8 s, because every
  // module gets a SCOPE of the screen's one bus and the other panel's timer published a bare
  // `photos/next` that both panels obeyed. Same bus, fake timers, no server: two panels, one at
  // 8 s and one at 30 s, and the 8 s panel's timer must move only the 8 s panel.
  {
    section('two photos panels on one screen keep their own intervals');
    const bus = createBus();
    const ITEMS = [1, 2, 3, 4, 5, 6].map((i) => ({ id: 'p' + i, path: 'a/p' + i + '.jpg', name: 'p' + i,
                                                 kind: 'image', url: OKPIC('p' + i) }));
    const source = { id: 'src-1', label: 'Test source', kind: 'agent', base_url: 'http://127.0.0.1:9' };
    function panel(id, intervalMs) {
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      const timers = [];      // every timer this panel armed: { fn, ms, live }
      let cfg = { sourceId: 'src-1', intervalMs };
      const subs = [];
      const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
                      subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
      const inst = mountModule('photos', {
        mount: host, bus, state, instanceId: id,
        events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
        user: USER, profileId: 'p',
        sources: { list: async () => [source], add: async () => source, remove: async () => {} },
        resolveListing: async () => ({ items: ITEMS.map((it) => ({ ...it })), albums: [], album: '', count: ITEMS.length }),
        setTimer: (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
      });
      inst.init();
      const armed = () => timers.filter((t) => t.ms >= 2000);   // slideshow timers, not the stall watchdog
      return { host, inst, state, timers, armed, pending: () => armed().filter((t) => t.live),
               fire: () => { const t = armed().filter((x) => x.live).pop(); if (t) { t.live = false; t.fn(); } } };
    }
    const fast = panel('photos-fast', 8000);
    const slow = panel('photos-slow', 30000);
    await sleep(120);
    check('PRECONDITION: each panel armed its own interval',
      fast.pending().map((t) => t.ms).join() === '8000' && slow.pending().map((t) => t.ms).join() === '30000',
      `fast=${fast.pending().map((t) => t.ms)} slow=${slow.pending().map((t) => t.ms)}`);

    const slowShows = slow.armed().length;
    fast.fire();            // the 8-second panel's timer runs out
    await sleep(20);
    check('*** the 8 s panel running out of time does NOT move the 30 s panel ***',
      slow.armed().length === slowShows, `the 30 s panel advanced ${slow.armed().length - slowShows} time(s)`);
    check('...and the 8 s panel itself did move on, with its own 8 s',
      fast.pending().map((t) => t.ms).join() === '8000', fast.pending().map((t) => t.ms).join());
    check('...and the 30 s panel still has its 30 s timer running',
      slow.pending().map((t) => t.ms).join() === '30000', slow.pending().map((t) => t.ms).join());

    // The arrow under one panel is that panel's arrow. Both panels bound one source name, so a
    // press fanned out through both bindings and moved every photos panel - twice.
    const fastShows = fast.armed().length;
    const slowShows2 = slow.armed().length;
    fast.host.querySelector('[data-next]').click();
    await sleep(20);
    check('*** the next arrow under one panel moves that panel once, and the other not at all ***',
      fast.armed().length === fastShows + 1 && slow.armed().length === slowShows2,
      `this panel +${fast.armed().length - fastShows}, other panel +${slow.armed().length - slowShows2}`);

    // CONTROL: an untagged next (a switch, a voice command, a test publishing the topic) still
    // reaches every photos panel, exactly as it always did. The fix is about who a panel's OWN
    // messages are for, not a new rule about the topic.
    const f3 = fast.armed().length, s3 = slow.armed().length;
    bus.publish('photos/next');
    await sleep(20);
    check('CONTROL: a plain photos/next from outside still reaches both panels',
      fast.armed().length === f3 + 1 && slow.armed().length === s3 + 1);

    // A CHANGED INTERVAL APPLIES TO THE PHOTO ON SCREEN. Before, the timer already running kept
    // its old length, so 60 -> 30 left the photo up for the old minute.
    slow.state.set({ intervalMs: 60000 });
    await sleep(20);
    check('changing the interval re-arms the photo on screen with the new value',
      slow.pending().map((t) => t.ms).join() === '60000', slow.pending().map((t) => t.ms).join());
    const s4 = slow.armed().length;
    slow.state.set({ fit: 'cover' });
    await sleep(20);
    check('...and a change to something else does not restart its clock',
      slow.armed().length === s4, `re-armed ${slow.armed().length - s4} time(s)`);

    fast.inst.destroy(); slow.inst.destroy();
    fast.host.remove(); slow.host.remove();
  }

  // *** A FOLDER OF BROKEN CLIPS MUST NOT SPIN; PHOTOS KEEP THEIR TIMING EXACTLY. *** (Flash-limit
  // audit, 2026-09-30.) A clip that errors used to be replaced AT ONCE, so a folder where every clip
  // is broken replaced one with the next as fast as the browser could fail them. Now a run of
  // failures backs off (flash_limit.js failureBackoffMs). Photos are the module that matters most:
  // their timing is asserted exactly, first.
  {
    const { worstInAnySecond, failureBackoffMs } = await import('../flash_limit.js');
    const STALL = 999999;
    const source = { id: 'src-1', label: 'Test source', kind: 'agent', base_url: 'http://127.0.0.1:9' };
    function rigP(items, { intervalMs = 8000, limit } = {}) {
      const bus = createBus();
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      let fakeNow = 1_000_000;
      const timers = [], shows = [];
      let cfg = { sourceId: 'src-1', intervalMs };
      const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; }, subscribe: (f) => { f(cfg); return () => {}; }, flush() {} };
      const inst = mountModule('photos', {
        mount: host, bus, state, instanceId: 'photos-backoff',
        events: { append: (kind) => { if (kind === 'play') shows.push(fakeNow); return Promise.resolve(); }, subscribe() {}, load: () => Promise.resolve() },
        user: USER, profileId: 'p',
        sources: { list: async () => [source], add: async () => source, remove: async () => {} },
        resolveListing: async () => ({ items: items.map((it) => ({ ...it })), albums: [], album: '', count: items.length }),
        setTimer: (fn, ms) => { const t = { fn, ms, at: fakeNow + ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
        videoStallMs: STALL, now: () => fakeNow,
        // These checks are about the BACKOFF between failures, so "three in a row and the source is
        // down" (DOWN_AFTER_FAILURES, its own section below) is turned off here.
        downAfterFailures: 0,
        ...(limit !== undefined ? { flashLimitPerSecond: () => limit } : {}),
      });
      inst.init();
      const live = () => timers.filter((t) => t.live && t.ms !== STALL);
      return { host, inst, bus, timers, shows, live,
        now: () => fakeNow, set: (t) => { fakeNow = t; },
        fireNext() { const t = live().sort((a, b) => a.at - b.at)[0]; if (!t) return null; fakeNow = t.at; t.live = false; t.fn(); return t; },
        done() { inst.destroy(); host.remove(); } };
    }

    // 1. PHOTOS: every photo gets exactly its interval, and nothing else is ever armed.
    section('photos: the slideshow\'s own timing is exactly what it was');
    {
      const IMGS = [1, 2, 3, 4, 5].map((i) => ({ id: 'i' + i, path: 'i' + i + '.jpg', name: 'i' + i, kind: 'image', url: OKPIC('i' + i) }));
      for (const L of [3, 1]) {
        const r = rigP(IMGS, { intervalMs: 8000, limit: L });
        await sleep(120);
        const armed = [];
        for (let k = 0; k < 6; k++) { const t = r.fireNext(); if (t) armed.push(t.ms); await sleep(5); }
        const gaps = r.shows.slice(1).map((t, i) => t - r.shows[i]);
        check(`*** limit ${L}: every photo is up for exactly its 8000 ms, one timer each, nothing else armed ***`,
          armed.length === 6 && armed.every((ms) => ms === 8000) && gaps.length === 6 && gaps.every((g) => g === 8000)
          && r.live().length === 1 && r.live()[0].ms === 8000, JSON.stringify({ armed, gaps, live: r.live().map((t) => t.ms) }));
        r.done();
      }
      const r = rigP(IMGS, { intervalMs: 30000 });
      await sleep(120);
      r.fireNext(); r.fireNext();
      check('...and at 30 s, 30 s', r.shows.length === 3 && r.shows[2] - r.shows[1] === 30000 && r.live()[0].ms === 30000);
      r.done();
    }

    // 2. A CLIP THAT PLAYS THROUGH moves on the instant it ends, exactly as before.
    section('a clip that plays through still moves on the instant it ends');
    {
      const VIDS = [1, 2].map((i) => ({ id: 'v' + i, path: 'v' + i + '.mp4', name: 'v' + i, kind: 'video', url: 'data:,v' + i }));
      const r = rigP(VIDS, { limit: 1 });
      await sleep(120);
      const before = r.shows.length;
      const vid = r.host.querySelector('.stage video, [data-stage] video');
      r.set(r.now() + 5000);                       // it played for five seconds
      vid?.dispatchEvent(new Event('ended'));
      check('*** ended after 5 s: the next item is shown at that same instant, no wait armed ***',
        !!vid && r.shows.length === before + 1 && r.shows.at(-1) === r.now() && r.live().length === 0,
        JSON.stringify({ shows: r.shows.length - before, live: r.live().map((t) => t.ms) }));
      r.done();                                    // before the next (data:) clip's real error lands
    }

    // 3. A FOLDER WHERE EVERY CLIP IS BROKEN: real error events, fake time.
    section('a folder where every clip is broken backs off instead of spinning');
    for (const L of [3, 1]) {
      const VIDS = [1, 2, 3, 4, 5, 6].map((i) => ({ id: 'b' + i, path: 'b' + i + '.mp4', name: 'b' + i, kind: 'video', url: 'data:,broken' + i }));
      const r = rigP(VIDS, { limit: L });
      await sleep(150);
      const t0 = r.shows[0];
      for (let k = 0; k < 14; k++) { await sleep(60); if (!r.fireNext()) await sleep(120); }
      const shows = r.shows.map((t) => t - t0);
      const gaps = shows.slice(1).map((t, i) => t - shows[i]);
      const worst = worstInAnySecond(shows);
      check(`limit ${L}: ${shows.length} broken clips in ${Math.round(shows.at(-1) / 1000)} s; worst second ${worst} (<= ${L}); gaps ${gaps.join(',')}`,
        shows.length >= 6 && worst <= L && gaps[0] >= failureBackoffMs(1, L) && gaps.every((g) => g <= 30000)
        && gaps.slice(1, 5).every((g, i) => g >= gaps[i]), JSON.stringify(gaps));
      check(`...it keeps trying (never gives up) and the waits are capped at 30 s`, gaps.slice(-3).every((g) => g === 30000), JSON.stringify(gaps));
      const b = r.shows.length;
      r.host.querySelector('[data-next]')?.click();
      check('...and the person\'s own next still moves on at once, cancelling the wait', r.shows.length === b + 1);
      r.done();
    }
    check('failureBackoffMs: one flash period, then 2 s doubling to a 30 s cap',
      failureBackoffMs(1, 3) === 339 && failureBackoffMs(1, 1) === 1017 && failureBackoffMs(2, 3) === 2000
      && failureBackoffMs(3, 3) === 4000 && failureBackoffMs(6, 3) === 30000 && failureBackoffMs(60, 1) === 30000);
  }

  // *** WHEN IT OPENS, AND PAUSE / PLAY (Mike, 2026-10-02: autostart "on for youtube/picture slideshow"). ***
  // No agent: an in-memory row, a fixed listing and fake timers.
  {
    section('when it opens: a slideshow can wait for Start; Pause / Play reach it');
    const { PLAY_STATE_TOPIC } = await import('../game_start.js');
    const { fieldsFor } = await import('../settings_fields.js');
    const { MODULE_VERBS } = await import('../actions.js');
    const fp = fieldsFor(getManifest('photos'));
    check('*** Photos has game_start.js’s "When it opens" rows, ON by default ***',
      fp.find((f) => f.key === 'autostart')?.default === true && fp.some((f) => f.key === 'autostartAlone'));
    check('...and Play / Pause are its verbs, so the bar’s one button and Space reach it',
      MODULE_VERBS.photos.play === 'photos/play' && MODULE_VERBS.photos.pause === 'photos/pause');
    const IMGS = [1, 2, 3].map((i) => ({ id: 'w' + i, path: 'w' + i + '.jpg', name: 'w' + i, kind: 'image', url: OKPIC('w' + i) }));
    const src = { id: 'src-1', label: 'Test source', kind: 'agent' };
    function rigS(seed = {}, extra = {}) {
      const bus = createBus();
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      const timers = [], states = [], shows = [];
      bus.subscribe(PLAY_STATE_TOPIC, (p) => states.push(p));
      let cfg = { sourceId: 'src-1', intervalMs: 8000, ...seed };
      const subs = [];
      const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
        subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
      const inst = mountModule('photos', {
        mount: host, bus, state, instanceId: 'ph-as', user: USER, profileId: 'p',
        events: { append: (kind, d) => { if (kind === 'play') shows.push(d.id); return Promise.resolve(); }, subscribe() {}, load: () => Promise.resolve() },
        sources: { list: async () => [src], add: async () => src, remove: async () => {} },
        resolveListing: async () => ({ items: IMGS.map((it) => ({ ...it })), albums: [], album: '', count: IMGS.length }),
        setTimer: (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
        ...extra,
      });
      inst.init();
      const advanceTimers = () => timers.filter((t) => t.live && t.ms === 8000);
      return { host, inst, bus, timers, states, shows, advanceTimers, probe: () => inst.impl.__probe(),
        fire() { const t = advanceTimers().pop(); if (t) { t.live = false; t.fn(); } return t; },
        done() { inst.destroy(); host.remove(); } };
    }
    const on = rigS();
    await sleep(80);
    check('autostart on (the default): the first picture shows and its timer runs, exactly as before',
      on.shows.length === 1 && on.advanceTimers().length === 1 && !on.host.querySelector('[data-start]'));
    on.bus.publish('photos/pause');
    check('*** Pause: the timer is gone, the picture stays, it says Paused, and the shell hears "not playing" ***',
      on.advanceTimers().length === 0 && on.probe().paused === true && !!on.host.querySelector('[data-start]')
      && on.states.at(-1)?.id === 'ph-as' && on.states.at(-1)?.playing === false, JSON.stringify(on.states));
    on.bus.publish('photos/play');
    check('*** Play: it carries on (a fresh interval for the picture on screen) ***',
      on.advanceTimers().length === 1 && on.probe().paused === false && !on.host.querySelector('[data-start]') && on.states.at(-1)?.playing === true);
    check('...and Play cancels the carry-on timer', !on.timers.some((t) => t.live && t.ms === 30 * 60 * 1000));
    // *** A PAUSE CARRIES ON BY ITSELF (2026-10-02; CLAUDE.md: never a state only an input can leave, when the
    // person there cannot give it). Default 30 minutes; "never" is a choice. ***
    on.bus.publish('photos/pause');
    const resume = on.timers.find((t) => t.live && t.ms === 30 * 60 * 1000);
    check('*** a pause sets a 30-minute carry-on by default ***', !!resume, JSON.stringify(on.timers.filter((t) => t.live).map((t) => t.ms)));
    if (resume) { resume.live = false; resume.fn(); }
    check('*** ...and when it fires, the slideshow carries on and the shell hears "playing" ***',
      on.probe().paused === false && on.advanceTimers().length === 1 && on.states.at(-1)?.playing === true);
    on.done();
    const never = rigS({ resumeAfterMs: 0 });
    await sleep(80);
    never.bus.publish('photos/pause');
    check('*** "never": a pause sets no carry-on timer and stays paused ***',
      never.probe().paused === true && !never.timers.some((t) => t.live && t.ms !== 15 * 60 * 1000));
    never.done();
    const waitNoResume = rigS({ autostart: false });
    await sleep(80);
    check('a slideshow WAITING for Start (autostart off) is not timed out: only a pause is',
      waitNoResume.probe().waiting === true && !waitNoResume.timers.some((t) => t.live && t.ms === 30 * 60 * 1000));
    waitNoResume.done();

    const off = rigS({ autostart: false });
    await sleep(80);
    const first = off.probe().currentId;
    check('*** autostart OFF: the first picture shows ... ***', !!first && !!off.host.querySelector('[data-stage] img'));
    check('*** ... and does NOT advance: no timer, a Start button, the shell told it is not playing ***',
      off.advanceTimers().length === 0 && !!off.host.querySelector('[data-start]') && off.probe().waiting === true
      && off.states.at(-1)?.playing === false, JSON.stringify({ timers: off.timers.map((t) => t.ms), states: off.states }));
    check('it is not counted as shown until it plays', off.shows.length === 0);
    check('while it waits it says it is here (health.js would otherwise judge it silent)',
      off.timers.some((t) => t.live && t.ms === 15 * 60 * 1000));
    off.bus.publish('photos/play');
    check('*** Play starts it: the SAME picture, now with its interval ***',
      off.probe().currentId === first && off.advanceTimers().length === 1 && off.probe().waiting === false && off.states.at(-1)?.playing === true);
    off.fire();
    await sleep(10);
    check('...and it advances as a slideshow does', off.probe().currentId !== first || off.shows.length >= 1);
    off.done();

    const off2 = rigS({ autostart: false });
    await sleep(80);
    off2.host.querySelector('[data-start]').click();
    check('*** a press on Start does the same ***', off2.probe().waiting === false && off2.advanceTimers().length === 1);
    off2.done();
    const off3 = rigS({ autostart: false });
    await sleep(80);
    off3.host.querySelector('[data-stage]').click();
    check('a press on the picture itself starts it too', off3.probe().waiting === false && off3.advanceTimers().length === 1);
    off3.done();
    const alone = rigS({ autostartAlone: 'off' }, { panelCount: 1 });
    await sleep(80);
    check('"When it is the only thing on the dashboard: it waits" holds a slideshow that is alone',
      alone.probe().waiting === true && alone.advanceTimers().length === 0);
    alone.done();
  }

  // *** SONGS IN THE FOLDER ARE NOT PHOTOS (2026-09-30). ***
  //
  // The listers (folder_source.js, media_agent) learned `kind: 'audio'` so a music folder is not
  // empty. `render` draws an <img> for anything that is not a video, so without `slideshowItems`
  // every .mp3 beside the photos would have been a broken image on the panel that outranks
  // everything. The listing below is classified by the REAL `kindOf`, the way a folder returns it.
  {
    section('a mixed folder: the slideshow shows the photos and skips the songs');
    const names = ['a.jpg', 'song1.mp3', 'b.PNG', 'song2.m4a', 'c.webp', 'song3.flac', 'd.jpeg', 'voice.opus'];
    const mixed = names.map((n) => ({ id: n, path: n, name: n, kind: kindOf(n), url: kindOf(n) === 'image' ? OKPIC(n) : 'data:,' + n }));
    check('PRECONDITION: the lister really does return the songs, as audio',
      mixed.filter((it) => it.kind === 'audio').length === 4, JSON.stringify(mixed.map((it) => it.kind)));
    const pure = slideshowItems([...mixed, { id: 'v', path: 'v.mp4', kind: 'video' }, { id: 'x', path: 'x' },
                                 { id: 'y', path: 'y.pdf', kind: 'document' }, null]);
    check('slideshowItems keeps images and videos only - no audio, no unknown kind, no kind at all',
      pure.map((it) => it.id).join() === 'a.jpg,b.PNG,c.webp,d.jpeg,v', pure.map((it) => it.id).join());

    function mountWith(items) {
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      const timers = [];
      let cfg = { sourceId: 'src-1', intervalMs: 8000 };
      const subs = [];
      const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
                      subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
      const source = { id: 'src-1', label: 'Mixed folder', kind: 'folder' };
      const inst = mountModule('photos', {
        mount: host, bus: createBus(), state,
        events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
        user: USER, profileId: 'p',
        sources: { list: async () => [source], add: async () => source, remove: async () => {} },
        resolveListing: async () => ({ items: items.map((it) => ({ ...it })), albums: [], album: '', count: items.length }),
        setTimer: (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
      });
      inst.init();
      const fire = () => { const t = timers.filter((x) => x.live && x.ms >= 2000).pop(); if (t) { t.live = false; t.fn(); } };
      return { host, inst, fire, timers };
    }

    const p = mountWith(mixed);
    await sleep(120);
    const seen = [];
    const shown = () => p.host.querySelector('.stage')?.firstChild;
    for (let i = 0; i < 24; i++) {
      const el = shown();
      // A picture is named by its alt (its file name); anything else by what is left of its address.
      if (el) seen.push(`${el.tagName.toLowerCase()}:${el.tagName === 'IMG' ? el.alt : String(el.src).replace(/^data:,/, '')}`);
      p.fire();
      await sleep(10);
    }
    check('it kept moving: many slides were shown', seen.length >= 20, `${seen.length} shown`);
    check('*** twenty-odd slides of a mixed folder: not one of them is a song ***',
      seen.length > 0 && seen.every((s) => /^img:[a-d]\./.test(s)), seen.filter((s) => !/^img:[a-d]\./.test(s)).join(', '));
    check('...and every photo in the folder came up', ['a.jpg', 'b.PNG', 'c.webp', 'd.jpeg'].every((n) => seen.includes(`img:${n}`)),
      [...new Set(seen)].join(', '));
    const label = p.host.querySelector('[data-source-label]')?.textContent || '';
    check('the item count under the panel counts the photos, not the songs', /— 4 items/.test(label), label);
    p.inst.destroy(); p.host.remove();

    // A folder that is ONLY music says there are no photos - the existing words - rather than
    // showing a broken image or sitting on "Loading".
    const q = mountWith(names.filter((n) => kindOf(n) === 'audio').map((n) => ({ id: n, path: n, name: n, kind: 'audio', url: 'data:,' + n })));
    await sleep(120);
    const st = q.host.querySelector('[data-status]');
    check('*** a folder of only songs says "No photos", draws nothing, and arms no slideshow timer ***',
      /No photos/.test(st?.textContent || '') && !q.host.querySelector('.stage img, .stage video')
        && !q.timers.some((t) => t.live && t.ms >= 2000),
      `status="${st?.textContent}" img=${!!q.host.querySelector('.stage img')}`);
    q.inst.destroy(); q.host.remove();
  }

  // *** A SOURCE SHOULD DEGRADE, NOT STOP (MIKE_CHANGE_LIST §3e, Mike 2026-09-08): "If a chosen source
  // can't be reached and an equivalent one can, use it and say so somewhere visible. If none can, show
  // something rather than nothing." *** No agent and no server: a registry of tagged sources, a listing
  // seam that can be up / down / hung per source, fake timers, and pictures that really load (SVG data
  // URLs), because "the last pictures seen" means pictures that appeared.
  {
    section('*** a source should degrade, not stop (§3e) ***');
    const { fallbackSources, degradedLine, mayShowSource } = await import('../media_sources.js');
    const S = {
      mine:   { id: 'mine',   label: 'Her albums',        kind: 'agent', person_id: 'p1' },
      mine2:  { id: 'mine2',  label: 'Her other albums',  kind: 'agent', person_id: 'p1' },
      other:  { id: 'other',  label: 'Next door albums',  kind: 'agent', person_id: 'p2' },
      family: { id: 'family', label: 'Family',            kind: 'agent', person_id: null },
      folder: { id: 'folder', label: 'This device',       kind: 'folder' },
    };
    const order = (list, o) => fallbackSources(list, o).map((s) => s.id).join();
    check('stand-ins: the person\'s own other sources first, then the account\'s -- never another resident\'s',
      order([S.other, S.family, S.mine, S.mine2, S.folder], { chosenId: 'mine', personId: 'p1' }) === 'mine2,family,folder',
      order([S.other, S.family, S.mine, S.mine2, S.folder], { chosenId: 'mine', personId: 'p1' }));
    check('*** whose screen unknown: only the account\'s sources may stand in, no resident\'s at all ***',
      order([S.other, S.family, S.mine, S.mine2], { chosenId: 'mine', personId: null }) === 'family',
      order([S.other, S.family, S.mine, S.mine2], { chosenId: 'mine', personId: null }));
    check('mayShowSource: own and account-wide yes, another resident\'s no',
      mayShowSource(S.mine, 'p1') && mayShowSource(S.family, 'p1') && !mayShowSource(S.other, 'p1') && !mayShowSource(S.mine, null));
    check('the words name both: what is showing, and what cannot be reached',
      degradedLine({ shownLabel: 'Family', chosenLabel: 'Her albums' }) === 'Showing “Family” — “Her albums” can’t be reached.',
      degradedLine({ shownLabel: 'Family', chosenLabel: 'Her albums' }));

    const RUN = Date.now().toString(36);
    const WAIT = 555, RECHECK = 777;
    const pic = (tag) => 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="3"><desc>${tag}</desc></svg>`);
    const itemsOf = (sid) => [1, 2, 3].map((i) => ({ id: `${sid}-${i}.jpg`, path: `${sid}-${i}.jpg`, name: `${sid} ${i}`,
      kind: 'image', url: pic(`${sid}-${i}`), sourceId: sid }));
    const blobs = {};
    const killFiles = (sid) => { for (const u of blobs[sid] || []) URL.revokeObjectURL(u); blobs[sid] = []; };
    const streamUrls = [];
    function rigD({ sources, mode, seed = {}, personId = 'p1', instanceId = `ph-deg-${RUN}`, user = `${USER}-deg-${RUN}` }) {
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      const timers = [], sets = [], asked = [];
      let cfg = { intervalMs: 8000, ...seed };
      const subs = [];
      const state = { get: () => cfg, set: (p) => { sets.push(p); cfg = { ...cfg, ...p }; subs.forEach((f) => f(cfg)); },
        subscribe: (f) => { subs.push(f); f(cfg); return () => {}; }, flush() {} };
      const inst = mountModule('photos', {
        mount: host, bus: createBus(), state, instanceId, user, profileId: 'p', personId,
        events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
        sources: { list: async () => sources.slice(), add: async () => { throw new Error('no add in test'); }, remove: async () => {} },
        resolveListing: (src, album) => {
          asked.push(`${src.id}|${album}`);
          const m = mode[src.id] || 'up';
          if (m === 'hang') return new Promise(() => {});
          if (m === 'down') return Promise.reject(new Error(`${src.id} /list -> 502`));
          // The listing answers, but the FILES are another matter (a source dying mid-slideshow):
          //   'blob'      pictures that load until `killFiles` revokes them -- then every one fails;
          //   'deadfiles' every file fails from the start;  'onebroken' one bad file among good ones;
          //   'stream'    files that never finish arriving (an endless response: a hung agent).
          if (m === 'blob' || m === 'deadfiles' || m === 'onebroken' || m === 'stream') {
            const list = itemsOf(src.id).map((it, i) => {
              let url = it.url;
              if (m === 'blob') {
                url = URL.createObjectURL(new Blob([decodeURIComponent(it.url.split(',')[1])], { type: 'image/svg+xml' }));
                (blobs[src.id] ||= []).push(url);
              } else if (m === 'deadfiles' || (m === 'onebroken' && i === 1)) url = `data:,dead-${src.id}-${i}`;
              else if (m === 'stream') url = streamUrls.shift() || `data:,no-stream-${i}`;
              return { ...it, url };
            });
            return Promise.resolve({ items: list, albums: [], album, count: 3 });
          }
          return Promise.resolve({ items: itemsOf(src.id), albums: [], album, count: 3 });
        },
        setTimer: (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
        listingWaitMs: WAIT, sourceRecheckMs: RECHECK,
      });
      inst.init();
      const fire = (ms) => { const t = timers.filter((x) => x.live && x.ms === ms).pop(); if (t) { t.live = false; t.fn(); } return !!t; };
      return { host, inst, timers, sets, asked, fire, setState: (p) => state.set(p),
        label: () => host.querySelector('[data-source-label]')?.textContent || '',
        status: () => { const s = host.querySelector('[data-status]'); return s && !s.hidden ? s.textContent : ''; },
        chip: () => !!host.querySelector('[data-status].chip:not([hidden])'),
        img: () => host.querySelector('[data-stage] img'),
        live: (ms) => timers.filter((t) => t.live && t.ms === ms).length,
        probe: () => inst.impl.__probe(),
        done() { inst.destroy(); host.remove(); } };
    }
    const until = async (fn, ms = 1500) => { const end = Date.now() + ms; while (Date.now() < end) { if (fn()) return true; await sleep(20); } return !!fn(); };
    const savedSource = (r) => r.sets.filter((p) => 'sourceId' in p);

    // 1. UNREACHABLE: the chosen agent refuses; the person's own other source stands in.
    {
      const mode = { mine: 'down' };
      const r = rigD({ sources: [S.other, S.mine, S.family, S.mine2], mode, seed: { sourceId: 'mine' } });
      check('*** UNREACHABLE: the person\'s own other source stands in (not the account\'s, not next door\'s) ***',
        await until(() => /Her other albums/.test(r.label())), r.label() + ' / ' + r.status());
      check('...a picture is showing', !!r.img());
      check('*** ...and it SAYS so, quietly: a corner chip naming both ***',
        /Showing “Her other albums” — “Her albums” can’t be reached/.test(r.status()) && r.chip(), r.status());
      check('...next door\'s source was never even asked', !r.asked.some((a) => a.startsWith('other|')), r.asked.join(' '));
      check('*** ...and NOTHING WAS SAVED: the chosen source is still the chosen source ***',
        savedSource(r).length === 0, JSON.stringify(r.sets));
      check('...it asks after the chosen source on a timer', r.live(RECHECK) === 1, String(r.live(RECHECK)));
      // 2. IT COMES BACK.
      r.fire(RECHECK);                       // still down: asks again later
      await sleep(30);
      check('still down at the recheck: the stand-in stays and it asks again later',
        /Her other albums/.test(r.label()) && r.live(RECHECK) === 1);
      mode.mine = 'up';
      r.fire(RECHECK);
      check('*** COMES BACK: the chosen source is shown again ***', await until(() => /Her albums —/.test(r.label())), r.label());
      check('...the chip is gone', await until(() => !r.status()), r.status());
      check('...no more rechecks', r.live(RECHECK) === 0);
      check('...and still nothing saved', savedSource(r).length === 0, JSON.stringify(r.sets));
      r.done();
    }
    // 3. MISSING: the chosen id is not in the list at all, and exactly one other source is. This is the
    // case that used to SAVE the other one over the choice ("the only source there").
    {
      const r = rigD({ sources: [S.family], mode: {}, seed: { sourceId: 'gone-id' } });
      check('*** MISSING: a source that is no longer listed: another one stands in ***',
        await until(() => /Family/.test(r.label())), r.label() + ' / ' + r.status());
      check('...and says the chosen one cannot be reached', /Showing “Family” — the chosen source can’t be reached/.test(r.status()), r.status());
      check('*** ...and the choice is NOT overwritten with the only source left ***',
        savedSource(r).length === 0, JSON.stringify(r.sets));
      r.done();
    }
    // 4. HUNG: the chosen agent never answers. After the wait, a stand-in.
    {
      const mode = { mine: 'hang' };
      const r = rigD({ sources: [S.mine, S.family], mode, seed: { sourceId: 'mine' } });
      await sleep(60);
      check('HUNG: while the chosen source has not answered, it is still loading', /Loading/.test(r.status()) && !r.img(), r.status());
      r.fire(WAIT);
      check('*** HUNG: after the wait, the account\'s source stands in ***', await until(() => /Family/.test(r.label())), r.label());
      r.done();
    }
    // 5. NEVER ANOTHER RESIDENT'S, whether the person is known or not.
    {
      const r = rigD({ sources: [S.mine, S.other], mode: { mine: 'down' }, seed: { sourceId: 'mine' }, instanceId: `ph-x-${RUN}` });
      await until(() => /unreachable/i.test(r.status()));
      check('*** the only other source is next door\'s: it is NOT shown, and the panel says what is wrong ***',
        !/Next door/.test(r.label()) && /unreachable/i.test(r.status()) && !r.asked.some((a) => a.startsWith('other|')),
        `${r.label()} / ${r.status()} / ${r.asked.join(' ')}`);
      check('...Retry is still there', !!r.host.querySelector('[data-retry]'));
      r.done();
      const n = rigD({ sources: [S.mine, S.other, S.family], mode: { mine: 'down' }, seed: { sourceId: 'mine' }, personId: null, instanceId: `ph-n-${RUN}` });
      check('*** whose screen unknown: the account\'s source stands in, next door\'s is never asked ***',
        await until(() => /Family/.test(n.label())) && !n.asked.some((a) => a.startsWith('other|')), `${n.label()} / ${n.asked.join(' ')}`);
      n.done();
    }
    // 6. NONE CAN: show the last pictures seen rather than nothing -- this session's, then remembered.
    {
      const mode = { mine: 'up' };
      const inst = `ph-keep-${RUN}`;
      const r = rigD({ sources: [S.mine], mode, seed: { sourceId: 'mine' }, instanceId: inst });
      await until(() => r.probe().seen >= 1);
      r.fire(8000); await until(() => r.probe().seen >= 2);
      r.fire(8000); await until(() => r.probe().seen >= 3);
      check('PRECONDITION: pictures really appeared', r.probe().seen >= 2, String(r.probe().seen));
      // The source goes down, and the panel lists again (what a changed album, a Retry or a late person
      // does). The test's own write is cleared from the record, so only the panel's writes are counted.
      mode.mine = 'down';
      r.setState({ album: 'Holiday' });
      r.sets.length = 0;
      check('*** NONE CAN: the last pictures keep showing (a slideshow over them, not a frozen frame) ***',
        await until(() => r.probe().keptMode) && !!r.img() && r.live(8000) >= 1, JSON.stringify(r.probe()));
      check('...and it says so', /Showing the last pictures — “Her albums”/.test(r.status()), r.status());
      check('...with Retry', !!r.host.querySelector('[data-retry]'));
      check('...nothing saved', savedSource(r).length === 0, JSON.stringify(r.sets));
      check('...it keeps asking after the chosen one', r.live(RECHECK) === 1);
      r.done();
      // Remembered across a restart: a new panel (same panel id, same person) whose source is down from the start.
      const again = rigD({ sources: [S.mine], mode: { mine: 'down' }, seed: { sourceId: 'mine' }, instanceId: inst });
      check('*** AFTER A RESTART with the source down: the remembered pictures show, not "unreachable" over nothing ***',
        await until(() => again.probe().keptMode && !!again.img()), `${again.status()} ${JSON.stringify(again.probe())}`);
      again.done();
      // Remembered per PERSON: the same panel on a screen whose person is unknown does not get them.
      const nobody = rigD({ sources: [S.mine], mode: { mine: 'down' }, seed: { sourceId: 'mine' }, instanceId: inst, personId: null });
      await until(() => /unreachable/i.test(nobody.status()));
      check('*** ...but never on somebody else\'s screen: another person\'s panel gets none of them ***',
        !nobody.probe().keptMode && !nobody.img(), JSON.stringify(nobody.probe()));
      nobody.done();
    }

    // =========================== A SOURCE THAT DIES MID-SLIDESHOW ===========================
    // (The coordinator, 2026-10-02: "a source that dies mid-slideshow, so broken images keep cycling.")
    section('*** a source that dies mid-slideshow: no broken pictures, no cycle, a stand-in ***');
    const next = (r) => r.host.querySelector('[data-next]').click();
    const goodUp = (r) => !!r.host.querySelector('[data-stage] img[data-load="good"]');
    const brokenOnTop = (r) => {
      // What is SEEN is the last child laid over the stage (a held picture), else the first.
      const st = r.host.querySelector('[data-stage]');
      const top = st && (st.querySelector('[data-held]') || st.firstElementChild);
      return !!top && top.tagName === 'IMG' && top.dataset.load !== 'good';
    };
    // 7. ONE BAD FILE: skipped quietly. The source is not taken down, nothing is said, and the bad
    // picture is never what is on screen (the good one before it stays up over the gap).
    {
      const r = rigD({ sources: [S.mine, S.family], mode: { mine: 'onebroken' }, seed: { sourceId: 'mine' }, instanceId: `ph-one-${RUN}` });
      await until(() => goodUp(r));
      let sawBad = 0, badSeen = 0;
      for (let k = 0; k < 14; k++) {
        next(r);
        await sleep(70);
        if (r.probe().currentId === 'mine-2.jpg') { badSeen++; if (brokenOnTop(r)) sawBad++; }
      }
      check('PRECONDITION: the bad file came up', badSeen >= 1, String(badSeen));
      check('*** ONE BAD FILE: never what is on screen -- the picture before it stays up ***', sawBad === 0, `${sawBad} of ${badSeen}`);
      check('*** ...and it does not take the source down, or say anything ***',
        !r.probe().degraded && r.probe().setAside.length === 0 && !r.status() && /Her albums —/.test(r.label()),
        `${JSON.stringify(r.probe())} / ${r.status()} / ${r.label()}`);
      r.done();
    }
    // 8. THE SOURCE DIES: its files stop loading. Three in a row: set aside, a stand-in, the chip.
    {
      const mode = { mine: 'blob' };
      const r = rigD({ sources: [S.mine, S.family], mode, seed: { sourceId: 'mine' }, instanceId: `ph-die-${RUN}` });
      check('PRECONDITION: the chosen source\'s pictures load', await until(() => goodUp(r) && /Her albums —/.test(r.label())), r.label());
      killFiles('mine');
      mode.mine = 'deadfiles';
      let sawBad = 0;
      for (let k = 0; k < 3; k++) { next(r); await sleep(90); if (brokenOnTop(r)) sawBad++; }
      check('*** DIES: after three files in a row fail, the account\'s source stands in ***',
        await until(() => /Family/.test(r.label())), `${r.label()} / ${JSON.stringify(r.probe())}`);
      check('...the dead source is set aside', r.probe().setAside.includes('mine'), JSON.stringify(r.probe().setAside));
      check('*** ...and it SAYS so, in the chip ***', /Showing “Family” — “Her albums” can’t be reached/.test(r.status()) && r.chip(), r.status());
      check('*** ...no broken picture was ever on top while it worked that out ***', sawBad === 0, String(sawBad));
      check('...the stand-in\'s pictures load', await until(() => goodUp(r)));
      check('...nothing saved', savedSource(r).length === 0, JSON.stringify(r.sets));
      // The recheck: the listing answers, but a file still does not load -- NOT back.
      r.fire(RECHECK);
      await sleep(150);
      check('*** recheck while its files still fail: it is NOT taken back (a listing that answers proves nothing) ***',
        /Family/.test(r.label()) && r.live(RECHECK) === 1, `${r.label()} / ${r.live(RECHECK)}`);
      mode.mine = 'blob';
      r.fire(RECHECK);
      check('*** COMES BACK: once a picture of it really loads, the chosen source returns ***',
        await until(() => /Her albums —/.test(r.label()) && !r.status()), `${r.label()} / ${r.status()}`);
      check('...set-aside cleared, no more rechecks, nothing saved',
        r.probe().setAside.length === 0 && r.live(RECHECK) === 0 && savedSource(r).length === 0);
      r.done();
    }
    // 9. DIES, AND NOTHING CAN STAND IN: the last pictures kept (from an earlier run of this panel).
    {
      const inst = `ph-diekeep-${RUN}`;
      const first = rigD({ sources: [S.mine], mode: { mine: 'up' }, seed: { sourceId: 'mine' }, instanceId: inst });
      await until(() => first.probe().seen >= 1);
      first.fire(8000); await until(() => first.probe().seen >= 2);
      first.done();
      const mode = { mine: 'blob' };
      const r = rigD({ sources: [S.mine], mode, seed: { sourceId: 'mine' }, instanceId: inst });
      await until(() => goodUp(r) && /Her albums —/.test(r.label()));
      killFiles('mine'); mode.mine = 'deadfiles';
      for (let k = 0; k < 3; k++) { next(r); await sleep(90); }
      check('*** DIES, NO STAND-IN: the last pictures seen carry on, with the chip ***',
        await until(() => r.probe().keptMode && goodUp(r)) && /Showing the last pictures — “Her albums”/.test(r.status()),
        `${r.status()} / ${JSON.stringify(r.probe())}`);
      check('...a slideshow over them (not a frozen frame), and it keeps asking after the source',
        r.live(8000) >= 1 && r.live(RECHECK) === 1);
      r.done();
    }
    // 10. DIES, NOTHING AT ALL: the words, the last good picture left up, and no cycle.
    {
      const mode = { mine: 'blob' };
      const r = rigD({ sources: [S.mine], mode, seed: { sourceId: 'mine' }, instanceId: `ph-dienone-${RUN}` });
      await until(() => goodUp(r));
      killFiles('mine'); mode.mine = 'deadfiles';
      for (let k = 0; k < 3; k++) { next(r); await sleep(90); }
      check('*** DIES, NOTHING ELSE: it says the source is unreachable, with Retry ***',
        await until(() => /unreachable/i.test(r.status())) && !!r.host.querySelector('[data-retry]'), r.status());
      check('*** ...the last good picture stays up rather than a blank or a broken one ***', goodUp(r) && !brokenOnTop(r));
      check('*** ...and NO CYCLE: no slideshow timer, nothing left to advance to ***',
        r.live(8000) === 0 && r.probe().ids.length === 0, JSON.stringify({ t: r.live(8000), ids: r.probe().ids }));
      next(r); await sleep(60);
      check('...a press of next does not bring a dead file back', goodUp(r) && !brokenOnTop(r) && r.probe().ids.length === 0);
      check('...and it keeps asking after the source', r.live(RECHECK) === 1);
      r.done();
    }
    // 11. HUNG FILES: a picture that never finishes arriving, and nothing has appeared for the listing
    // wait, is a source that is not serving. (Each file is an endless server response; needs the server.)
    {
      let ok = true;
      try {
        const { authHeaders } = await import('../auth.js');
        for (let i = 0; i < 3; i++) {
          const res = await fetch('/api/stream/ticket', { method: 'POST', headers: authHeaders(`${USER}-stream-${RUN}`) });
          if (!res.ok) { ok = false; break; }
          streamUrls.push(`/api/stream?t=${encodeURIComponent((await res.json()).ticket)}`);
        }
      } catch { ok = false; }
      if (!ok) skip('a picture that never finishes arriving', 'no server to hold a response open');
      else {
        const r = rigD({ sources: [S.mine, S.family], mode: { mine: 'stream' }, seed: { sourceId: 'mine' }, instanceId: `ph-hung-${RUN}` });
        await until(() => !!r.img());
        await sleep(WAIT + 150);   // nothing has appeared for longer than the listing wait
        check('PRECONDITION: the picture is still arriving', r.img()?.dataset.load === 'loading', r.img()?.dataset.load);
        r.fire(8000);              // its turn is over
        check('*** HUNG: a picture that never arrives (and nothing has for the wait) takes the source down: a stand-in ***',
          await until(() => /Family/.test(r.label())) && r.probe().setAside.includes('mine'), `${r.label()} / ${JSON.stringify(r.probe())}`);
        r.done();
      }
      streamUrls.length = 0;
    }
  }

  // *** 15 SECONDS BY DEFAULT, AND A NEW PANEL STARTS FROM ONE ALREADY ON THE SCREEN. ***
  // Mike, 2026-09-29: "8 seconds is too short for the default though. Make it 15." and "keep it
  // per panel, copy from existing". Both backends: the server's profile client and the signed-out
  // local one, because a new panel comes through `addModule` on either.
  {
    section('the default, and a new panel copying its sibling');
    const interval = normalizeField(getManifest('photos').settings.find((s) => s.key === 'intervalMs'));
    check('the declared default is 15 seconds', fieldValue(interval, {}) === 15000
      && displayValue(interval, fieldValue(interval, {})) === '15 seconds',
      `${fieldValue(interval, {})}`);

    // SIGNED OUT: the local backend (IndexedDB), no server involved.
    {
      const backend = createLocalBackend();
      const scr = await backend.profiles.create('TEST-copy-local');
      const a = await backend.profiles.addModule(scr.id, 'photos');
      const sa = backend.makeState(a.id, {}, scr.id); await sa.load();
      sa.set({ intervalMs: 30000 }); await sa.flush();
      const b = await backend.profiles.addModule(scr.id, 'photos');
      const sb = backend.makeState(b.id, {}, scr.id); await sb.load();
      check('*** signed out: a new photos panel on a screen whose photos panel is 30 s starts at 30 s ***',
        sb.get().intervalMs === 30000, JSON.stringify(sb.get()));
      sb.set({ intervalMs: 4000 }); await sb.flush();
      await sa.load();
      check('...and it is a starting value, not a link: changing the new one leaves the old one alone',
        sa.get().intervalMs === 30000, JSON.stringify(sa.get()));
      const other = await backend.profiles.create('TEST-copy-local-empty');
      const c = await backend.profiles.addModule(other.id, 'photos');
      const sc = backend.makeState(c.id, {}, other.id); await sc.load();
      check('signed out: on a screen with no photos panel it starts on the default (15 s), not the '
        + 'other screen’s 30', sc.get().intervalMs === undefined && fieldValue(interval, sc.get()) === 15000,
        JSON.stringify(sc.get()));
      await backend.profiles.remove(scr.id); await backend.profiles.remove(other.id);
    }

    // SIGNED IN: the server's profile client. Needs the app server, not a media agent.
    let serverUp = false;
    try { await createProfilesClient({ user: USER }).list(); serverUp = true; } catch { serverUp = false; }
    if (!serverUp) {
      skip('signed-in copy and the three doors', 'no app server answering');
    } else {
      const profiles = createProfilesClient({ user: USER });
      const scr = await profiles.create('TEST-copy-server');
      const a = await profiles.addModule(scr.id, 'photos');
      const sa = createState({ url: profiles.stateURL(scr.id, a.id), user: USER }); await sa.load();
      sa.set({ intervalMs: 30000 }); await sa.flush();
      const b = await profiles.addModule(scr.id, 'photos');
      const sb = createState({ url: profiles.stateURL(scr.id, b.id), user: USER }); await sb.load();
      check('*** signed in: a new photos panel on a screen whose photos panel is 30 s starts at 30 s ***',
        sb.get().intervalMs === 30000, JSON.stringify(sb.get()));
      const other = await profiles.create('TEST-copy-server-empty');
      const c = await profiles.addModule(other.id, 'photos');
      const sc = createState({ url: profiles.stateURL(other.id, c.id), user: USER }); await sc.load();
      check('signed in: on a screen with no photos panel it starts on the default (15 s)',
        sc.get().intervalMs === undefined && fieldValue(interval, sc.get()) === 15000, JSON.stringify(sc.get()));
      // A module that declares nothing copies nothing (and costs no extra request).
      const y1 = await profiles.addModule(other.id, 'youtube');
      const sy = createState({ url: profiles.stateURL(other.id, y1.id), user: USER }); await sy.load();
      sy.set({ muted: true }); await sy.flush();
      const y2 = await profiles.addModule(other.id, 'youtube');
      const sy2 = createState({ url: profiles.stateURL(other.id, y2.id), user: USER }); await sy2.load();
      check('CONTROL: a module with no copyFromSibling starts empty', Object.keys(sy2.get()).length === 0,
        JSON.stringify(sy2.get()));

      // *** EVERY DOOR WRITES THE ONE VALUE THE RUNNING PANEL OBEYS. *** Mike: "Should there be
      // three independent sources to control those settings? I would think setting it anywhere
      // should be the same." There are three doors and ONE stored value per panel. Each door
      // below writes, then the row is read back FRESH from the server, and the running panel's
      // next timer is checked - so a door that wrote a different key, a different row or a
      // different type fails here, not on somebody's screen.
      section('three doors, one stored value');
      const timers = [];
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;width:300px;height:200px';
      document.body.append(host);
      const live = createState({ url: profiles.stateURL(scr.id, a.id), user: USER, pollMs: 200 });
      await live.load();
      const ITEMS = [1, 2, 3].map((i) => ({ id: 'd' + i, path: 'd' + i + '.jpg', name: 'd' + i, kind: 'image', url: OKPIC('d' + i) }));
      const inst = mountModule('photos', {
        mount: host, bus: createBus(), state: live, instanceId: a.id,
        events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
        user: USER, profileId: scr.id,
        sources: { list: async () => [{ id: 'src-1', label: 'S', kind: 'agent', base_url: 'http://127.0.0.1:9' }] },
        resolveListing: async () => ({ items: ITEMS.map((x) => ({ ...x })), albums: [], album: '', count: 3 }),
        setTimer: (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
      });
      inst.init();
      live.startPolling();
      await sleep(150);
      const armedNow = () => timers.filter((t) => t.live && t.ms >= 2000).map((t) => t.ms).join();
      const rowNow = async () => { const r = createState({ url: profiles.stateURL(scr.id, a.id), user: USER }); await r.load(); return r.get(); };

      // Door 1: the panel's own control.
      const sel = host.querySelector('[data-opt="intervalMs"]');
      sel.value = '60000'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      await live.flush();
      const r1 = await rowNow();
      check('door 1, the panel’s own control: the row holds the NUMBER 60000 under intervalMs',
        r1.intervalMs === 60000 && r1.intervalSec === undefined, JSON.stringify(r1));
      check('...and the running panel is now on 60 s', armedNow() === '60000', armedNow());

      // Door 2: the kiosk's settings menu - the same `fieldItems(fieldsFor(manifest, instance))`
      // + `state.set` composition kiosk.js builds for the focused panel (kiosk_test drives the
      // real menu; this checks where its write LANDS).
      const menuRow = () => fieldItems(fieldsFor(getManifest('photos'), inst), {
        values: () => live.get() || {}, onStep: (k, v) => live.set({ [k]: v }),
      }).find((i) => i.id === 'set:intervalMs');
      check('door 2 reads what door 1 wrote', menuRow().hint === '60 seconds', menuRow().hint);
      menuRow().run();                     // 60 wraps to 4
      await live.flush();
      const r2 = await rowNow();
      check('door 2, the settings menu: the same row, the same key, a number', r2.intervalMs === 4000, JSON.stringify(r2));
      check('...and the running panel is now on 4 s', armedNow() === '4000', armedNow());

      // Door 3: the Settings module (Home's "edit another module's settings"), which opens its
      // OWN state handle on the panel's row - the running panel hears it through polling.
      const shost = document.createElement('div');
      shost.style.cssText = 'position:absolute;left:-9999px;width:400px;height:500px';
      document.body.append(shost);
      const sm = mountModule('settings', { mount: shost, bus: createBus(), user: USER, profileId: scr.id,
        instanceId: 'settings-door-test', personId: null,
        state: { get: () => ({}), set() {}, subscribe: () => () => {}, load: async () => ({}), flush: async () => {} },
        events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() } });
      await sm.init();
      await sleep(300);
      shost.querySelector(`[data-id="mod-${a.id}"]`)?.click();
      await sleep(400);
      const doorBtn = [...shost.querySelectorAll('.st-item')].find((b) => /Change photo every/.test(b.textContent));
      check('door 3 reads what door 2 wrote', !!doorBtn && /4 seconds/.test(doorBtn.textContent), doorBtn?.textContent);
      doorBtn?.click();                    // 4 -> 8
      await sleep(700);                    // its handle debounces the write
      const r3 = await rowNow();
      check('door 3, the Settings module: the same row, the same key, a number', r3.intervalMs === 8000, JSON.stringify(r3));
      let heard = false;
      for (let i = 0; i < 30 && !heard; i++) { await sleep(100); heard = armedNow() === '8000'; }
      check('...and the running panel picks it up without a reload', heard, armedNow());

      sm.destroy(); shost.remove(); inst.destroy(); host.remove();
      await profiles.remove(scr.id); await profiles.remove(other.id);
    }
  }

  // *** CONNECT FROM HERE, NOT ONLY FROM MEDIA / SOURCES. *** 2026-09-08, Mike's "sources
  // structural rule" -- no source at all now offers a real "Connect a folder" button, not just
  // words pointing at a separate tab. Like the existing Allow button, actually clicking THROUGH
  // a real folder picker cannot be driven headlessly (it needs a real OS dialog and a real user
  // gesture) -- this checks the button appears with the right offer, which is the same
  // established boundary `§controls-photos-allow` already drew.
  {
    const host = document.createElement('div');
    document.body.append(host);
    let cfg = { sourceId: null };
    const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; },
                    subscribe: (f) => { f(cfg); return () => {}; }, flush() {} };
    const inst = mountModule('photos', {
      mount: host, bus: createBus(), state,
      events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
      user: USER, profileId: 'p',
      sources: { list: async () => [], add: async () => { throw new Error('no picker in test'); }, remove: async () => {} },
    });
    inst.init();
    await sleep(120);
    const status = host.querySelector('[data-status]');
    check('no source connected is a real status message, not a blank panel',
      !status?.hidden && /no photo source connected/i.test(status?.textContent || ''),
      status?.textContent);
    // `showDirectoryPicker` exists in the real Chrome this suite runs in, so the offer should
    // be there -- the button existing is what's under test, not completing the OS dialog.
    const btn = host.querySelector('[data-status] [data-action]');
    check('*** and it offers to connect one right here, not just "see Media / Sources" ***',
      !!btn && /connect a folder/i.test(btn.textContent), status?.innerHTML);
    inst.destroy();
    host.remove();
  }

  // The RECOVERY control - the one somebody reaches for when something is already wrong.
  await pressRetry('photos', check);

  try {
    const profiles = createProfilesClient({ user: USER });
    const ms = createMediaSourcesClient({ user: USER });

    if (!(await agentUp(AGENT))) {
      skip('everything that needs a media agent', `no agent answering at ${AGENT}`);
      throw { __skipped: true };
    }

    // fresh source pointing at the running agent
    for (const s of await ms.list()) if (s.label.startsWith('TEST-')) await ms.remove(s.id);
    const source = await ms.add({ label: 'TEST-photos', base_url: AGENT, kind: 'agent' });

    // fresh profile + a photos instance
    const profile = await profiles.create('TEST-photos');
    const mod = await profiles.addModule(profile.id, 'photos');

    const state = createState({ url: profiles.stateURL(profile.id, mod.id), user: USER });
    const events = createEvents({ url: profiles.eventsURL(profile.id, mod.id), user: USER });
    await state.load(); await events.load();
    // point the instance at the source; huge interval so auto-advance never fires
    // mid-test (we drive advances by hand for determinism)
    state.set({ sourceId: source.id, intervalSec: 3600, fit: 'cover' });
    await state.flush();

    const bus = createBus();
    const host = document.getElementById('host');
    const instance = mountModule('photos', { mount: host, bus, state, events, user: USER, profileId: profile.id });
    instance.init();

    // wait for the first image to render + decode
    let up = false;
    for (let i = 0; i < 60; i++) {
      const el = document.querySelector('#host .stage img');
      if (el && el.complete && el.naturalWidth > 0) { up = true; break; }
      await sleep(100);
    }
    check('module resolves source and renders an image', up);

    await events.load();
    const initialPlays = (events.get().events || []).filter((e) => e.kind === 'play').length;
    check('first shown item logged a play event', initialPlays >= 1, `plays=${initialPlays}`);

    // Expected root-album count comes from the agent itself (no hardcoding).
    // Only what the slideshow may show: a fixture folder with songs in it lists them too (as
    // `kind: 'audio'`, since 2026-09-30), and they must NOT surface - checked after the loop.
    const allRootItems = (await (await fetch(`${AGENT}/list`)).json()).items;
    const rootItems = slideshowItems(allRootItems);
    const songs = allRootItems.filter((it) => it.kind === 'audio').map((it) => it.name);
    const expected = rootItems.length;
    check('root album has a pool big enough to exercise anti-repeat', expected >= 4, `count=${expected}`);

    // Drive advances: collect coverage, assert no immediate repeat.
    const seen = new Set();
    let immediateRepeat = false;
    let prevOfLast = null, lastBefore = null;
    for (let i = 0; i < 24; i++) {
      const before = base(curSrc());
      seen.add(before);
      bus.publish('photos/next');
      await sleep(50);
      const after = base(curSrc());
      seen.add(after);
      if (after === before) immediateRepeat = true;
      prevOfLast = lastBefore; lastBefore = before;   // track for prev() check
    }
    check('no immediate repeat across 24 advances', !immediateRepeat);
    check(`coverage: all ${expected} items surfaced`, seen.size === expected, `seen=${[...seen].join(',')}`);
    check(`no song from the real agent's listing ever surfaced (${songs.length} in the folder)`,
      !songs.some((n) => seen.has(n)), `songs=${songs.join(',')} seen=${[...seen].join(',')}`);

    // prev() should step back to the previously shown item
    const beforePrev = base(curSrc());
    bus.publish('photos/prev');
    await sleep(50);
    const afterPrev = base(curSrc());
    check('prev() returns to the prior image', afterPrev === lastBefore && afterPrev !== beforePrev,
      `beforePrev=${beforePrev} afterPrev=${afterPrev} expected=${lastBefore}`);

    // Append-only play history grew, and each play carries {id, at}
    await sleep(600);
    await events.load();
    const plays = (events.get().events || []).filter((e) => e.kind === 'play');
    check('play history grew (append-only)', plays.length >= initialPlays + 20, `plays=${plays.length}`);
    check('every play event carries id + numeric at',
      plays.every((e) => e.data && e.data.id && Number.isFinite(e.data.at)));
    check('prev() did NOT log a play (replay, not a new play)',
      plays.length <= initialPlays + 24 + 1, `plays=${plays.length}`);

    instance.destroy();
    // after destroy, the auto-advance timer is cleared (no throw, no further renders)
    check('destroy() cleans up without error', true);

  } catch (e) {
    // The skip throw is control flow, not a fault. Anything else still is one.
    if (!e || !e.__skipped) check('unexpected error', false, String(e && e.stack || e));
  }

  // =====================================================================================
  // *** THE "ALLOW" BUTTON: HER PHOTOS COMING BACK, AND NOTHING HAD EVER PRESSED IT. ***
  //
  // A folder handle loses permission on an ordinary browser restart. When that happens this
  // module does NOT offer Retry -- retrying cannot work, because the browser will not re-grant
  // access without a user gesture aimed at asking for it -- so it offers one button, and that
  // button is the entire path back to her photographs.
  //
  // `unpressed_controls.py` lists `[data-action]` among 18 controls no test has ever pressed.
  // It only appears when the listing fails in one specific way, which is why it needed a seam
  // (`ctx.resolveListing`) before it could be reached at all.
  section('*** the Allow button — the way back from a lost folder permission ***');
  try {
    const host = document.getElementById('host');
    host.innerHTML = '';
    const state = {
      get: () => ({ sourceId: 'folder-x', album: '' }), set: () => {}, flush: () => {},
      subscribe: (fn) => { fn({ sourceId: 'folder-x', album: '' }); return () => {}; },
    };
    let asked = 0;
    const inst = mountModule('photos', {
      mount: host, bus: createBus(), state,
      events: { append: async () => {}, load: async () => {}, flush: async () => {},
                get: () => ({ events: [] }), subscribe: () => () => {}, startPolling() {},
                destroy() {} },
      sources: { list: async () => [{ id: 'folder-x', label: 'Her photos', kind: 'folder' }] },
      // The exact failure the button exists for.
      resolveListing: async () => {
        asked++;
        const e = new Error("that folder's permission is \"prompt\"");
        e.code = 'permission';
        throw e;
      },
    });
    inst.init();
    for (let i = 0; i < 40 && !host.querySelector('[data-action]'); i++) await sleep(50);

    const btn = host.querySelector('[data-action]');
    check('*** a lost permission offers a button, not a dead panel ***', !!btn,
      host.textContent.slice(0, 140));
    check('...and it says what it will do', btn && /allow/i.test(btn.textContent),
      btn && btn.textContent);
    // RETRY IS DELIBERATELY ABSENT HERE: it cannot work without a gesture aimed at the prompt,
    // and offering it would be a button that fails every time somebody presses it.
    check('*** ...and Retry is NOT offered, because retrying cannot work ***',
      !host.querySelector('[data-retry]'), host.textContent.slice(0, 140));

    // PRESS IT. The point of this whole section.
    const before = host.textContent;
    btn.click();
    await sleep(60);
    check('*** pressing it does something ***', host.textContent !== before,
      `before=${before.slice(0, 60)} after=${host.textContent.slice(0, 60)}`);

    // AND IT DOES NOT LEAVE A DEAD END. In a test browser there is no real folder handle, so
    // the request fails -- which is the case that matters most: somebody who lands here must
    // still have a way forward rather than a panel with nothing on it.
    for (let i = 0; i < 40; i++) {
      if (!/asking/i.test(host.textContent)) break;
      await sleep(50);
    }
    const stillActionable = !!host.querySelector('[data-action]')
      || !!host.querySelector('[data-retry]');
    check('*** ...and a refusal leaves a way forward, never a dead panel ***',
      stillActionable, host.textContent.slice(0, 160));
    check('...and it still explains itself', host.textContent.trim().length > 10,
      host.textContent.slice(0, 120));

    inst.destroy();
  } catch (e) {
    check('the Allow button section threw', false, String((e && e.stack) || e));
  }

  const sum = document.getElementById('summary');
  if (skipped && !failed) {
    sum.textContent = `SKIPPED \u2014 the media agent this suite drives is not running `
      + `(${passed} checks that do not need it passed)`;
    sum.dataset.skipped = 'true';
    sum.className = 'skip';
  } else {
    sum.textContent = `${passed} passed, ${failed} failed`
      + (skipped ? `, ${skipped} NOT RUN` : '');
    sum.className = failed ? 'fail' : 'pass';
  }
  sum.dataset.done = 'true'; sum.dataset.failed = String(failed);
})();
</script>
</body>
</html>
