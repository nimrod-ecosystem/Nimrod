<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>village - the castle and the village (Design's item 45)</title>
<style>body{font:14px system-ui;margin:16px}.pass{color:#060}.fail{color:#b00;font-weight:600}#host .box{position:relative;width:640px;height:360px;container-type:size;border:1px solid #888}</style>
</head>
<body>
<h1>village <span id="summary">running…</span></h1>
<div id="out"></div>
<div id="host"></div>
<script type="module">
import { mountModule, getManifest } from '../module.js';
import { createBus } from '../bus.js';
import { TYPE, SETTINGS, recipeFor, ASSET_BASE, LIGHT_CHECK_MS, STAGE, MOVE_STEP, TURN_STEP, SIZE_RANGE, PIECES_MAX,
  pieceName, pieceFields, pieceValues, withPieceEdit, withoutPiece, withCopy, withNewPiece, addOptions, ownRecipe, COUNT_THINGS } from '../modules/village.js';
import { OBJECTS } from '../count_objects.js';
const objectNames = Object.keys(OBJECTS);
import { attachHandles, svgGeometry } from '../room_handles.js';
import { createEditMode } from '../edit_mode.js';
import { VILLAGE_SCENES, PIECES } from '../village_kit.js';
import { CAST } from '../cast.js';
import { CATALOG } from '../modules_catalog.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;
function check(name, ok, detail = '') {
  const p = document.createElement('div');
  p.className = ok ? 'pass' : 'fail';
  p.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? `   ${detail}` : ''}`;
  out.append(p);
  if (ok) passed += 1; else failed += 1;
}
function section(t) { const h = document.createElement('h2'); h.textContent = t; out.append(h); }
const J = (v) => JSON.stringify(v);
function fakeRow(initial = {}) {
  let v = { ...initial };
  const subs = new Set();
  return { get: () => v, set(p) { v = { ...v, ...p }; [...subs].forEach((f) => f(v)); }, subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
    load: async () => v, flush: async () => {}, startPolling() {}, destroy() {} };
}
function fakeTimers() {
  let seq = 0; let armed = [];
  return { setTimer: (fn, ms) => { const id = ++seq; armed.push({ id, fn, ms }); return id; }, clearTimer: (id) => { armed = armed.filter((t) => t.id !== id); },
    fire() { const due = armed; armed = []; due.forEach((t) => t.fn()); }, pending: () => armed.length, last: () => armed[armed.length - 1] };
}
function mount(state, extra = {}) {
  const box = document.createElement('div'); box.className = 'box'; document.getElementById('host').append(box);
  const timers = fakeTimers();
  const inst = mountModule(TYPE, { mount: box, bus: createBus(), state, user: 'u', instanceId: `v-${Math.random().toString(36).slice(2)}`, personId: null,
    setTimer: timers.setTimer, clearTimer: timers.clearTimer, ...extra });
  inst.init();
  return { box, timers, inst, probe: () => inst.impl.__probe(), q: (s) => box.querySelector(s), done() { inst.destroy(); box.remove(); } };
}

try {
  section('registered, with Design\'s scenes and cast');
  check('*** "Castle and village" is a module (new core) ***', getManifest(TYPE)?.title === 'Castle and village' && getManifest(TYPE)?.core === 'new');
  check('its scenes are Design\'s four starting scenes', J(SETTINGS.find((f) => f.key === 'scene').options.map((o) => o.value)) === J(Object.keys(VILLAGE_SCENES))
    && Object.keys(VILLAGE_SCENES).includes('village') && Object.keys(VILLAGE_SCENES).includes('market'));
  check('the cast has Mike\'s names and the new members', CAST.kenny && CAST.rose && CAST.jack && CAST.robin && CAST.jess && CAST.vince && CAST.merlin && CAST.michael && CAST.gladys && CAST.nimrod);
  check('it is in the Modules catalog, beta', CATALOG.some((m) => m.type === TYPE && m.stage === 'beta'));

  section('the recipe a panel shows (pure)');
  const noon = new Date(2026, 9, 25, 12, 0), late = new Date(2026, 9, 25, 23, 0);
  const r0 = recipeFor({}, noon);
  check('*** by default: The village, crafted, with the card frame, by day at noon ***', J(r0.pieces) === J(VILLAGE_SCENES.village.recipe.pieces)
    && r0.look === 'crafted' && r0.frame === true && r0.time === 'day', J({ look: r0.look, time: r0.time, frame: r0.frame }));
  check('*** "Follow the clock": night at 11 pm; a fixed time stays ***', recipeFor({}, late).time === 'night' && recipeFor({ time: 'evening' }, late).time === 'evening');
  check('toon, no frame, another scene', recipeFor({ look: 'toon', frame: false, scene: 'castle' }, noon).look === 'toon'
    && recipeFor({ frame: false }, noon).frame === false && J(recipeFor({ scene: 'castle' }, noon).pieces) === J(VILLAGE_SCENES.castle.recipe.pieces));
  const own = { pieces: [{ piece: Object.keys(PIECES)[0], x: 800, y: 700 }] };
  check('a panel\'s own recipe (an edited scene, next step) is drawn instead', J(recipeFor({ recipe: own }, noon).pieces) === J(own.pieces));
  check('an unknown scene falls back to the village, never nothing', J(recipeFor({ scene: 'nope' }, noon).pieces) === J(VILLAGE_SCENES.village.recipe.pieces));

  section('*** drawn on a panel ***');
  const st = fakeRow({ time: 'day' });
  const v = mount(st);
  const svg = () => v.q('[data-village] svg');
  check('*** the scene is drawn: one SVG, the 1600x900 stage ***', !!svg() && svg().getAttribute('viewBox') === '0 0 1600 900', v.box.innerHTML.slice(0, 200));
  check('...with the cast in it (the village has people)', /<svg[^>]*aria-label="[^"]*"/.test(v.box.innerHTML) && v.box.innerHTML.length > 5000);
  check('the cat\'s pictures come from this site\'s design assets', ASSET_BASE === '/design-assets/' && (!/nimrod-cat/.test(v.box.innerHTML) || /\/design-assets\/nimrod-cat\//.test(v.box.innerHTML)));
  const before = v.box.innerHTML;
  st.set({ look: 'toon' });
  check('*** changing the look draws it again, in that look ***', v.q('[data-village]').dataset.look === 'toon' && v.box.innerHTML !== before);
  st.set({ time: 'night' });
  check('night: drawn at night', v.q('[data-village]').dataset.time === 'night');
  check('a fixed time needs no clock watching', v.timers.pending() === 0);
  st.set({ time: 'auto' });
  check('*** following the clock: it looks again every five minutes, and only redraws when the light changed ***', v.timers.pending() === 1 && v.timers.last().ms === LIGHT_CHECK_MS);
  const same = v.box.innerHTML;
  v.timers.fire();
  check('...an hour with the same light is not redrawn (nothing for the Pi to do)', v.box.innerHTML === same && v.timers.pending() === 1);
  v.done();
  check('taken down: nothing left counting', v.timers.pending() === 0);
  check('names nobody', !/cici|her screen/i.test(JSON.stringify(SETTINGS) + getManifest(TYPE).description));

  section('editing, pure: the same rows as a room piece');
  const base = { label: 'Test', pieces: [{ cast: 'jess', x: 400, y: 800, scale: 0.62 }, { piece: 'cloud', x: 300, y: 200 }] };
  check('*** a piece\'s rows: left or right, nearer or further, size, rotation, facing (room_edits.js\'s names) ***',
    J(pieceFields().map((f) => f.key)) === J(['x', 'y', 'size', 'rotate', 'facing']) && pieceFields().find((f) => f.key === 'rotate').step === TURN_STEP
    && pieceFields().find((f) => f.key === 'x').step === MOVE_STEP);
  check('what they show: Jess at 400, 800, size 0.62, not turned', J(pieceValues(base.pieces[0])) === J({ x: 400, y: 800, size: 0.62, rotate: 0, facing: 'drawn' }));
  const e1 = withPieceEdit(base, 0, { x: 2000, y: -5, size: 9, rotate: 190, facing: 'turned' });
  check('*** kept on the stage: x to 1600, y to 0, size to 4, a turn of 190 is -170, turned round ***',
    e1.pieces[0].x === STAGE.w && e1.pieces[0].y === 0 && e1.pieces[0].scale === SIZE_RANGE[1] && e1.pieces[0].rot === -170 && e1.pieces[0].flip === true, J(e1.pieces[0]));
  const e2 = withPieceEdit(e1, 0, { rotate: 0, facing: 'drawn' });
  check('no turn and as drawn: the fields are gone, not zero (the format stays Design\'s)', !('rot' in e2.pieces[0]) && !('flip' in e2.pieces[0]));
  check('the original is never changed', J(base.pieces[0]) === J({ cast: 'jess', x: 400, y: 800, scale: 0.62 }) && withPieceEdit(base, 9, { x: 1 }) === null);
  check('take one out; copy one (a step to the right)', withoutPiece(base, 1).pieces.length === 1
    && withCopy(base, 0).recipe.pieces.length === 3 && withCopy(base, 0).recipe.pieces[2].x === 460 && withCopy(base, 0).index === 2);
  const add1 = withNewPiece(base, 'cast:merlin'), add2 = withNewPiece(base, 'piece:cloud'), add3 = withNewPiece(base, 'piece:nope');
  check('*** add a person or a piece: in the middle; a sky piece in the sky; an unknown one is refused with words ***',
    add1.recipe.pieces[2].cast === 'merlin' && add1.recipe.pieces[2].x === 800 && add2.recipe.pieces[2].y < 450 && add3.recipe === null && !!add3.why);
  check('"Add a piece or a person" lists Design\'s pieces by group, then the people', addOptions().some((o) => o.value === 'cast:jess' && /Princess Jess/.test(o.label))
    && addOptions().some((o) => o.value.startsWith('piece:')) && addOptions()[0].value === '');
  check('a full scene takes no more', withNewPiece({ pieces: Array.from({ length: PIECES_MAX }, () => ({ cast: 'jess', x: 1, y: 1 })) }, 'cast:jess').recipe === null);
  const ct = { piece: 'countTable', x: 800, y: 700 };
  check('*** a lesson piece has its own settings too: a counting table\'s thing, how many, and what it sits on ***',
    J(pieceFields(ct).map((f) => f.key)) === J(['x', 'y', 'size', 'rotate', 'facing', 'object', 'count', 'holder'])
    && pieceValues(ct).object === 'loaf' && pieceValues(ct).count === 5 && pieceValues(ct).holder === 'table');
  const ct2 = withPieceEdit({ pieces: [ct] }, 0, { object: 'duck', count: 14, holder: 'basket' }).pieces[0];
  check('...changed inside what Design draws: ducks, at most ten, in a basket; a thing not on the list is ignored',
    ct2.object === 'duck' && ct2.count === 10 && ct2.holder === 'basket' && withPieceEdit({ pieces: [ct2] }, 0, { object: 'tiger' }).pieces[0].object === 'duck');
  const sg = withPieceEdit({ pieces: [{ piece: 'letterSign', x: 1, y: 1 }] }, 0, { text: 'big dog house' }).pieces[0];
  check('a signboard\'s letters: capitals, a space is a gap (_), eight at most', sg.text === 'BIG_DOG_' && pieceFields(sg).some((f) => f.key === 'text' && f.maxLength === 8), sg.text);
  check('the wall\'s rows, the candles and the scale\'s tilt, each in Design\'s range',
    withPieceEdit({ pieces: [{ piece: 'wallBuild', x: 1, y: 1 }] }, 0, { rows: 9 }).pieces[0].rows === 6
    && withPieceEdit({ pieces: [{ piece: 'candleStand', x: 1, y: 1 }] }, 0, { count: 0 }).pieces[0].count === 1
    && withPieceEdit({ pieces: [{ piece: 'marketScale', x: 1, y: 1 }] }, 0, { tilt: '-1' }).pieces[0].tilt === -1
    && COUNT_THINGS.every((o) => objectNames.includes(o)), J(COUNT_THINGS.filter((o) => !objectNames.includes(o))));
  check('the panel keeps pieces and label, not look/time/frame (those are its settings)', J(Object.keys(ownRecipe({ ...base, look: 'toon', time: 'night', frame: false })).sort()) === J(['label', 'pieces']));

  section('*** editing on a panel: edit mode\'s targets, saved as the panel\'s own scene ***');
  const st2 = fakeRow({ time: 'day', scene: 'village' });
  const clip = { text: '', writeText: async (t) => { clip.text = t; } };
  const w = mount(st2, { clipboard: clip });
  let targets = w.inst.impl.editTargets();
  const pieceTs = targets.filter((t) => t.id.startsWith('piece-'));
  const drawnPieces = VILLAGE_SCENES.village.recipe.pieces.filter((it) => (it.piece ? PIECES[it.piece] : true)).length;
  check(`*** every piece and person is a target (${pieceTs.length}), then the scene itself, last and whole ***`,
    pieceTs.length === drawnPieces && targets[targets.length - 1].id === 'scene' && targets[targets.length - 1].whole === true, `${pieceTs.length} of ${drawnPieces}`);
  const jessI = VILLAGE_SCENES.village.recipe.pieces.findIndex((it) => it.cast);
  const tJ = targets.find((t) => t.id === `piece-${jessI}`);
  check('a person is named: the target\'s label is the cast name', !!tJ && tJ.label === pieceName(VILLAGE_SCENES.village.recipe.pieces[jessI]), tJ && tJ.label);
  check('*** each piece carries the room\'s handles, on the SVG stage, around the group that carries its turn ***',
    tJ.handles && tJ.handles.geometry === 'svg' && tJ.handles.el === tJ.el.parentNode && typeof tJ.handles.onCommit === 'function');
  check('Design\'s grab cursor and its own handles are not drawn (the room\'s are the editor)', !/cursor:grab/.test(w.box.innerHTML) && !w.box.querySelector('[data-h]'));
  const x0 = pieceValues(VILLAGE_SCENES.village.recipe.pieces[jessI]).x;
  tJ.set({ x: x0 + 100 });
  check('*** a row changed: the scene is now the panel\'s own, saved, and drawn moved ***', Array.isArray(st2.get().recipe?.pieces)
    && st2.get().recipe.pieces[jessI].x === x0 + 100 && w.probe().recipe.pieces[jessI].x === x0 + 100 && !('look' in st2.get().recipe));
  check('...Design\'s scene is untouched', VILLAGE_SCENES.village.recipe.pieces[jessI].x === x0);
  targets = w.inst.impl.editTargets();
  targets.find((t) => t.id === `piece-${jessI}`).handles.onCommit({ rotate: 30 });
  check('a handle\'s commit is the same change (a turn of 30)', st2.get().recipe.pieces[jessI].rot === 30 && w.probe().undo === 2);
  w.inst.impl.__edit.undoOnce();
  check('*** Undo steps back one change ***', !('rot' in st2.get().recipe.pieces[jessI]) && st2.get().recipe.pieces[jessI].x === x0 + 100);
  const sceneT = w.inst.impl.editTargets().find((t) => t.id === 'scene');
  sceneT.set({ addPiece: 'cast:vince' });
  check('*** the scene: add a person (Prince Vince), said in words ***', st2.get().recipe.pieces.some((it) => it.cast === 'vince')
    && /Prince Vince/.test(w.q('[data-vg-said]').textContent));
  await sceneT.actions.find((a) => a.id === 'default').run();
  await new Promise((r) => setTimeout(r, 0));
  let entry = null; try { entry = JSON.parse(clip.text); } catch { entry = null; }
  check('*** "Copy as the default": the defaults file\'s shape, under village / this scene ***', entry?.format === 'nimrod-defaults'
    && Array.isArray(entry?.village?.village?.pieces) && entry.village.village.pieces.some((it) => it.cast === 'vince'), clip.text.slice(0, 160));
  sceneT.actions.find((a) => a.id === 'putBack').run();
  check('*** "Put the scene back": as it comes, Design\'s (or the designer\'s) ***', !st2.get().recipe && J(w.probe().recipe.pieces) === J(VILLAGE_SCENES.village.recipe.pieces));
  sceneT.set({ look: 'toon' });
  check('the scene\'s settings are on it too (the look)', st2.get().look === 'toon' && w.q('[data-village]').dataset.look === 'toon');

  section('*** the handles themselves, on the SVG stage (room_handles.js svgGeometry) ***');
  // A building, not a person: Design's people breathe and sway (CSS), so a figure's box moves between two measurements.
  const bI = VILLAGE_SCENES.village.recipe.pieces.findIndex((it) => it.piece && PIECES[it.piece]?.group === 'Village');
  const tH = w.inst.impl.editTargets().find((t) => t.id === `piece-${bI}`);
  const commits = [];
  const hd = attachHandles({ el: tH.handles.el, host: w.box, piece: tH.handles.piece, geometry: svgGeometry, onCommit: (p) => commits.push(p) });
  const boxEl = hd.el.querySelector('.emh-box');
  const r0b = boxEl.getBoundingClientRect();
  const ctm = w.q('svg').getScreenCTM();
  const fire = (target, type, x, y) => target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1 }));
  const cx = r0b.left + r0b.width / 2, cy = r0b.top + r0b.height / 2;
  fire(boxEl, 'pointerdown', cx, cy); fire(boxEl, 'pointermove', cx + 40, cy); fire(boxEl, 'pointerup', cx + 40, cy);
  const wantDx = 40 / ctm.a;
  check(`*** dragging the body 40px moves it ${wantDx.toFixed(1)} stage units across, nothing down (one commit) ***`,
    commits.length === 1 && Math.abs(commits[0].x - (tH.handles.piece.x + wantDx)) < 0.2 && Math.abs(commits[0].y - tH.handles.piece.y) < 0.2, J(commits));
  check('...previewed by a transform in front of the piece\'s own, nothing saved by the handles themselves',
    (tH.handles.el.getAttribute('transform') || '').startsWith('translate(') && !st2.get().recipe);
  hd.destroy();
  const hd2 = attachHandles({ el: tH.handles.el, host: w.box, piece: tH.handles.piece, geometry: svgGeometry, onCommit: (p) => commits.push(p) });
  const knob = hd2.el.querySelector('.emh-rot');
  const kr = knob.getBoundingClientRect(), kx = kr.left + kr.width / 2, ky = kr.top + kr.height / 2;
  const br = hd2.el.getBoundingClientRect(), bcx = br.left + br.width / 2, bcy = br.top + br.height / 2;
  const pr = tH.handles.el.getBoundingClientRect();
  // Pressed BEFORE the next check line is written: each line goes above the panel and moves it down the page.
  fire(knob, 'pointerdown', kx, ky); fire(knob, 'pointermove', bcx + (bcy - ky), bcy); fire(knob, 'pointerup', bcx + (bcy - ky), bcy);
  check('the outline sits exactly on the piece (inside the panel\'s border), and the round handle is centred over it',
    Math.abs(br.left - pr.left) < 0.6 && Math.abs(br.top - pr.top) < 0.6 && Math.abs(kx - bcx) < 0.6, J({ outline: [br.left, br.top], piece: [pr.left, pr.top], knob: kx, mid: bcx }));
  check('*** the round handle turned a quarter: a rotation of 90 ***', commits.length === 2 && Math.abs(commits[1].rotate - 90) <= 2, J(commits));
  hd2.destroy();
  check('the handles are gone when taken down', !w.box.querySelector('.em-handles'));

  section('edit mode hands the chosen piece\'s handles to the dashboard');
  const rec = { id: 'vp', type: TYPE, instance: w.inst, el: w.box, state: st2 };
  const em = createEditMode({ bus: createBus(), doc: document, recs: () => [rec], boxOf: () => w.box });
  em.enter('vp');
  em.select(`piece-${jessI}`);
  check('*** chosenTarget() is the piece, with its handles ***', em.chosenTarget()?.id === `piece-${jessI}` && em.chosenTarget()?.handles?.geometry === 'svg');
  em.select(null);
  check('the scene chosen: no handles (it is the whole panel)', em.chosenTarget()?.id === 'scene' && !em.chosenTarget()?.handles);
  em.destroy();
  w.done();
} catch (err) {
  check('the suite ran to the end', false, String(err && err.stack || err));
}
document.getElementById('summary').textContent = failed ? `${failed} FAILED / ${passed} passed` : `ALL PASS - ${passed} checks`;
</script>
</body>
</html>
