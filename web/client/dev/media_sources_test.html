<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>media_sources — resolver integration test</title>
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .skip{color:#b8860b}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  img{max-width:80px;border:1px solid #ccc;margin-top:8px;display:block}
</style>
</head>
<body>
<h1>media_sources — resolver integration test</h1>
<p>Runs against the live platform server (same origin) + a live media agent.
Agent URL from <code>?agent=</code> (default <code>http://127.0.0.1:8770</code>).</p>
<div id="results"></div>
<div id="summary">running…</div>
<img id="proof" alt="" hidden>

<script type="module">
import { createMediaSourcesClient, resolveListing, sourceHealth, mediaUrl }
  from '../media_sources.js';
import { kindOf, IMAGE_EXTS, VIDEO_EXTS, AUDIO_EXTS } from '../folder_source.js';
import { slideshowItems } from '../modules/photos.js';
import { isAudioPath } from '../game_music.js';

const params = new URLSearchParams(location.search);
const AGENT = (params.get('agent') || 'http://127.0.0.1:8770').replace(/\/+$/, '');
const USER = params.get('user') || 'test-media-user';
const out = document.getElementById('results');
let passed = 0, failed = 0, skipped = 0;

// *** A SUITE THAT CANNOT RUN MUST NOT REPORT RED. ***
//
// Everything below the registry section drives a REAL media agent on 8770 -- health, listing,
// CORS, bytes. With no agent running those are not failures, they are assertions about a thing
// that is not there, and `run_all.html` already says what that costs: *"folded into failures it
// is the noise that trains everybody to read red as normal."* `media_stall` and `personal`
// preflight for exactly this reason; these two had been missed.
//
// Found when the app server died mid-session and every suite went amber at once. These two came
// back red rather than skipped, which is a second wrong signal on top of the first.
function skip(name, why) {
  skipped++;
  const d = document.createElement('div');
  d.className = 'skip';
  d.textContent = `NOT RUN  ${name}   ${why}`;
  out.append(d);
}
async function agentUp(base) {
  try {
    const r = await fetch(`${base}/health`, { signal: AbortSignal.timeout(2500) });
    return r.ok;
  } catch { return false; }
}

function check(name, cond, detail = '') {
  const ok = !!cond;
  ok ? passed++ : failed++;
  const line = document.createElement('div');
  line.className = ok ? 'pass' : 'fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(line);
}

async function loadsAsImage(url) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(im.naturalWidth > 0);
    im.onerror = () => resolve(false);
    im.src = url;
  });
}

(async () => {
  // *** WHAT KIND A FILE IS - PURE, SO IT RUNS BEFORE ANYTHING THAT NEEDS A SERVER. ***
  //
  // 2026-09-30: a music folder listed as EMPTY, because this lister and the media agent only knew
  // images and videos. `dev/media_kinds.json` is ONE table; `media_agent/test_agent.py` checks the
  // agent's `kind_of` against the same rows, so the two listers cannot drift apart silently.
  {
    let table = null;
    try { table = await (await fetch('./media_kinds.json', { cache: 'no-store' })).json(); }
    catch (e) { check('media_kinds.json loads', false, String(e)); }
    if (table) {
      const wrong = table.cases.filter(([name, want]) => kindOf(name) !== want)
        .map(([name, want]) => `${name}: want ${want}, got ${kindOf(name)}`);
      check(`*** folder_source kindOf agrees with every row of media_kinds.json (${table.cases.length}) ***`,
        wrong.length === 0, wrong.join('; '));
      const listed = new Set(table.cases.filter(([, k]) => k).map(([n]) => n.toLowerCase().split('.').pop()));
      const unlisted = [...IMAGE_EXTS, ...VIDEO_EXTS, ...AUDIO_EXTS].filter((e) => !listed.has(e));
      check('every extension kindOf knows has a row in the table', unlisted.length === 0, unlisted.join(','));
    }
    check('an .mp3 is audio, and audio is neither an image nor a video',
      kindOf('a.mp3') === 'audio' && !IMAGE_EXTS.includes('mp3') && !VIDEO_EXTS.includes('mp3'));
    check('no extension is in two kinds at once',
      new Set([...IMAGE_EXTS, ...VIDEO_EXTS, ...AUDIO_EXTS]).size
        === IMAGE_EXTS.length + VIDEO_EXTS.length + AUDIO_EXTS.length);
    // The music players pick tracks by extension (game_music's `isAudioPath`), so every file
    // the listers call audio must be one they will actually take.
    check('every audio extension the lister knows is one the music players will play',
      AUDIO_EXTS.every((e) => isAudioPath(`x.${e}`)), AUDIO_EXTS.filter((e) => !isAudioPath(`x.${e}`)).join(','));

    // A MIXED LISTING THROUGH THE SLIDESHOW'S FILTER: the same items a folder or agent now returns.
    const mixed = ['a.jpg', 'b.mp4', 'c.mp3', 'd.flac', 'e.PNG', 'f.m4a']
      .map((n) => ({ id: n, path: n, name: n, kind: kindOf(n), url: `u:${n}` }));
    mixed.push({ id: 'g', path: 'g.xyz', name: 'g', kind: 'document', url: 'u:g' }, { id: 'h', path: 'h', name: 'h', url: 'u:h' });
    const shown = slideshowItems(mixed).map((it) => it.path);
    check('*** the photo slideshow takes only the images and videos out of a mixed listing ***',
      shown.join() === 'a.jpg,b.mp4,e.PNG', shown.join());
  }

  // *** backup source (2026-10-08): ONE HELPER FOR THE FOUR PANELS - PURE, SO IT RUNS WITH NO AGENT. ***
  // Mike: "We should make backup folder options for everything, so people could always have a local fallback."
  {
    const M = await import('../media_sources.js');
    const S = {
      main:   { id: 'main',   label: 'The drive',    kind: 'agent', base_url: 'http://192.168.1.9:8770', person_id: null },
      sd:     { id: 'sd',     label: 'SD card',      kind: 'folder' },
      here:   { id: 'here',   label: 'This computer', kind: 'agent', base_url: 'http://127.0.0.1:8770', person_id: 'p1' },
      family: { id: 'family', label: 'Family',       kind: 'agent', base_url: 'https://family.example', person_id: null },
      next:   { id: 'next',   label: 'Next door',    kind: 'agent', base_url: 'http://127.0.0.1:8771', person_id: 'p2' },
    };
    const all = Object.values(S);
    const ids = (l) => l.map((s) => s.id).join();
    // Which backup is in force.
    check('backup: the panel\'s own choice wins, else the screen\'s, else the panel\'s default',
      M.backupChoice({ panel: 'sd', screen: 'family', panelDefault: M.BACKUP_ANY }) === 'sd'
        && M.backupChoice({ panel: '', screen: 'family', panelDefault: M.BACKUP_ANY }) === 'family'
        && M.backupChoice({ panel: '', screen: '', panelDefault: M.BACKUP_ANY }) === M.BACKUP_ANY
        && M.backupChoice({ panel: '', screen: '', panelDefault: M.BACKUP_NONE }) === M.BACKUP_NONE);
    check('*** nothing set anywhere: Photos and videos keep their stand-in, Music and Wallpaper have none (unchanged) ***',
      M.backupChoice({ panelDefault: M.BACKUP_ANY }) === 'any' && M.backupChoice({}) === 'none');
    check('a panel can say "nothing" even when the screen has a backup',
      M.backupChoice({ panel: M.BACKUP_NONE, screen: 'sd', panelDefault: M.BACKUP_ANY }) === 'none');
    // Which sources are tried.
    check('backup "any": the same stand-ins as before (own, then the account\'s, never next door\'s)',
      ids(M.backupSources(all, { choice: 'any', chosenId: 'main', personId: 'p1' })) === 'here,sd,family',
      ids(M.backupSources(all, { choice: 'any', chosenId: 'main', personId: 'p1' })));
    check('backup "none": nothing is tried', M.backupSources(all, { choice: 'none', chosenId: 'main', personId: 'p1' }).length === 0);
    check('*** a chosen backup: that one only (it replaces the automatic stand-in) ***',
      ids(M.backupSources(all, { choice: 'sd', chosenId: 'main', personId: 'p1' })) === 'sd');
    check('*** a chosen backup that is another resident\'s is never tried, whatever the row says ***',
      M.backupSources(all, { choice: 'next', chosenId: 'main', personId: 'p1' }).length === 0
        && M.backupSources(all, { choice: 'here', chosenId: 'main', personId: null }).length === 0);
    check('the main source is not its own backup, and a backup not connected here is nothing',
      M.backupSources(all, { choice: 'main', chosenId: 'main' }).length === 0 && M.backupSources(all, { choice: 'gone' }).length === 0);
    // The words.
    check('*** the quiet line: "Showing the backup: <name> — <main> can\'t be reached." ***',
      M.degradedLine({ shownLabel: 'SD card', chosenLabel: 'The drive', backup: true }) === 'Showing the backup: “SD card” — “The drive” can’t be reached.',
      M.degradedLine({ shownLabel: 'SD card', chosenLabel: 'The drive', backup: true }));
    check('...music says "Playing", and a song that would not play says so',
      M.degradedLine({ shownLabel: 'SD card', chosenLabel: 'The drive', backup: true, verb: 'Playing', err: { code: 'unplayable' } })
        === 'Playing the backup: “SD card” — “The drive” wouldn’t play.');
    check('...the automatic stand-in keeps its old words', M.degradedLine({ shownLabel: 'Family', chosenLabel: 'The drive' })
      === 'Showing “Family” — “The drive” can’t be reached.');
    // The rows.
    const pf = M.backupPanelField({ panelDefault: M.BACKUP_ANY });
    check('the panel row: "If this can\'t be reached, use", at Everything, defaulting to the screen\'s',
      pf.key === 'backupSource' && pf.level === 'advanced' && pf.default === '' && pf.options.map((o) => o.value).join() === ',any,none', JSON.stringify(pf));
    const pc = M.backupPanelChoices({ sources: all, mainId: 'main', current: 'gone', screen: 'sd', panelDefault: M.BACKUP_ANY, personId: 'p1', showing: 'SD card' });
    const pv = pc.options.map((o) => o.value);
    check('*** its choices: "as This screen says (<what that is>)", what is ON THIS COMPUTER first, then the rest ***',
      pv.join() === ',sd,here,family,any,none,gone' && /As This screen says \(“SD card”\)/.test(pc.options[0].label)
        && /on this computer/.test(pc.options[1].label) && !/on this computer/.test(pc.options[3].label), JSON.stringify(pc.options));
    check('...never the main source, never next door\'s; a choice not here stays, last, saying so',
      !pv.includes('main') && !pv.includes('next') && /not connected here/.test(pc.options.at(-1).label));
    check('...and while the backup shows, the line after the value says so', /Showing the backup now: “SD card”/.test(pc.status), pc.status);
    const sf = M.backupScreenField({ sources: all, personId: 'p1' });
    check('the screen row: "Backup folder for this screen", at The usual, not set by default',
      sf.key === 'backupSource' && sf.label === 'Backup folder for this screen' && sf.level === 'standard' && sf.default === ''
        && sf.options[0].value === '' && sf.options.at(-2).value === 'any' && sf.options.at(-1).value === 'none', JSON.stringify(sf.options));
    check('*** site words: never "her screen", never a name ***',
      !/her screen|christine|cici/i.test(JSON.stringify([pf, pc, sf])));
    // What the screen row can offer: what the panels here listed, for this person, never another resident's.
    M.forgetListedForTest();
    M.noteListed('p1', [S.here, S.next, S.family]);
    M.noteListed('', [S.here, S.next, S.family, S.sd]);
    check('listed sources: the person\'s own list, and never another resident\'s source in it',
      ids(M.listedSources('p1')) === 'here,family', ids(M.listedSources('p1')));
    check('...whose screen unknown: the account\'s list, with no resident\'s source at all',
      ids(M.listedSources(null)) === 'family,sd', ids(M.listedSources(null)));
    M.forgetListedForTest();
    // Asking after the main source.
    const timers = [];
    const setTimer = (fn, ms) => { const t = { fn, ms, live: true }; timers.push(t); return t; };
    const clearTimer = (t) => { if (t) t.live = false; };
    let up = false, backs = 0;
    const rc = M.createSourceRecheck({ ms: () => 777, setTimer, clearTimer, isBack: async () => up, onBack: () => { backs += 1; } });
    rc.arm();
    const fire = async () => { const t = timers.filter((x) => x.live).pop(); if (t) { t.live = false; t.fn(); } await new Promise((r) => setTimeout(r, 0)); };
    check('the recheck waits SOURCE_RECHECK_MS (the seam here: 777)', rc.armed() && timers.at(-1).ms === 777);
    await fire();
    check('still down: it asks again later, and does not go back', backs === 0 && rc.armed());
    up = true;
    await fire();
    check('*** back: it goes back once, and stops asking ***', backs === 1 && !rc.armed());
    rc.arm(); rc.stop();
    check('stopped: nothing left running', !rc.armed() && timers.every((t) => !t.live));
    // listOrFallback with a chosen backup, and with none.
    const resolve = async (s) => { if (s.id === 'main') throw new Error('down'); return { items: [{ id: `${s.id}.jpg`, kind: 'image' }] }; };
    const got = await M.listOrFallback({ sources: all, chosen: S.main, album: '', personId: 'p1', resolve, backup: 'family', waitMs: 0 });
    check('*** main down, a chosen backup: that backup, marked as the chosen one ***',
      got.source?.id === 'family' && got.fellBack && got.byChoice === true, JSON.stringify({ id: got.source?.id, by: got.byChoice }));
    const none = await M.listOrFallback({ sources: all, chosen: S.main, album: '', personId: 'p1', resolve, backup: 'none', waitMs: 0 });
    check('main down, backup "nothing": nothing, and the failure kept for the words', !none.source && !!none.failure);
    const auto = await M.listOrFallback({ sources: all, chosen: S.main, album: '', personId: 'p1', resolve, waitMs: 0 });
    check('no backup given (every older caller): the stand-in as before, not marked chosen',
      auto.source?.id === 'here' && auto.byChoice === false, auto.source?.id);
  }

  // *** folder art (2026-10-07): AN SVG FROM A FOLDER IS LISTED, AND NOTHING IN IT RUNS IN THIS SITE. ***
  // The security invariant over folder_source.js IMAGE_EXTS. A drawing that tries everything - an onload, a <script>,
  // a picture from elsewhere - is listed, shown as a picture (nothing runs, nothing loads), and even opened as a page
  // of its own (the worst case: somebody opens it in a tab) it has no site, so it cannot reach this page.
  try {
    const tag = `svgprobe${Date.now().toString(36)}`;
    const probe = (why) => `${location.origin}/${tag}-${why}.png`;
    const hostile = (why) => `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" `
      + `onload="try{parent.__svgRan='onload ${why}'}catch(e){}">`
      + `<script>try{parent.__svgRan='script ${why}'}catch(e){};try{fetch('${probe(why)}-fetch')}catch(e){}<\/script>`
      + `<image href="${probe(why)}" width="10" height="10"/><rect width="10" height="10" fill="red"/></svg>`;
    const tree = { 'evil.svg': hostile('img'), 'plain.txt': 'x' };
    const fake = (t) => ({
      kind: 'directory', name: 'Wallpapers',
      async getDirectoryHandle() { throw new DOMException('none', 'NotFoundError'); },
      async getFileHandle(n) {
        if (!(n in t)) throw new DOMException('none', 'NotFoundError');
        return { kind: 'file', name: n, getFile: async () => new File([t[n]], n, { type: n.endsWith('.svg') ? 'image/svg+xml' : 'text/plain' }) };
      },
      async *entries() { for (const n of Object.keys(t)) yield [n, await this.getFileHandle(n)]; },
    });
    const { entriesIn, fileUrlIn, isSvgFile } = await import('../folder_source.js');
    const listed = (await entriesIn(fake(tree))).items;
    check('folder art: an .svg in a folder is listed as a picture', listed.length === 1 && listed[0].name === 'evil.svg' && listed[0].kind === 'image', JSON.stringify(listed));
    const got = await fileUrlIn(fake(tree), 'evil.svg');
    check('*** folder art: a folder\'s SVG is handed out as a data: URL, never a blob: one (no site of its own) ***',
      /^data:image\/svg\+xml/.test(got.url), got.url.slice(0, 40));
    check('folder art: isSvgFile knows one by name or by type', isSvgFile({ name: 'A.SVG' }) && isSvgFile({ name: 'x', type: 'image/svg+xml' }) && !isSvgFile({ name: 'a.png', type: 'image/png' }));

    delete window.__svgRan;
    const im = new Image();
    document.body.append(im);
    const shownOk = await new Promise((res) => { im.onload = () => res(im.naturalWidth > 0); im.onerror = () => res(false); im.src = got.url; });
    await new Promise((r) => setTimeout(r, 300));
    const fetchedNames = () => performance.getEntriesByType('resource').map((e) => e.name).filter((n) => n.includes(tag));
    check('folder art: ...it shows as a picture', shownOk);
    check('*** folder art: as a picture its onload and its <script> never run ***', window.__svgRan === undefined, String(window.__svgRan));
    check('*** folder art: ...and its picture from elsewhere is never fetched ***', fetchedNames().length === 0, fetchedNames().join(' '));
    im.remove();

    // The worst case: the same kind of URL opened as a page (an <iframe> here; a tab is the same document). A CONTROL
    // first, so a pass below means something: the same drawing as a blob: URL DOES reach this page.
    const frameOf = (url) => new Promise((res) => {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:20px;height:20px;border:0';
      f.onload = () => setTimeout(() => res(f), 300);
      f.src = url;
      document.body.append(f);
    });
    const ctrlUrl = URL.createObjectURL(new Blob([hostile('control')], { type: 'image/svg+xml' }));
    const ctrl = await frameOf(ctrlUrl);
    check('folder art (the control): the same drawing as a blob: URL, opened as a page, DOES run in this site',
      /control/.test(String(window.__svgRan)), String(window.__svgRan));
    ctrl.remove(); URL.revokeObjectURL(ctrlUrl);
    delete window.__svgRan;
    const asPage = await fileUrlIn(fake({ 'evil.svg': hostile('page') }), 'evil.svg');
    const frame = await frameOf(asPage.url);
    let reach = 'none';
    try { reach = frame.contentDocument ? 'this site' : 'none'; } catch { reach = 'none'; }
    check('*** folder art: the data: URL opened as a page cannot reach this site - not by script, not by onload ***',
      window.__svgRan === undefined && reach === 'none', `ran=${window.__svgRan} reach=${reach}`);
    frame.remove();

    // A picture added from this device (device_pictures.js) is handed out the same way.
    const { addDevicePicture, devicePictureUrl } = await import('../device_pictures.js');
    const dbName = `nimrod-pictures-svgtest-${tag}`;
    const ref = await addDevicePicture(new File([hostile('device')], 'evil.svg', { type: 'image/svg+xml' }), { dbName });
    const dev = await devicePictureUrl(ref.path, { dbName });
    check('*** folder art: an SVG added from this device is a data: URL too ***', /^data:image\/svg\+xml/.test(dev.url), dev.url.slice(0, 40));
    try { indexedDB.deleteDatabase(dbName); } catch { /* left for the browser */ }

    // And the inline route (an animated avatar) keeps nothing of it but the shape.
    const { sanitizeSvg, svgMarkup } = await import('../svg_sanitize.js');
    const clean = sanitizeSvg(hostile('inline'));
    const markup = clean.ok ? svgMarkup(clean, { uid: 'svgt' }) : '';
    check('*** folder art: drawn inline through svg_sanitize.js, no script, no handler and no outside address survive ***',
      !/script|onload|href|svgprobe|parent/i.test(markup), markup.slice(0, 200));
  } catch (e) { check('folder art: the hostile SVG checks threw', false, String((e && e.stack) || e)); }

  // *** PHOTO SOURCES FIRST (2026-10-09): THE PICTURES ADDED ON THIS DEVICE, AS A PHOTO SOURCE ONLY WHEN ASKED. ***
  // device_pictures.js argues why it is a switch and not "whenever there are pictures here": a picture added for a
  // button must not put a second source on a screen whose photos panel adopted its one folder.
  try {
    const DP = await import('../device_pictures.js');
    const mem = (() => { const m = new Map(); return { getItem: (k) => (m.has(k) ? m.get(k) : null),
      setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; })();
    check('photo sources first: off until somebody adds pictures for photos', DP.devicePhotosOn({ storage: mem }) === false);
    DP.setDevicePhotosOn(true, { storage: mem });
    check('...on after the press that adds them', DP.devicePhotosOn({ storage: mem }) === true);
    DP.setDevicePhotosOn(false, { storage: mem });
    check('...and off again', DP.devicePhotosOn({ storage: mem }) === false);

    let on = false;
    const devClient = createMediaSourcesClient({ user: USER, devicePhotos: () => on, setDevicePhotos: (v) => { on = !!v; } });
    const off = await devClient.list();
    check('*** photo sources first: switched off, the device’s pictures are NOT in the list a photos panel reads ***',
      !off.some((s) => s.id === DP.DEVICE_SOURCE_ID), JSON.stringify(off.map((s) => s.id)));
    on = true;
    const withDev = await devClient.list();
    check('*** switched on, they are, LAST, as kind "device" ***',
      withDev.length && withDev[withDev.length - 1].id === DP.DEVICE_SOURCE_ID && withDev[withDev.length - 1].kind === 'device',
      JSON.stringify(withDev.map((s) => s.id)));
    await devClient.remove(DP.DEVICE_SOURCE_ID);
    check('Disconnect turns the switch off (the pictures themselves stay)', on === false);

    const tag = Math.random().toString(36).slice(2, 8);
    const dbName = `nimrod-pictures-photostest-${tag}`;
    const png = await (await fetch('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')).blob();
    const { added, skipped: skippedFiles } = await DP.addDevicePictures([
      new File([png], 'a.png', { type: 'image/png' }), new File(['x'], 'notes.txt', { type: 'text/plain' }),
      new File([png], 'b.png', { type: 'image/png' })], { dbName, now: () => 1000 });
    check('addDevicePictures keeps the pictures and skips what is not one', added.length === 2 && skippedFiles === 1,
      JSON.stringify({ added: added.length, skippedFiles }));
    check('...two pictures added in the same moment get different paths', added[0].path !== added[1].path);
    const listing = await DP.resolveDeviceListing(DP.DEVICE_SOURCE, '', { dbName });
    check('*** a listing in the shape every source gives: items with a url, the source id, kind image ***',
      listing.count === 2 && listing.items.every((it) => it.url && it.sourceId === DP.DEVICE_SOURCE_ID && it.kind === 'image'
        && it.id === it.path) && Array.isArray(listing.albums), JSON.stringify(listing.items.map((i) => i.name)));
    check('...and the picture actually draws', await loadsAsImage(listing.items[0].url));
    check('...which the slideshow takes (photos.js slideshowItems)', slideshowItems(listing.items).length === 2);
    const viaResolver = await resolveListing(DP.DEVICE_SOURCE);
    check('resolveListing hands a device source to that listing (no fetch to any agent)',
      Array.isArray(viaResolver.items) && viaResolver.albums.length === 0);
    try { indexedDB.deleteDatabase(dbName); } catch { /* left for the browser */ }
  } catch (e) { check('photo sources first: the device-pictures checks threw', false, String((e && e.stack) || e)); }

  const client = createMediaSourcesClient({ user: USER });
  try {
    // Clean slate: remove any leftover TEST- sources from a prior run.
    for (const s of await client.list()) {
      if (s.label.startsWith('TEST-')) await client.remove(s.id);
    }
    check('registry starts clean for this user',
      (await client.list()).filter((s) => s.label.startsWith('TEST-')).length === 0);

    // mediaUrl builds correctly (pure — no network).
    check('mediaUrl encodes segments, keeps slashes',
      mediaUrl('http://h:8770/', 'trip 19/a b.jpg') === 'http://h:8770/files/trip%2019/a%20b.jpg',
      mediaUrl('http://h:8770/', 'trip 19/a b.jpg'));

    // Add a source pointing at the running agent.
    const created = await client.add({ label: 'TEST-agent', base_url: AGENT, kind: 'agent' });
    check('add returns id + normalized base_url', !!created.id && created.base_url === AGENT, JSON.stringify(created));

    const sources = await client.list();
    const source = sources.find((s) => s.id === created.id);
    check('source appears in the per-user registry', !!source);

    // Invalid base_url is rejected by the server (defense-in-depth).
    let rejected = false;
    try { await client.add({ label: 'TEST-bad', base_url: 'javascript:alert(1)', kind: 'agent' }); }
    catch { rejected = true; }
    check('server rejects a non-http base_url', rejected);

    if (!(await agentUp(AGENT))) {
      skip('everything that needs a media agent', `no agent answering at ${AGENT}`);
      throw { __skipped: true };
    }

    // Health probe (cross-origin GET to the agent).
    const health = await sourceHealth(source);
    check('sourceHealth reports ok (cross-origin /health)', health.ok === true, JSON.stringify(health));

    // Resolve the listing — the core of the slice.
    const { items, albums } = await resolveListing(source);
    check('resolveListing returns items', items.length > 0, `count=${items.length}`);
    check('every item has an absolute url under the agent /files',
      items.every((it) => it.url.startsWith(`${AGENT}/files/`)), items[0] && items[0].url);
    check('every item carries the sourceId', items.every((it) => it.sourceId === source.id));
    check('item id equals its path (stable picker key)', items.every((it) => it.id === it.path));

    // Fetch the bytes cross-origin (fetch enforces CORS — the real proof).
    const first = items.find((it) => it.kind === 'image') || items[0];
    let bytesOk = false, blobSize = 0;
    try {
      const r = await fetch(first.url);
      const b = await r.blob();
      blobSize = b.size; bytesOk = r.ok && b.size > 0;
    } catch (e) { check('fetch bytes threw', false, String(e)); }
    check('image bytes fetch cross-origin (CORS on /files)', bytesOk, `size=${blobSize}`);

    // And it actually decodes as an image (render proof).
    const rendered = await loadsAsImage(first.url);
    check('resolved url renders as an <img>', rendered, first.url);
    if (rendered) { const p = document.getElementById('proof'); p.src = first.url; p.hidden = false; }

    // album navigation, if the agent exposed one
    if (albums.length) {
      const { items: aItems } = await resolveListing(source, albums[0]);
      check('album listing resolves', aItems.length >= 0, `album=${albums[0]}`);
    }

    // Cleanup.
    await client.remove(source.id);
    check('source removed from registry',
      !(await client.list()).some((s) => s.id === source.id));

  } catch (e) {
    // The skip throw is control flow, not a fault. Anything else still is one.
    if (!e || !e.__skipped) check('unexpected error', false, String(e));
  }

  const sum = document.getElementById('summary');
  // SKIPPED IS NOT A PASS AND IT IS NOT A FAILURE. `run_all.html` reads `data-skipped`, and the
  // wording matches the other preflighting suites so one parser covers all of them.
  if (skipped && !failed) {
    sum.textContent = `SKIPPED \u2014 the media agent this suite drives is not running `
      + `(${passed} checks that do not need it passed)`;
    sum.dataset.skipped = 'true';
    sum.className = 'skip';
  } else {
    sum.textContent = `${passed} passed, ${failed} failed`
      + (skipped ? `, ${skipped} NOT RUN` : '');
    sum.className = failed ? 'fail' : 'pass';
  }
  sum.dataset.done = 'true';
  sum.dataset.failed = String(failed);
})();
</script>
</body>
</html>
