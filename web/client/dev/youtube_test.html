<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>youtube module — integration test</title>
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  #host{width:320px;margin-top:12px}
  .youtube .stage{position:relative;width:100%;aspect-ratio:16/9;background:#0c1a14;border-radius:10px;overflow:hidden}
  .youtube .status{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(10,51,35,.72);font-size:.85rem}
  /* NO LOCAL RULES FOR .nav, .gear OR .settings. They used to be here, copied from
     modules.css back when that file hid all three — and a copy of a rule is a copy that
     outlives the rule. Whether those controls are REACHABLE is now the thing being checked
     below (G13), and a suite that restyled them would be checking its own stylesheet. */
</style>
<!-- REQUIRED, not decoration: the `[hidden]` check below is about a rule in this
     stylesheet outranking the browser's own, so a page without it would pass while
     the live screen fails. -->
<link rel="stylesheet" href="../modules.css">
</head>
<body>
<h1>youtube module — integration test</h1>
<p>Mounts the real <code>youtube</code> module against the live server, with a STUB
player injected (no network, deterministic) so the module core — playlist → shared
picker (<code>rng.js</code>) → advance → append-only play log — is exercised end to end.</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>

<script type="module">
import { createBus } from '../bus.js';
import { createState } from '../state.js';
import { createEvents } from '../events.js';
import { createProfilesClient } from '../profile.js';
import { mountModule } from '../module.js';
import { pressControls, checkHiddenHides } from './press_controls.js';
import { parseVideoId, parsePlaylistId, pickDaypart, searchVideos } from '../modules/youtube.js';   // registers 'youtube' + exports the parsers

const params = new URLSearchParams(location.search);
const USER = params.get('user') || 'youtube-test-user';
const out = document.getElementById('results');
let passed = 0, failed = 0;

function check(name, cond, detail = '') {
  const ok = !!cond; ok ? passed++ : failed++;
  const line = document.createElement('div');
  line.className = ok ? 'pass' : 'fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(line);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// A deterministic, offline stub of the player adapter. Records the id sequence it
// was told to load, and lets the test fire the "video ended" event by hand.
function makeStubPlayer() {
  let handlers = {};
  const loaded = [];
  const out = {
    loaded,
    current: () => loaded[loaded.length - 1] ?? null,
    fireEnded: () => handlers.onEnded?.(),
    cued: [],
    // stand in for YouTube handing back a cued playlist's video ids
    deliverList: (ids) => handlers.onPlaylist?.(ids),
    factory(mountEl, h) {
      handlers = h || {};
      const self = {
        load: (id) => { loaded.push(id); },
        cueList: (listId) => { self._cued.push(listId); },
        stop: () => {},
        destroy: () => {},
      };
      self._cued = out.cued;
      return self;
    },
  };
  return out;
}

// 8 videos across 3 channels (A:3, B:3, C:2) — enough to exercise anti-repeat,
// coverage, and channel diversity.
const PLAYLIST = [
  { id: 'vidA000001', channel: 'A', title: 'A-1', durationSec: 120 },
  { id: 'vidA000002', channel: 'A', title: 'A-2', durationSec: 200 },
  { id: 'vidA000003', channel: 'A', title: 'A-3', durationSec: 90  },
  { id: 'vidB000001', channel: 'B', title: 'B-1', durationSec: 300 },
  { id: 'vidB000002', channel: 'B', title: 'B-2', durationSec: 150 },
  { id: 'vidB000003', channel: 'B', title: 'B-3', durationSec: 240 },
  { id: 'vidC000001', channel: 'C', title: 'C-1', durationSec: 60  },
  { id: 'vidC000002', channel: 'C', title: 'C-2', durationSec: 420 },
];
const channelOf = Object.fromEntries(PLAYLIST.map((v) => [v.id, v.channel]));

(async () => {
  // *** PRESS THE CONTROLS A PERSON TOUCHES. ***
  // This module's arrows were DEAD on 2026-09-05 and this suite was green, because every
  // check drove the bus TOPIC and none of them pressed the BUTTON. Runs first, and needs
  // no server - so it says something even when the API checks below cannot run.
  await pressControls('youtube',
    [{ sel: '[data-next]', topic: 'youtube/next', label: 'the next arrow' },
     { sel: '[data-prev]', topic: 'youtube/prev', label: 'the prev arrow' }],
    check);
  // `.youtube .status` sets `display:flex`, which outranks the browser's own
  // `[hidden]{display:none}`. Without this check, hiding the sheet is a no-op on
  // screen while the code that hides it looks correct.
  checkHiddenHides('youtube', 'status', check, 'youtube’s status sheet');

  try {
    // --- unit: the id parser (pure) ------------------------------------------
    check('parseVideoId: bare 11-char id', parseVideoId('dQw4w9WgXcQ') === 'dQw4w9WgXcQ');
    check('parseVideoId: watch?v= url', parseVideoId('https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=10s') === 'dQw4w9WgXcQ');
    check('parseVideoId: youtu.be url', parseVideoId('https://youtu.be/dQw4w9WgXcQ') === 'dQw4w9WgXcQ');
    check('parseVideoId: /shorts/ url', parseVideoId('https://www.youtube.com/shorts/dQw4w9WgXcQ') === 'dQw4w9WgXcQ');
    check('parseVideoId: rejects junk', parseVideoId('not a video') === null);

    // ---------------- playlist ids -------------------------------------
    check('parsePlaylistId: full playlist url',
      parsePlaylistId('https://www.youtube.com/playlist?list=PLR0lG5yo6NRE') === 'PLR0lG5yo6NRE');
    check('parsePlaylistId: list= inside a watch url',
      parsePlaylistId('https://youtube.com/watch?v=abc&list=PLR0lG5yo6NRE') === 'PLR0lG5yo6NRE');
    check('parsePlaylistId: a bare id', parsePlaylistId('PLR0lG5yo6NRE') === 'PLR0lG5yo6NRE');
    // The one that actually bites: a VIDEO id pasted into the playlist box.
    check('parsePlaylistId: refuses a video id', parsePlaylistId('dQw4w9WgXcQ') === '');
    check('parsePlaylistId: refuses junk', parsePlaylistId('nope') === '');

    // ---------------- the daypart clock --------------------------------
    const SCHED = [
      { name: 'Morning',    start: 7,  playlistId: 'PLmorning' },
      { name: 'Daytime',    start: 11, playlistId: 'PLday' },
      { name: 'Primetime',  start: 18, playlistId: 'PLprime' },
      { name: 'Sleepytime', start: 23, playlistId: 'PLsleep' },
    ];
    const at = (h, m = 0) => new Date(2026, 7, 20, h, m, 0);
    check('daypart: mid-morning', pickDaypart(SCHED, at(9)).name === 'Morning');
    check('daypart: exactly on a boundary belongs to the new one',
      pickDaypart(SCHED, at(11)).name === 'Daytime');
    check('daypart: a minute before a boundary is still the old one',
      pickDaypart(SCHED, at(10, 59)).name === 'Morning');
    check('daypart: evening', pickDaypart(SCHED, at(19)).name === 'Primetime');
    // THE WRAP — 2am is before every start hour, and belongs to the LAST daypart.
    check('daypart: after midnight wraps to the last daypart',
      pickDaypart(SCHED, at(2)).name === 'Sleepytime');
    check('daypart: 23:30 is sleepytime too', pickDaypart(SCHED, at(23, 30)).name === 'Sleepytime');
    check('daypart: an unsorted schedule still works',
      pickDaypart([SCHED[2], SCHED[0], SCHED[3], SCHED[1]], at(9)).name === 'Morning');
    check('daypart: entries without a playlist are ignored',
      pickDaypart([{ name: 'Empty', start: 8 }, SCHED[0]], at(9)).name === 'Morning');
    check('daypart: no schedule at all is null', pickDaypart([], at(9)) === null);

    // ── FROM THIS TIME TO THAT TIME ─────────────────────────────────────────
    //
    // Mike: "a scheduler that can say play this from this time to that time, that from then to
    // then." Start-only entries cannot express it, because they have no way to say "and the
    // rest of the day, nothing" — the last one always wraps and something always matches.
    const RANGE = [
      { name: 'Lunch',  start: 12, end: 13, playlistId: 'PLlunch' },
      { name: 'Night',  start: 22, end: 6,  playlistId: 'PLnight' },   // wraps midnight
    ];
    check('range: inside it, it plays', pickDaypart(RANGE, at(12, 30))?.name === 'Lunch',
      JSON.stringify(pickDaypart(RANGE, at(12, 30))));
    check('range: the start is inside', pickDaypart(RANGE, at(12))?.name === 'Lunch',
      JSON.stringify(pickDaypart(RANGE, at(12))));
    check('*** range: the end is NOT inside — [start, end) ***',
      pickDaypart(RANGE, at(13)) === null, JSON.stringify(pickDaypart(RANGE, at(13))));
    check('*** range: a gap really is a gap, and that is the new capability ***',
      pickDaypart(RANGE, at(15)) === null, JSON.stringify(pickDaypart(RANGE, at(15))));
    // OPTIONAL CHAINING THROUGHOUT, and it is not style. Written with `.name` these six
    // checks abort the whole suite on the first null -- proved by disabling range support and
    // watching one "unexpected error: cannot read properties of null" replace every result
    // after it. `board_test` records the same lesson in its own words. A regression should say
    // which line broke, not swallow the section.
    check('range: one that wraps midnight covers the late side',
      pickDaypart(RANGE, at(23, 30))?.name === 'Night',
      JSON.stringify(pickDaypart(RANGE, at(23, 30))));
    check('...and the early side', pickDaypart(RANGE, at(3))?.name === 'Night',
      JSON.stringify(pickDaypart(RANGE, at(3))));
    check('...and not the middle of the afternoon', pickDaypart(RANGE, at(16)) === null);

    // *** EVERY SCHEDULE SAVED BEFORE THIS HAS NO `end`, AND MUST BEHAVE EXACTLY AS IT DID. ***
    // This is the check that makes the feature safe to ship rather than the ones above: the
    // whole block of start-only assertions further up still passes, and this states the
    // guarantee out loud so nobody has to infer it from their continued presence.
    check('*** a start-only schedule is untouched by the new option ***',
      pickDaypart(SCHED, at(9))?.name === 'Morning'
        && pickDaypart(SCHED, at(2))?.name === 'Sleepytime'
        && pickDaypart(SCHED, at(19))?.name === 'Primetime');

    // A range wins over a start-only entry covering the same hour: it is the specific
    // statement, and somebody who wrote one meant it.
    const MIXED = [{ name: 'AllDay', start: 0, playlistId: 'PLall' },
                   { name: 'Lunch', start: 12, end: 13, playlistId: 'PLlunch' }];
    check('a range beats a start-only entry over the same hour',
      pickDaypart(MIXED, at(12, 30))?.name === 'Lunch',
      JSON.stringify(pickDaypart(MIXED, at(12, 30))));
    check('...and outside the range the start-only entry still covers the day',
      pickDaypart(MIXED, at(15))?.name === 'AllDay',
      JSON.stringify(pickDaypart(MIXED, at(15))));

    // A plausible typo must not silently mean "never".
    check('a zero-length range is read as a whole day, not an empty one',
      pickDaypart([{ name: 'Odd', start: 9, end: 9, playlistId: 'PLodd' }], at(3))?.name === 'Odd');

    const profiles = createProfilesClient({ user: USER });
    const profile = await profiles.create('TEST-youtube');
    const mod = await profiles.addModule(profile.id, 'youtube');

    const state = createState({ url: profiles.stateURL(profile.id, mod.id), user: USER });
    const events = createEvents({ url: profiles.eventsURL(profile.id, mod.id), user: USER });
    await state.load(); await events.load();
    state.set({ playlist: PLAYLIST, autoAdvance: true });
    await state.flush();

    const stub = makeStubPlayer();
    const bus = createBus();
    const host = document.getElementById('host');
    const instance = mountModule('youtube', {
      mount: host, bus, state, events, user: USER, profileId: profile.id,
      playerFactory: stub.factory,
    });
    instance.init();
    await sleep(60);

    check('module loads a first video on mount', stub.current() !== null, `current=${stub.current()}`);
    check('first video is one of the playlist', PLAYLIST.some((v) => v.id === stub.current()));

    await events.load();
    const initialPlays = (events.get().events || []).filter((e) => e.kind === 'play').length;
    check('first shown video logged a play event', initialPlays >= 1, `plays=${initialPlays}`);

    // Drive advances by hand: coverage + no immediate repeat + channel diversity.
    const seen = new Set([stub.current()]);
    const order = [stub.current()];
    let immediateRepeat = false;
    for (let i = 0; i < 24; i++) {
      const before = stub.current();
      bus.publish('youtube/next');
      await sleep(20);
      const after = stub.current();
      if (after === before) immediateRepeat = true;
      seen.add(after);
      order.push(after);
    }
    check('no immediate repeat across 24 advances', !immediateRepeat);
    check(`coverage: all ${PLAYLIST.length} videos surfaced`, seen.size === PLAYLIST.length, `seen=${seen.size}/${PLAYLIST.length}`);

    // channel diversity: back-to-back same-channel should be rare (penalty 0.15).
    let sameChannel = 0;
    for (let i = 1; i < order.length; i++) if (channelOf[order[i]] === channelOf[order[i - 1]]) sameChannel++;
    const sameRate = sameChannel / (order.length - 1);
    check('channel diversity keeps same-channel back-to-back low (<40%)', sameRate < 0.40, `rate=${(sameRate * 100).toFixed(0)}%`);

    // ENDED (video finished) auto-advances via the bus, exactly like a Next.
    const loadsBefore = stub.loaded.length;
    await events.load();
    const playsBeforeEnd = (events.get().events || []).filter((e) => e.kind === 'play').length;
    stub.fireEnded();
    await sleep(30);
    check('video ENDED auto-advances (loads the next video)', stub.loaded.length === loadsBefore + 1,
      `loads ${loadsBefore}->${stub.loaded.length}`);

    // prev() steps back to the previously shown video WITHOUT logging a new play.
    const beforePrev = stub.current();
    const lastForward = stub.loaded[stub.loaded.length - 2];
    bus.publish('youtube/prev');
    await sleep(20);
    check('prev() returns to the prior video', stub.current() === lastForward && stub.current() !== beforePrev,
      `beforePrev=${beforePrev} now=${stub.current()} expected=${lastForward}`);

    await sleep(500);
    await events.load();
    const plays = (events.get().events || []).filter((e) => e.kind === 'play');
    check('play history grew (append-only)', plays.length >= initialPlays + 20, `plays=${plays.length}`);
    check('every play event carries id + numeric at',
      plays.every((e) => e.data && e.data.id && Number.isFinite(e.data.at)));
    check('prev() did NOT log a play (replay, not a new play)',
      plays.length === playsBeforeEnd + 1, `plays=${plays.length} expected=${playsBeforeEnd + 1}`);

    instance.destroy();
    check('destroy() cleans up without error', true);

    // ============ a scheduled playlist drives the pool ============
    // The point of the port: a playlist says WHAT is available; the weighted picker still
    // decides what plays. So cueing must fill the pool, not hand YouTube the running order.
    {
      const p2 = await profiles.create('TEST-youtube-sched');
      const m2 = await profiles.addModule(p2.id, 'youtube');
      const st2 = createState({ url: profiles.stateURL(p2.id, m2.id), user: USER });
      const ev2 = createEvents({ url: profiles.eventsURL(p2.id, m2.id), user: USER });
      await st2.load(); await ev2.load();
      st2.set({ schedule: SCHED, autoAdvance: true });
      await st2.flush();

      const stub2 = makeStubPlayer();
      const host2 = document.createElement('div');
      document.body.append(host2);
      const inst2 = mountModule('youtube', {
        mount: host2, bus: createBus(), state: st2, events: ev2, user: USER, profileId: p2.id,
        playerFactory: stub2.factory,
        nowDate: () => at(9),                 // mid-morning
        scheduleTickMs: 5,
      });
      inst2.init();
      await sleep(80);

      check('the clock picks the playlist to cue', stub2.cued[0] === 'PLmorning', JSON.stringify(stub2.cued));
      check('nothing plays until the playlist reports its videos', stub2.current() === null);
      check('and it says what it is waiting for', /Loading Morning/.test(host2.textContent),
        host2.textContent.slice(0, 80));

      stub2.deliverList(['v1', 'v2', 'v3']);
      await sleep(80);
      check('once the ids arrive a video starts', ['v1', 'v2', 'v3'].includes(stub2.current()),
        String(stub2.current()));
      check('the videos came from the playlist, not the running order YouTube would use',
        stub2.loaded.length === 1);
      check('the panel names the daypart that is on', /Morning[\s\S]*now/.test(host2.textContent),
        host2.textContent.slice(0, 160));

      inst2.destroy();
      st2.destroy(); ev2.destroy();
      host2.remove();
    }

    // ============ shuffle is on by default; order is opt-out ============
    {
      const p3 = await profiles.create('TEST-youtube-order');
      const m3 = await profiles.addModule(p3.id, 'youtube');
      const st3 = createState({ url: profiles.stateURL(p3.id, m3.id), user: USER });
      const ev3 = createEvents({ url: profiles.eventsURL(p3.id, m3.id), user: USER });
      await st3.load(); await ev3.load();
      st3.set({ playlist: PLAYLIST, autoAdvance: false, shuffle: false });
      await st3.flush();

      const stub3 = makeStubPlayer();
      const host3 = document.createElement('div');
      document.body.append(host3);
      const bus3 = createBus();
      const inst3 = mountModule('youtube', {
        mount: host3, bus: bus3, state: st3, events: ev3, user: USER, profileId: p3.id,
        playerFactory: stub3.factory,
      });
      inst3.init();
      await sleep(60);
      // advance the same way the rest of this file does — the click goes out over the
      // input bus, which is not wired up in a bare test host.
      bus3.publish('youtube/next');
      await sleep(30);
      bus3.publish('youtube/next');
      await sleep(30);

      const order = PLAYLIST.map((v) => v.id);
      const seen = stub3.loaded;
      const startedAt = order.indexOf(seen[0]);
      check('with shuffle off it walks the playlist in order',
        seen[1] === order[(startedAt + 1) % order.length] &&
        seen[2] === order[(startedAt + 2) % order.length],
        JSON.stringify(seen.slice(0, 3)));

      const shufBox = host3.querySelector('[data-opt="shuffle"]');
      check('the panel shows shuffle is off', shufBox && shufBox.checked === false);
      inst3.destroy(); st3.destroy(); ev3.destroy(); host3.remove();

      // A screen that never mentions shuffle must still shuffle — that is the default the
      // whole weighted picker depends on.
      const p4 = await profiles.create('TEST-youtube-default');
      const m4 = await profiles.addModule(p4.id, 'youtube');
      const st4 = createState({ url: profiles.stateURL(p4.id, m4.id), user: USER });
      const ev4 = createEvents({ url: profiles.eventsURL(p4.id, m4.id), user: USER });
      await st4.load(); await ev4.load();
      st4.set({ playlist: PLAYLIST });          // no `shuffle` key at all
      await st4.flush();
      const stub4 = makeStubPlayer();
      const host4 = document.createElement('div');
      document.body.append(host4);
      const inst4 = mountModule('youtube', {
        mount: host4, bus: createBus(), state: st4, events: ev4, user: USER, profileId: p4.id,
        playerFactory: stub4.factory,
      });
      inst4.init();
      await sleep(60);
      const box4 = host4.querySelector('[data-opt="shuffle"]');
      check('shuffle is ON when nothing says otherwise', box4 && box4.checked === true);
      inst4.destroy(); st4.destroy(); ev4.destroy(); host4.remove();
    }


    // *** THE TWO BLOCKS BELOW USED TO SIT AFTER THIS `catch`, AND ONE OF THEM STOPPED THE
    // WHOLE SUITE DEAD. ***
    //
    // Out there, `state` is not in scope -- it is a `const` declared inside this try -- so the
    // schedule block threw a ReferenceError OUTSIDE any catch. The async function rejected, the
    // summary stayed on "running…" forever, and `run_suite` reported the suite as unfinished
    // with no failing line to point at. That is the worst way for a check to break: it looks
    // like a hang, not a mistake.
    //
    // The G13 block next to it had the same bug and got away with it, which is the part worth
    // recording: `host` resolves out there ANYWAY, because an element with `id="host"` is
    // exposed by the browser as `window.host`. It passed for a reason that has nothing to do
    // with being correct, and would have broken the moment somebody renamed the div.
    //
    // Both live inside the try now, where the things they drive are declared.
    // ── THE SCHEDULE CAN BE WRITTEN, NOT ONLY READ ─────────────────────────
    //
    // `cfg.schedule` has been read since this module was written and NOTHING COULD WRITE IT --
    // the panel printed a one-line summary of a setting no UI could set. Same shape as A14, and
    // the reason Mike's "play this from this time to that time" read as entirely missing when
    // half of it was already in the file.
    //
    // Driven through the real inputs and the real button, because the point of the row is that a
    // person can use it; calling `state.set` here would test the state handle.
    {
      const panel = host.querySelector('.youtube .settings');
      const before = (state.get().schedule || []).length;
      host.querySelector('[data-sch-name]').value = 'Lunch';
      host.querySelector('[data-sch-from]').value = '12:00';
      host.querySelector('[data-sch-to]').value = '13:30';
      host.querySelector('[data-sch-list]').value = 'https://www.youtube.com/playlist?list=PLlunchtime';
      host.querySelector('[data-sch-add]').click();
      await sleep(30);
      const sched = state.get().schedule || [];
      const row = sched[sched.length - 1];
      check('*** the panel can add a schedule entry at all ***', sched.length === before + 1,
        JSON.stringify(sched));
      check('...with the playlist parsed out of a full URL', row && row.playlistId === 'PLlunchtime',
        JSON.stringify(row));
      check('...and the times stored as hours', row && row.start === 12 && row.end === 13.5,
        JSON.stringify(row));

      // AN EMPTY "to" MUST NOT WRITE AN `end` KEY. `pickDaypart` tells the two kinds of entry
      // apart by whether that key holds a finite number, and a row saved with `end: undefined`
      // would be a third thing nobody wrote a rule for.
      host.querySelector('[data-sch-name]').value = 'Evening';
      host.querySelector('[data-sch-from]').value = '18:00';
      host.querySelector('[data-sch-to]').value = '';
      host.querySelector('[data-sch-list]').value = 'PLevening';
      host.querySelector('[data-sch-add]').click();
      await sleep(30);
      const open = (state.get().schedule || []).slice(-1)[0];
      check('*** leaving "to" empty writes no end at all, the way older rows are ***',
        open && !('end' in open), JSON.stringify(open));

      // And it says no to nonsense rather than saving it.
      const n = (state.get().schedule || []).length;
      host.querySelector('[data-sch-from]').value = '09:00';
      host.querySelector('[data-sch-list]').value = 'not a playlist';
      host.querySelector('[data-sch-add]').click();
      await sleep(30);
      check('a bad playlist is refused rather than saved',
        (state.get().schedule || []).length === n, JSON.stringify(state.get().schedule));

      // The rows render, with the range shown for the one that has an end.
      const sched2 = host.querySelector('[data-sched]');
      check('the entries are listed with their times',
        /12:00.{0,3}13:30/.test(sched2.textContent) && /from 18:00/.test(sched2.textContent),
        sched2.textContent.slice(0, 160));
      if (panel) panel.hidden = true;
    }

    // ── SEARCHING FOR A VIDEO ──────────────────────────────────────────────
    //
    // Mike wants per-video search, and the principle: do not withhold capability the API
    // already offers. Search is the Data API, which needs a key with a quota on somebody's
    // Google account -- so it is BRING YOUR OWN KEY, the answer this project already settled on
    // for the AI adapter, because the default must cost Mike nothing.
    //
    // Driven through an injected `fetch`, so none of this touches the network or anybody's key.
    {
      // *** THE NO-KEY PATH FIRST. It is the one almost everybody will hit, and the one most
      // likely to be left as a silent no-op. *** Nothing must go out over the wire without a
      // key, so the fetch used here FAILS the check if it is ever called.
      let called = 0;
      const noFetch = () => { called += 1; throw new Error('must not be called'); };
      const r0 = await searchVideos('cats', { apiKey: '', fetchFn: noFetch });
      check('*** with no key, search does not call out at all ***', called === 0, `called=${called}`);
      check('...and says so rather than failing silently', r0.error === 'no-key', JSON.stringify(r0));
      const blank = await searchVideos('   ', { apiKey: 'k', fetchFn: noFetch });
      check('an empty query does not call out either', called === 0 && blank.error === null,
        `called=${called} ${JSON.stringify(blank)}`);

      // The happy path, against a canned Data API response.
      const canned = {
        ok: true,
        json: async () => ({ items: [
          { id: { videoId: 'abc12345678' },
            snippet: { title: 'A cat', channelTitle: 'Chan' } },
          { id: { kind: 'youtube#channel' }, snippet: { title: 'not a video' } },
        ] }),
      };
      let seenUrl = '';
      const r1 = await searchVideos('cats', {
        apiKey: 'KEY123', fetchFn: async (u) => { seenUrl = u; return canned; },
      });
      check('search returns the videos', r1.items.length === 1 && r1.items[0].id === 'abc12345678',
        JSON.stringify(r1.items));
      check('...with the real title and channel, which is the gain over pasting a link',
        r1.items[0].title === 'A cat' && r1.items[0].channel === 'Chan',
        JSON.stringify(r1.items[0]));
      check('*** a result that is not a video is dropped rather than added as a broken id ***',
        r1.items.every((i) => i.id), JSON.stringify(r1.items));
      check('the query is escaped into the URL', /[?&]q=cats(&|$)/.test(seenUrl), seenUrl);
      check('...and it asks for videos only', /type=video/.test(seenUrl), seenUrl);

      // A refused key is named, because "search failed" is the message that wastes an evening.
      const r2 = await searchVideos('cats', {
        apiKey: 'KEY123', fetchFn: async () => ({ ok: false, status: 403 }),
      });
      check('a refused key says it was the key', r2.error === 'key-refused', JSON.stringify(r2));
      const r3 = await searchVideos('cats', {
        apiKey: 'KEY123', fetchFn: async () => { throw new Error('offline'); },
      });
      check('...and being offline is not reported as a bad key', r3.error === 'failed',
        JSON.stringify(r3));

      // *** AND THROUGH THE PANEL, because a function nobody can reach is not a feature. ***
      const host5 = document.createElement('div');
      host5.style.cssText = 'position:relative;width:420px;height:300px';
      document.body.append(host5);
      const st5 = createState({ url: profiles.stateURL(profile.id, mod.id + '-search'), user: USER });
      const ev5 = createEvents({ url: profiles.eventsURL(profile.id, mod.id + '-search'), user: USER });
      await st5.load(); await ev5.load();
      const stub5 = makeStubPlayer();
      const inst5 = mountModule('youtube', {
        mount: host5, bus: createBus(), state: st5, events: ev5, user: USER,
        profileId: profile.id, playerFactory: stub5.factory,
        searchVideos: async () => ({ items: [{ id: 'zzz11111111', title: 'Found', channel: 'C' }],
                                     error: null }),
      });
      inst5.init();
      await sleep(60);
      host5.querySelector('[data-find]').value = 'cats';
      host5.querySelector('[data-find-go]').click();
      await sleep(60);
      const results = host5.querySelector('[data-results]');
      check('the panel lists what the search found', /Found/.test(results.textContent),
        results.textContent.slice(0, 120));
      results.querySelector('button')?.click();
      await sleep(40);
      const added = (st5.get().playlist || []).some((v) => v.id === 'zzz11111111');
      check('*** and a result can be added to the playlist ***', added,
        JSON.stringify(st5.get().playlist));
      check('...keeping the title, not just the id',
        (st5.get().playlist || []).some((v) => v.title === 'Found'),
        JSON.stringify(st5.get().playlist));
      inst5.destroy(); st5.destroy(); ev5.destroy(); host5.remove();
    }

    // ── *** A PANEL SOMEBODY CANNOT LEAVE. THE SAFETY ONE. *** ─────────────
    //
    // Mike opened this panel on the deployed site, added a playlist, and COULD NOT GET OUT.
    // Escape did nothing, there was no close button, and the sheet is inset on all four sides
    // so it covered the gear that opened it. He escaped by navigating to Photos and back.
    //
    // On a bedside screen that is somebody stuck in a panel they cannot leave without help --
    // and it is the undismissable-gate failure `CLAUDE.md` names, arriving through a settings
    // sheet rather than a modal. It was reachable because I un-hid this panel the same day, so
    // the check belongs next to the feature that caused it.
    //
    // THREE WAYS OUT, and three is not belt-and-braces: the close button is for a pointer, the
    // gear is for somebody who remembers how they got in, and Escape is for a keyboard. A
    // switch user has whichever of those is bound.
    {
      const panel = () => host.querySelector('.youtube .settings');
      const gear = host.querySelector('.youtube .gear');

      gear.click();
      check('the panel opens', panel().hidden === false);
      const closeBtn = host.querySelector('.youtube [data-close]');
      check('*** it has a visible way out ***', !!closeBtn && closeBtn.offsetParent !== null,
        closeBtn ? 'present but not displayed' : 'no close button');
      closeBtn.click();
      check('...and pressing it leaves', panel().hidden === true);

      // EACH WAY OUT IS TESTED FROM A KNOWN STATE, set directly rather than by pressing the
      // previous control. Chained through clicks, a broken Escape left the panel open and the
      // NEXT line's `gear.click()` closed it -- so the failure surfaced under the neighbour's
      // name and "Escape leaves" passed. A check that reports somebody else's fault is worth
      // less than no check.
      panel().hidden = false;
      host.querySelector('.youtube').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      check('*** Escape leaves ***', panel().hidden === true);

      panel().hidden = false;
      // The gear must still be REACHABLE while the panel is open -- it was underneath it, which
      // is why pressing the thing that opened it did not close it.
      //
      // Checked by STACKING ORDER rather than `elementFromPoint`: this suite's host sits outside
      // the viewport, so hit-testing a coordinate returns null and reports "nothing at that
      // point" -- a harness limit dressed up as a product failure, which is the fourth time
      // today one of those has fooled me. z-index is the property that was actually wrong.
      const gz = Number(getComputedStyle(gear).zIndex);
      const pz = Number(getComputedStyle(panel()).zIndex);
      check('*** the gear stacks ABOVE the panel it opened, so it is still pressable ***',
        Number.isFinite(gz) && Number.isFinite(pz) && gz > pz, `gear ${gz} vs panel ${pz}`);
      gear.click();
      check('...so the control that opened it also closes it', panel().hidden === true);

      // Escape with the panel already shut must not do anything surprising elsewhere.
      host.querySelector('.youtube').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      check('Escape with nothing open is harmless', panel().hidden === true);
    }

    // ── G13: THE ONLY WAY TO CHOOSE A VIDEO HAS TO BE ON SCREEN ────────────
    //
    // Mike, off the live site: "YouTube's overlay covers everything on hover and there is no
    // obvious way to choose a video from the panel." There was no way at all: modules.css
    // carried `.youtube .nav,.youtube .gear,.youtube .settings{display:none}` — right for
    // photos and camera, whose every setting is declared in their manifest and therefore
    // reachable from the universal menu, and wrong for this one, which declares ONE setting
    // while adding a video, using a playlist, the schedule, shuffle and auto-advance all live
    // in that hidden panel. Nothing else in the product edits a playlist.
    //
    // Asserted as COMPUTED STYLE, not as "the element exists". The elements always existed;
    // that is exactly why nobody noticed, and why the audit page counted them as controls.
    {
      const gear = host.querySelector('.youtube .gear');
      const nav = host.querySelector('.youtube .nav');
      check('*** the gear is on screen, not display:none ***',
        gear && getComputedStyle(gear).display !== 'none',
        gear ? getComputedStyle(gear).display : 'no gear');
      check('*** and so are the previous/next arrows ***',
        nav && getComputedStyle(nav).display !== 'none',
        nav ? getComputedStyle(nav).display : 'no nav');
      // Pressing it opens the panel that holds the playlist editor. A visible gear that opens
      // nothing would pass the two checks above and fix nothing.
      const panel = host.querySelector('.youtube .settings');
      const wasHidden = panel.hidden;
      gear.click();
      check('*** pressing the gear opens the panel that adds a video ***',
        wasHidden === true && panel.hidden === false
          && !!panel.querySelector('[data-add-url]') && !!panel.querySelector('[data-add]'),
        `hidden ${wasHidden} -> ${panel.hidden}`);
      gear.click();
      check('...and pressing it again puts it away', panel.hidden === true);
    }

  } catch (e) {
    check('unexpected error', false, String(e && e.stack || e));
  }

  const sum = document.getElementById('summary');
  sum.textContent = `${passed} passed, ${failed} failed`;
  sum.className = failed ? 'fail' : 'pass';
  sum.dataset.done = 'true'; sum.dataset.failed = String(failed);
})();
</script>
</body>
</html>
