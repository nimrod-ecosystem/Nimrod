<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>personal videos — integration test</title>
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  .personal .stage{width:320px;aspect-ratio:16/9;background:#0c1a14}
  .personal .stage video{width:100%;height:100%}
  #host,#host2{width:340px;margin-top:12px}
</style>
<!-- REQUIRED, not decoration: the `[hidden]` check below is about a rule in this
     stylesheet outranking the browser's own, so a page without it would pass while
     the live screen fails. -->
<link rel="stylesheet" href="../modules.css">
</head>
<body>
<h1>personal videos — integration test</h1>
<p>Mounts the real <code>personal</code> module against the live server + the personal-messages agent
(<code>…/Voice messages/personal</code> on :8771). Autoplay off so the big clips aren't buffered; the
"ended" handoff is fired by hand. Requires the agent running on port 8771.</p>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>
<div id="host2"></div>

<script type="module">
import { createBus } from '../bus.js';
import { createState } from '../state.js';
import { createEvents } from '../events.js';
import { createProfilesClient } from '../profile.js';
import { createMediaSourcesClient } from '../media_sources.js';
import { mountModule } from '../module.js';
import { pressControls, checkHiddenHides, pressRetry, agentReachable, reportSkipped }
  from './press_controls.js';
import '../modules/personal.js';   // registers 'personal'

const params = new URLSearchParams(location.search);
const USER = params.get('user') || 'personal-test-user';
const AGENT = params.get('agent') || 'http://127.0.0.1:8771';
const out = document.getElementById('results');
let passed = 0, failed = 0;
function check(name, cond, detail = '') {
  const ok = !!cond; ok ? passed++ : failed++;
  const line = document.createElement('div');
  line.className = ok ? 'pass' : 'fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(line);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const vid = (host) => host.querySelector('.personal video');
const vidSrc = (host) => vid(host)?.getAttribute('src') || null;

(async () => {
  // *** PRESS THE CONTROLS A PERSON TOUCHES. ***
  // This module's arrows were DEAD on 2026-09-05 and this suite was green, because every
  // check drove the bus TOPIC and none of them pressed the BUTTON. Runs first, and needs
  // no server - so it says something even when the API checks below cannot run.
  await pressControls('personal',
    [{ sel: '[data-next]', topic: 'personal/next', label: 'the next arrow' },
     { sel: '[data-prev]', topic: 'personal/prev', label: 'the prev arrow' }],
    check);
  // `.personal .status` sets `display:flex`, which outranks the browser's own
  // `[hidden]{display:none}`. Without this check, hiding the sheet is a no-op on
  // screen while the code that hides it looks correct.
  checkHiddenHides('personal', 'status', check, 'personal’s status sheet');
  await pressRetry('personal', check);

  // *** CONNECT FROM HERE, NOT ONLY FROM MEDIA / SOURCES. *** 2026-09-08, Mike's "sources
  // structural rule," same fix as photos.js. Self-contained (a fake `sources` client), so it
  // needs no agent -- like the checks above, it says something even when :8771 is not running.
  // Completing a real folder picker cannot be driven headlessly (needs a real OS dialog and a
  // real user gesture); this checks the offer appears, the same boundary the Allow button
  // already drew elsewhere.
  {
    const host = document.createElement('div');
    document.body.append(host);
    let cfg = {};
    const state = { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; },
                    subscribe: (f) => { f(cfg); return () => {}; }, flush() {} };
    const inst = mountModule('personal', {
      mount: host, bus: createBus(), state,
      events: { append: () => Promise.resolve(), subscribe() {}, load: () => Promise.resolve() },
      user: 'personal-test-nosrc', profileId: 'p',
      sources: { list: async () => [], add: async () => { throw new Error('no picker in test'); }, remove: async () => {} },
    });
    inst.init();
    await new Promise((r) => setTimeout(r, 120));
    const status = host.querySelector('[data-status]');
    check('no source connected is a real status message',
      !status?.hidden && /no personal-video source connected/i.test(status?.textContent || ''),
      status?.textContent);
    const btn = host.querySelector('[data-status] [data-action]');
    check('*** and it offers to connect one right here, not just "see Media / Sources" ***',
      !!btn && /connect a folder/i.test(btn.textContent), status?.innerHTML);
    inst.destroy();
    host.remove();
  }

  // *** A FOLDER OF BROKEN CLIPS MUST NOT SPIN (flash-limit audit, 2026-09-30). *** No agent
  // needed: a fake source, a listing of clips that really fail to load (real `error` events), and
  // fake time. Every failure used to hand back and advance AT ONCE.
  {
    const { worstInAnySecond, failureBackoffMs } = await import('../flash_limit.js');
    for (const L of [3, 1]) {
      const host = document.createElement('div');
      document.body.append(host);
      let fakeNow = 5_000_000; const timers = [], shows = [], dones = [];
      let cfg = { sourceId: 's1', autoAdvance: true };
      const source = { id: 's1', label: 'broken', kind: 'agent', base_url: 'http://127.0.0.1:9' };
      const bus = createBus();
      bus.subscribe('segment/done', (p) => dones.push({ t: fakeNow, reason: p?.reason }));
      const inst = mountModule('personal', {
        mount: host, bus, state: { get: () => cfg, set: (p) => { cfg = { ...cfg, ...p }; }, subscribe: (f) => { f(cfg); return () => {}; }, flush() {} },
        events: { append: (k) => { if (k === 'play') shows.push(fakeNow); return Promise.resolve(); }, subscribe() {}, load: () => Promise.resolve() },
        user: 'personal-test-broken', profileId: 'p',
        sources: { list: async () => [source], add: async () => source, remove: async () => {} },
        resolveListing: async () => ({ items: [1, 2, 3, 4].map((i) => ({ id: 'b' + i, path: 'b' + i + '.mp4', name: 'b' + i, kind: 'video', url: 'data:,broken' + i })), albums: [], album: '' }),
        setTimer: (fn, ms) => { const t = { fn, ms, at: fakeNow + ms, live: true }; timers.push(t); return t; },
        clearTimer: (t) => { if (t) t.live = false; },
        now: () => fakeNow, flashLimitPerSecond: () => L, progressMs: 1e9,
      });
      inst.init();
      await sleep(150);
      // Fire only the failure waits (the stall watchdog and progress tick are far longer).
      const waits = () => timers.filter((t) => t.live && t.ms <= 30000);
      for (let k = 0; k < 12; k++) {
        await sleep(60);
        const t = waits().sort((a, b) => a.at - b.at)[0];
        if (t) { fakeNow = t.at; t.live = false; t.fn(); }
      }
      const rel = shows.map((t) => t - shows[0]);
      const gaps = rel.slice(1).map((t, i) => t - rel[i]);
      const worst = worstInAnySecond(rel);
      check(`limit ${L}: a folder of broken clips - ${shows.length} shown, worst second ${worst} (<= ${L}), gaps ${gaps.join(',')}`,
        shows.length >= 5 && worst <= L && gaps[0] >= failureBackoffMs(1, L) && gaps.slice(1).every((g, i) => g >= gaps[i]),
        JSON.stringify(gaps));
      check('...every failure still hands back to a director (segment/done error), each at the moment it moved on',
        dones.filter((d) => d.reason === 'error').length >= shows.length - 1);
      // A clip that PLAYED (five seconds) and ended is handed back at that same instant, as before.
      const b = shows.length, d0 = dones.length;
      fakeNow += 5000;
      host.querySelector('video')?.dispatchEvent(new Event('ended'));
      check(`limit ${L}: a clip that played and ended moves on at once (normal timing unchanged)`,
        shows.length === b + 1 && shows.at(-1) === fakeNow && dones.slice(d0).some((x) => x.reason === 'ended' && x.t === fakeNow));
      inst.destroy(); host.remove();
    }
  }

  // *** PREFLIGHT: the API half needs an agent, and "cannot run" must not print as "failed". ***
  // Without this, seven assertions about a real video from a real agent failed on 2026-09-06 for
  // the single reason that nothing was listening on 8771. The control presses above need no
  // server, so they still ran and still mean something — which is why the skip happens HERE and
  // not at the top of the file.
  if (!(await agentReachable(AGENT))) {
    reportSkipped('the personal-messages agent', AGENT, passed);
    return;
  }

  try {
    const profiles = createProfilesClient({ user: USER });
    const media = createMediaSourcesClient({ user: USER });
    const src = await media.add({ label: 'personal', base_url: AGENT, kind: 'agent' });

    const profile = await profiles.create('TEST-personal');
    const mod = await profiles.addModule(profile.id, 'personal');
    const state = createState({ url: profiles.stateURL(profile.id, mod.id), user: USER });
    const events = createEvents({ url: profiles.eventsURL(profile.id, mod.id), user: USER });
    await state.load(); await events.load();
    state.set({ sourceId: src.id, subjectName: 'Profile B', autoplay: false, autoAdvance: true });
    await state.flush();

    const bus = createBus();
    const host = document.getElementById('host');
    const segDone = [];
    bus.subscribe('segment/done', (p) => segDone.push(p));
    const instance = mountModule('personal', { mount: host, bus, state, events, user: USER, profileId: profile.id });
    instance.init();
    await sleep(250);   // async source resolve + listing

    // 1. lists both video clips (the .amr / extensionless files are skipped)
    check('lists exactly 2 video clips', host.querySelector('[data-source-label]')?.textContent.includes('2 clip'),
      `label="${host.querySelector('[data-source-label]')?.textContent}"`);
    // 2. renders a <video> straight from the agent (bytes never touch the platform server)
    check('renders a <video> from the agent', /\/files\/message-/.test(vidSrc(host) || ''), `src=${vidSrc(host)}`);
    check('clip is one of the source mp4s', /message-0[12]\.mp4/.test(vidSrc(host) || ''), `src=${vidSrc(host)}`);
    // 3. shows the subject name
    check('caption shows the speaker name', (host.querySelector('[data-name]')?.textContent || '').includes('Profile B'),
      `caption="${host.querySelector('[data-name]')?.textContent}"`);
    // 4. play logged (append-only)
    await events.load();
    const plays0 = (events.get().events || []).filter((e) => e.kind === 'play').length;
    check('first clip logged a play event', plays0 >= 1, `plays=${plays0}`);

    // 5. advancing covers BOTH clips (only 2 items -> the picker weights by recency)
    const seen = new Set([vidSrc(host)]);
    for (let i = 0; i < 8; i++) { bus.publish('personal/next'); await sleep(20); seen.add(vidSrc(host)); }
    check('advancing surfaces both clips', seen.size === 2, `seen=${seen.size}`);

    // 6. a clip ENDING is a segment/done (director seam) AND, standalone, auto-advances
    const before = vidSrc(host);
    const segBefore = segDone.length;
    vid(host).dispatchEvent(new Event('ended'));
    // 400, not 30: this clip appeared ~20 ms ago, and a clip that "ends" inside one flash period
    // (339 ms) of appearing is treated as a broken file and held that long (FAILURE BACKOFF).
    await sleep(400);
    check('clip ENDED emits segment/done{provider:personal}', segDone.length > segBefore && segDone[segDone.length - 1]?.provider === 'personal',
      JSON.stringify(segDone[segDone.length - 1] || null));
    check('standalone (autoAdvance) advances to the next clip on ended', vidSrc(host) !== before || seen.size === 2, `before=${before} now=${vidSrc(host)}`);

    // 7. prev() replays without logging a new play
    await events.load();
    const playsA = (events.get().events || []).filter((e) => e.kind === 'play').length;
    bus.publish('personal/prev');
    await sleep(20);
    await events.load();
    const playsB = (events.get().events || []).filter((e) => e.kind === 'play').length;
    check('prev() replays without a new play event', playsB === playsA, `${playsA} -> ${playsB}`);

    instance.destroy();
    check('destroy() cleans up without error', true);

    // 8. an EMPTY provider (no source) hands back with segment/done{empty} instead of freezing.
    // Use a FRESH user with no media sources (else personal adopts the lone source).
    const USER2 = USER + '-empty';
    const profiles2 = createProfilesClient({ user: USER2 });
    const host2 = document.getElementById('host2');
    const bus2 = createBus();
    const seg2 = [];
    bus2.subscribe('segment/done', (p) => seg2.push(p));
    const prof2 = await profiles2.create('TEST-personal-empty');
    const mod2 = await profiles2.addModule(prof2.id, 'personal');
    const st2 = createState({ url: profiles2.stateURL(prof2.id, mod2.id), user: USER2 });
    const ev2 = createEvents({ url: profiles2.eventsURL(prof2.id, mod2.id), user: USER2 });
    await st2.load(); await ev2.load();
    const inst2 = mountModule('personal', { mount: host2, bus: bus2, state: st2, events: ev2, user: USER2, profileId: prof2.id });
    inst2.init();
    await sleep(120);
    bus2.publish('personal/next');
    await sleep(20);
    check('an empty provider hands back with segment/done{empty}', seg2.some((p) => p?.reason === 'empty'), JSON.stringify(seg2));
    inst2.destroy();

  } catch (e) {
    check('unexpected error', false, String(e && e.stack || e));
  }

  const sum = document.getElementById('summary');
  sum.textContent = `${passed} passed, ${failed} failed`;
  sum.className = failed ? 'fail' : 'pass';
  sum.dataset.done = 'true'; sum.dataset.failed = String(failed);
})();
</script>
</body>
</html>
