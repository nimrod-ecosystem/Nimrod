<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lesson_player - "A lesson": Watch, Slides, Read</title>
<style>
  body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#0A3323;background:#F7F4D5}
  h1{font-size:1.2rem} h2{font-size:1rem;margin:18px 0 4px}
  .pass{color:#2c6e49}.fail{color:#a4243b;font-weight:700}
  #results{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #summary{margin-top:14px;font-weight:700;font-size:1.05rem}
  .box{width:640px;height:420px;position:relative}
</style>
</head>
<body>
<h1>lesson_player - "A lesson": one lesson file, played as Watch, Slides or Read (row 2.92)</h1>
<div id="results"></div>
<div id="summary">running…</div>
<div id="host"></div>
<script type="module">
import { mountModule, getManifest } from '../module.js';
import { createBus } from '../bus.js';
import { LESSON_FORMS, LESSON_SETTINGS, countWords, showWords, answersOf, readHTML, showHTML, WATCH_HOLD_MS, routedQuestions,
  voiceFor, SECOND_VOICE_STEP, ASK_WAIT_MS, named } from '../modules/lesson_player.js';
import { TRIVIA_LESSON_QUESTIONS, WORDFORGE_LESSON_QUESTIONS, unlockedFrom } from '../lessons.js';
import { checkLesson, beatsOf } from '../lesson_file.js';
import { NUMBERS_0_9, BUILTIN_LESSONS } from '../lessons_builtin.js';
import { MODULE_VERBS } from '../actions.js';
import { readLessonFolder } from '../lessons_folder.js';
import { SUBFOLDERS, README, FOLDER_KINDS } from '../user_folders.js';

const out = document.getElementById('results');
let passed = 0, failed = 0;
function check(name, cond, detail = '') {
  const ok = !!cond; ok ? passed++ : failed++;
  const d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${!ok && detail ? '   ' + detail : ''}`;
  out.append(d);
}
function section(t) { const h = document.createElement('h2'); h.textContent = t; out.append(h); }
const J = (v) => JSON.stringify(v);
function fakeRow(initial = {}) {
  let v = { ...initial };
  const subs = new Set();
  return { get: () => v, set(p) { v = { ...v, ...p }; [...subs].forEach((f) => f(v)); }, subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
    load: async () => v, flush: async () => {}, startPolling() {}, destroy() {} };
}
function fakeTimers() {
  let seq = 0; let armed = [];
  return { setTimer: (fn, ms) => { const id = ++seq; armed.push({ id, fn, ms }); return id; }, clearTimer: (id) => { armed = armed.filter((t) => t.id !== id); },
    fire() { const due = armed; armed = []; due.forEach((t) => t.fn()); }, pending: () => armed.length, last: () => armed[armed.length - 1] };
}
function mountLesson(state, extra = {}) {
  const box = document.createElement('div'); box.className = 'box'; document.getElementById('host').append(box);
  const said = [];
  const timers = fakeTimers();
  const bus = createBus();
  const inst = mountModule(extra.type || 'lessons', { mount: box, bus, state, user: 'u', instanceId: `lp-${Math.random().toString(36).slice(2)}`, personId: null,
    output: { say: (t) => { said.push(t); return said.length; }, cancel() {} }, setTimer: timers.setTimer, clearTimer: timers.clearTimer, ...extra });
  inst.init();
  return { box, said, timers, bus, inst, probe: () => inst.impl.__probe(), q: (s) => box.querySelector(s), done() { inst.destroy(); box.remove(); } };
}

try {
  section('registered, with its settings');
  check('*** it is "Lessons", under the type the old topic cards had, so an old Lessons panel opens as this (Mike, 2026-10-17) ***',
    getManifest('lessons')?.title === 'Lessons' && getManifest('lessons')?.core === 'new');
  check('...and still opens under its first day\'s type', getManifest('lesson_player')?.title === 'Lessons');
  check('the old topic cards are not registered on this page (parked: modules/lesson_topics.js)', !getManifest('lesson_topics'));
  check('three forms: Watch, Slides, Read', J(LESSON_FORMS) === J(['watch', 'slides', 'read']));
  const F = Object.fromEntries(LESSON_SETTINGS.map((f) => [f.key, f]));
  check('*** Watch is the default: a lesson left alone plays through, it never sits on its first slide ***', F.form.default === 'watch');
  check('which lesson, the look, saying it aloud, and how long Watch holds each part (Rule 1: settings)',
    F.lessonId && F.speak.default === true && F.holdMs.default === WATCH_HOLD_MS);
  check('*** the look: a child\'s by default (Mike, 2026-10-17: "Child is fine") ***', F.look.default === 'child');
  check('*** "Pictures for" is offered only for a lesson that has looks (Mike: "most lessons would not need you to choose") ***',
    F.look.appliesWhen({ lessonId: 'numbers-0-9' }) === true && F.look.appliesWhen({}) === true && F.look.appliesWhen({ lessonId: 'made-right-to-repair' }) === false);

  section('drawn, not stored');
  check('counts in words: "3 cups", "1 cup", "no cups"', countWords(3, 'cup') === '3 cups' && countWords(1, 'cup') === '1 cup' && countWords(0, 'cup') === 'no cups');
  check('*** a five-frame: 7 is a row of five and two, with the rest of the row shown empty ***', (() => {
    const d = document.createElement('div'); d.innerHTML = showHTML({ kind: 'count', n: 7, frame: 'five', thing: 'cup' });
    return d.querySelectorAll('.lp-dots i:not(.lp-empty)').length === 7 && d.querySelectorAll('.lp-dots i.lp-empty').length === 3;
  })());
  check('a picture is shown as what it is of, in a frame (until Design\'s pictures exist) - never a wrong picture',
    /A picture of<\/small>a clock face/.test(showHTML({ kind: 'picture', of: 'a clock face' })) && showWords({ kind: 'picture', of: 'a clock face' }) === 'A picture of a clock face');
  const q = { question: 'How many are there?', answer: '3', wrong: ['2', '5'] };
  check('a question\'s answers in a fixed shuffled order (the same each time, so a switch can learn it)', J(answersOf(q)) === J(answersOf(q)) && answersOf(q).length === 3 && answersOf(q).includes('3'));

  section('*** WATCH: it plays by itself, and never waits on an answer ***');
  {
    const st = fakeRow({ form: 'watch' });
    const w = mountLesson(st);
    check('it opens on the first part, says it, and is counting to the next', w.probe().at === 0 && w.said[0] === 'Let’s meet some numbers.' && w.timers.pending() === 1, J(w.said));
    check('the bar says which class, and how far through', /Meet 1 to 4/.test(w.q('.lp-top')?.textContent || '') && /1 of /.test(w.q('.lp-top').textContent));
    w.timers.fire();
    check('*** time passes: the next part, said, with no press ***', w.probe().at === 1 && w.said.at(-1) === 'One.' && !!w.q('[data-lp-numeral="1"]'));
    check('where it got to is kept on the panel\'s row', st.get().at === 1);
    check('the time allowed covers the words, plus the Pace pause', w.timers.last().ms >= WATCH_HOLD_MS);
    check('*** Back, Repeat and Next are on screen in Watch too (row 2.113) ***', !!w.q('[data-lp-act="back"]') && !!w.q('[data-lp-act="repeat"]') && !!w.q('[data-lp-act="next"]'));
    w.q('[data-lp-act="repeat"]').click();
    check('Repeat: the same part, said again, and counting again', w.probe().at === 1 && w.said.at(-1) === 'One.' && w.said.at(-2) === 'One.' && w.timers.pending() === 1);
    // Go to the first Match question.
    const L = checkLesson(NUMBERS_0_9).lesson;
    const firstAsk = beatsOf(L).findIndex((b) => b.beat.ask);
    for (let i = 0; w.probe().at < firstAsk && i < 80; i += 1) w.timers.fire();
    check('(setup) a question is on', w.probe().at === firstAsk, String(w.probe().at));
    check('*** in Watch a question is ASKED, and its answers CAN be pressed (row 2.113: "time to answer") ***',
      /How many are there\?/.test(w.said.at(-1)) && w.box.querySelectorAll('.lp-ask button[data-lp-answer]:not([disabled])').length === 3);
    check('*** ...it waits for an answer: 30 seconds by default in Watch (ASK_WAIT_MS), from when it has been asked ***',
      w.timers.pending() === 1 && w.timers.last().ms >= ASK_WAIT_MS, String(w.timers.last()?.ms));
    w.timers.fire();
    check('*** ...nobody answered: it is shown and said, with why - never a screen stuck on a question ***', w.probe().picked === 'shown' && /It is 3\. Count them/.test(w.said.at(-1)) && w.q('[data-lp-result="shown"]'));
    w.timers.fire();
    check('...and on to the next, once that has been said', w.probe().at === firstAsk + 1);
    const nextAsk = beatsOf(L).findIndex((b, i) => i > firstAsk && b.beat.ask);
    for (let i = 0; w.probe().at < nextAsk && i < 20; i += 1) w.timers.fire();
    const rightAns = beatsOf(L)[nextAsk].beat.ask.answer;
    w.q(`[data-lp-answer="${rightAns}"]`).click();
    check('*** a press in Watch answers it: "Yes", said, with why ***', w.probe().picked === rightAns && /^Yes, 6\./.test(w.said.at(-1)) && w.q('[data-lp-result="right"]'), J(w.said.at(-1)));
    w.timers.fire();
    check('...then on', w.probe().at === nextAsk + 1);
    for (let i = 0; w.probe().at < w.probe().total && i < 160; i += 1) w.timers.fire();
    check('*** it reaches the end and stays there, saying so; nothing more is armed ***', w.probe().at === w.probe().total && /end of Numbers 0 to 9/.test(w.said.at(-1)) && w.timers.pending() === 0);
    check('"Start again" at the end', !!w.q('[data-lp-act="again"]'));
    w.bus.publish('lesson/back');
    check('the bar\'s Back (lesson/back) goes to the part before', w.probe().at === w.probe().total - 1);
    w.bus.publish('lesson/next');
    check('*** in Watch the bar\'s Next walks the buttons, as in Slides (there are buttons now) ***', !!w.q('.lp-nav [data-lit]'));
    check('the verbs are registered for the bar and switches, Pause and Play with them', J(MODULE_VERBS.lesson_player) === J({ next: 'lesson/next', prev: 'lesson/prev',
      select: 'lesson/select', back: 'lesson/back', pause: 'lessons/pause', play: 'lessons/play' }) && J(MODULE_VERBS.lessons) === J(MODULE_VERBS.lesson_player));
    w.done();
  }

  section('*** THE PACE (row 2.113): never on before the voice has finished; Pause holds the part ***');
  {
    // A voice that reports when it has finished (output.js onReport), as the real screen's does.
    const lines = [];
    const cancelled = [];
    const output = { reports: true, getRouting: () => ({ say: ['speech'] }),
      say: (text, opts) => { lines.push({ text, onReport: opts?.onReport || null }); return `o${lines.length}`; }, cancel: (id) => { cancelled.push(id); return true; } };
    const w = mountLesson(fakeRow({ form: 'watch' }), { output });
    check('(setup) the first part is being said', lines.length === 1 && w.probe().at === 0);
    check('*** while the voice is still talking, the only clock is the backstop: words at a slow pace plus 10 s ***',
      w.timers.pending() === 1 && w.timers.last().ms >= 10000, String(w.timers.last()?.ms));
    lines[0].onReport({ channel: 'speech', delivered: true });
    await new Promise((r) => setTimeout(r, 0));
    check('*** the voice finished: now the Pace pause, then on ***', w.timers.pending() === 1 && w.timers.last().ms >= WATCH_HOLD_MS && w.timers.last().ms < 10000, String(w.timers.last()?.ms));
    w.timers.fire();
    check('...on to the next part', w.probe().at === 1 && lines.length === 2);
    // PAUSE (Mike, 2026-10-23: "The pause button on the transport bar isn't pausing the lesson.")
    w.bus.publish(MODULE_VERBS.lessons.pause);
    check('*** Pause: the voice is stopped (by its id), nothing is counting, and it says Paused ***',
      w.probe().paused && J(cancelled) === J(['o2']) && w.timers.pending() === 0 && /Paused/.test(w.q('.lp-top').textContent), J(cancelled));
    w.inst.impl.onShow?.();
    check('...shown again while paused: still paused, nothing said', w.probe().paused && lines.length === 2 && w.timers.pending() === 0);
    w.bus.publish(MODULE_VERBS.lessons.play);
    check('*** Play: the same part, said again, and carrying on from there ***', !w.probe().paused && w.probe().at === 1 && lines.length === 3 && lines[2].text === 'One.'
      && w.timers.pending() === 1 && !/Paused/.test(w.q('.lp-top').textContent));
    w.done();
    // "A question waits": until it is answered, when a person chooses it.
    const w2 = mountLesson(fakeRow({ form: 'watch', askWait: 'answer', at: beatsOf(checkLesson(NUMBERS_0_9).lesson).findIndex((b) => b.beat.ask) }));
    check('*** "A question waits: until it is answered": in Watch, nothing counts while it waits ***', w2.timers.pending() === 0 && w2.probe().picked === null);
    w2.done();
  }

  section('SLIDES: a person moves it on');
  {
    const st = fakeRow({ form: 'slides', at: 0 });
    const s = mountLesson(st);
    check('nothing is armed: it waits for Next (this is the form for somebody at the screen)', s.timers.pending() === 0);
    check('Back is off on the first slide', s.q('[data-lp-act="back"]')?.disabled === true);
    s.q('[data-lp-act="next"]').click();
    check('Next: the next part, said', s.probe().at === 1 && s.said.at(-1) === 'One.');
    s.q('[data-lp-act="back"]').click();
    check('Back: the one before', s.probe().at === 0);
    const L = checkLesson(NUMBERS_0_9).lesson;
    const firstAsk = beatsOf(L).findIndex((b) => b.beat.ask);
    st.set({ form: 'slides', at: firstAsk }); s.inst.destroy();
    const s2 = mountLesson(st);
    check('(setup) it opens where it got to: the question', s2.probe().at === firstAsk);
    const btns = [...s2.box.querySelectorAll('.lp-ask button')];
    check('*** the answers are big buttons, pressable ***', btns.length === 3 && btns.every((b) => !b.disabled));
    btns.find((b) => b.dataset.lpAnswer === '2').click();
    check('*** a wrong answer: "Not quite: it is 3", with why ***', s2.probe().picked === '2' && /Not quite: it is 3/.test(s2.q('[data-lp-result="wrong"]')?.textContent || '') && /Count them/.test(s2.q('[data-lp-result]').textContent));
    s2.q('[data-lp-act="next"]').click();
    // The second question, answered right, by a SWITCH: next walks the buttons, select presses.
    const before = s2.probe().at;
    for (let i = 0; i < 6 && !(s2.box.querySelectorAll('.lp-ask button:not([disabled])').length); i += 1) s2.q('[data-lp-act="next"]').click();
    const right = beatsOf(L)[s2.probe().at].beat.ask.answer;
    const order = answersOf(beatsOf(L)[s2.probe().at].beat.ask);
    for (let i = 0; i <= order.indexOf(right); i += 1) s2.bus.publish('lesson/next');
    s2.bus.publish('lesson/select');
    check('*** a switch walks the answers and presses one: right, "Yes" ***', s2.probe().picked === right && s2.q('[data-lp-result="right"]'), `${before} ${s2.probe().at} ${s2.probe().picked}`);
    s2.done(); s.box.remove();
  }

  section('READ: all of it, as a page');
  {
    const r = mountLesson(fakeRow({ form: 'read' }));
    const text = r.q('[data-lp-read]')?.textContent || '';
    check('*** the whole lesson as a page: title, classes, what each part shows in words, the questions with answers ***',
      /Numbers 0 to 9/.test(text) && /Meet 5 to 9/.test(text) && /\[3 ducks\]/.test(text) && !/\[3 cups\]/.test(text) && /How many are there\? 3/.test(text) && /Questions to try/.test(text), text.slice(0, 200));
    check('nothing is said or armed in Read', r.said.length === 0 && r.timers.pending() === 0);
    r.done();
  }

  section('the look: grown-up or child');
  {
    const st = fakeRow({ form: 'read', look: 'child' });
    const r = mountLesson(st);
    check('*** a child\'s look counts ducks where a grown-up\'s counts cups - the same lesson ***', /\[3 ducks\]/.test(r.q('[data-lp-read]').textContent) && !/\[3 cups\]/.test(r.q('[data-lp-read]').textContent));
    st.set({ look: 'grownup' });
    check('changed in the menu: redrawn at once', /\[3 cups\]/.test(r.q('[data-lp-read]').textContent));
    r.done();
  }

  section('a lesson with problems: played if it can be, said if it cannot');
  check('the Read form of a cited lesson lists its sources as numbered notes', (() => {
    const L = checkLesson({ about: { title: 'T' }, sources: [{ id: 's1', title: 'A report', author: 'Repair group', date: '2024' }],
      classes: [{ title: 'One', beats: [{ say: 'A fact.', cite: ['s1'] }] }] }).lesson;
    const h = readHTML(L);
    return /<sup class="lp-fn">1<\/sup>/.test(h) && /Repair group, 2024/.test(h);
  })());
  section('*** the person\'s own lesson files: the Lessons folder (row 2.111, chat\'s note CJ item 3) ***');
  {
    const own = { about: { title: 'My street' }, sources: [{ id: 's1', title: 'The council', author: 'Town council', date: '2025' }],
      classes: [{ title: 'One', beats: [{ say: 'Our street.', show: { kind: 'heading', text: 'My street' } },
        { ask: { question: 'How old is the bridge?', answer: '100 years', wrong: ['10 years', '5 years'], why: 'It opened in 1925.' }, cite: ['s1'] }] }],
      questions: [{ question: 'Who mends the bridge?', answer: 'The council', wrong: ['Nobody'] }] };
    // The reader itself, on a fake folder: a lesson read, a broken file and a non-lesson skipped with why, nothing prompted.
    const file = (text) => ({ kind: 'file', getFile: async () => ({ size: text.length, text: async () => text }) });
    const dir = { entries: async function* entries() {
      yield ['my_street.json', file(JSON.stringify(own))]; yield ['broken.json', file('{ not json')];
      yield ['list.json', file('[1,2]')]; yield ['notes.txt', file('hello')]; yield ['huge.json', { kind: 'file', getFile: async () => ({ size: 9e9, text: async () => '' }) }];
    } };
    const read = await readLessonFolder({ find: async () => ({ dir, name: 'Nimrod/Lessons' }) });
    check('*** the reader: .json lesson files read, each checked; a file that is no lesson skipped, saying why ***',
      read.lessons.length === 1 && read.lessons[0].id === 'file:my_street.json' && read.lessons[0].label === 'My street' && read.lessons[0].sourcesChecked === false
        && J(read.skipped.map((s) => s.file).sort()) === J(['broken.json', 'huge.json', 'list.json']) && read.where === 'Nimrod/Lessons', J(read));
    check('...no Nimrod folder on this device (or its permission lapsed): no folder lessons, nothing asked', J((await readLessonFolder({ find: async () => ({ dir: null }) })).lessons) === '[]'
      && J((await readLessonFolder({ find: async () => { throw new Error('no'); } })).lessons) === '[]');
    check('the tree has a "Lessons" folder, with a README saying what goes there', SUBFOLDERS.lessons === 'Lessons' && /lesson files/.test(README.lessons) && FOLDER_KINDS.includes('lessons'));

    let resolveFolder;
    const folder = new Promise((r) => { resolveFolder = r; });
    const rowsBy = {};
    const makeState = (k) => (rowsBy[k] = rowsBy[k] || fakeRow({}));
    const f = mountLesson(fakeRow({ form: 'slides', lessonId: 'file:my_street.json' }), { readLessonFolder: () => folder, makeState });
    await new Promise((r) => setTimeout(r, 0));
    check('*** a lesson chosen from the folder waits for it (Numbers 0 to 9 is never played meanwhile) ***', f.probe().total === 0 && /Lessons folder/.test(f.box.textContent) && f.said.length === 0);
    resolveFolder(read);
    await new Promise((r) => setTimeout(r, 0));
    check('...then opens, its sources shown as not checked', f.probe().title === 'My street' && J(f.probe().files) === J(['file:my_street.json']) && f.probe().unchecked === true);
    check('"Which lesson" offers it, saying where it is from', f.inst.impl.settingsChoices().lessonId.some((o) => o.value === 'file:my_street.json' && /your Lessons folder/.test(o.label)));
    await new Promise((r) => setTimeout(r, 20));
    check('its questions do not go to the games: a device without the folder would write them back out (lessons_folder.js argues it)',
      !J(rowsBy[TRIVIA_LESSON_QUESTIONS]?.get() || {}).includes('Who mends the bridge'));
    f.q('[data-lp-act="next"]').click();
    check('*** an ask: Quiz mix\'s answer buttons; its source is not shown before the answer (a source can give it away) ***',
      f.box.querySelectorAll('.lp-ask .wg-btn[data-lp-answer]').length === 3 && !/Town council/.test(f.box.textContent));
    f.q('[data-lp-answer="100 years"]').click();
    const parts = [...f.box.querySelectorAll('[data-lp-result="right"] .qz-after [data-part]')].map((e) => e.dataset.part);
    check('*** ...answered: the after-answer screen every quiz draws (row 2.66): question, answer, why, source, in that order; no second Next ***',
      J(parts) === J(['question', 'answer', 'explain', 'source']) && f.q('.qz-after[data-after="celebrate"]')
        && /Town council, 2025/.test(f.q('[data-part="source"]').textContent) && /not checked/.test(f.q('[data-part="source"]').textContent)
        && f.box.querySelectorAll('[data-lp-act="next"]').length === 1, J(parts));
    f.done();
  }

  section('*** THE COURSES (chat\'s note CK 3): chosen like a lesson, a class at a time, the next one offered at the end ***');
  {
    const { COURSES } = await import('../lessons/courses_index.js');
    // (61 of chat's 63: two letters classes spell a person's name as their content, and wait for chat's neutral re-make.)
    check('seven courses, 61 classes, bundled with the site; the other side off by default for a beginner\'s course only',
      COURSES.length === 7 && COURSES.reduce((n, c) => n + c.classes.length, 0) === 61
        && COURSES.find((c) => c.id === 'numbers-0-9').otherSide === false && COURSES.find((c) => c.id === 'history-of-everything').otherSide === true);
    const st = fakeRow({ form: 'slides', lessonId: 'course:numbers-0-9' });
    const c = mountLesson(st);
    check('*** a course is offered under "Which lesson", saying it is a course ***', c.inst.impl.settingsChoices().lessonId.some((o) => o.value === 'course:numbers-0-9' && /a course: 9 classes/.test(o.label)));
    check('...its class is fetched when it is played: "Opening class 1..." meanwhile', /Opening class 1 of/.test(c.box.textContent) || c.probe().total > 0);
    const opened = async (fn, ms = 4000) => { const end = Date.now() + ms; while (Date.now() < end) { if (fn()) return true; await new Promise((r) => setTimeout(r, 30)); } return false; };
    check('*** class 1 opens and plays, its sources shown as not checked ***', await opened(() => c.probe().total > 10) && c.probe().title === 'One, two, three' && c.probe().unchecked === true,
      J({ total: c.probe().total, title: c.probe().title, problems: c.probe().problems.slice(0, 2) }));
    check('the bar names the class', /Class 1 ·/.test(c.q('.lp-top')?.textContent || ''));
    check('"Which class" lists the course\'s classes', J(c.inst.impl.settingsChoices().classN.map((o) => o.value)) === J([1, 2, 3, 4, 5, 6, 7, 8, 9]));
    let sawObjects = false;
    for (let i = 0; i < 200 && c.probe().at < c.probe().total; i += 1) { if (c.q('.lp-objects')) sawObjects = true; c.q('[data-lp-act="next"]').click(); }
    check('*** counted things are drawn as the course\'s objects (a dot with its name), not bare circles ***', sawObjects);
    check('*** the end of a class offers the next class, by name ***', !!c.q('[data-lp-act="nextclass"]') && /Next: class 2/.test(c.box.textContent) && /Next is class 2/.test(c.said.at(-1)));
    c.q('[data-lp-act="nextclass"]').click();
    check('*** "Next class": class 2, from its start, kept on the panel\'s row ***', await opened(() => c.probe().total > 5 && c.probe().at === 0 && /Class 2 ·/.test(c.q('.lp-top')?.textContent || ''))
      && st.get().classN === 2, J({ at: c.probe().at, classN: st.get().classN, top: c.q('.lp-top')?.textContent }));
    c.done();
    // The other side, on a history class: said in the second voice at the end, on by default there; off when chosen.
    const hs = fakeRow({ form: 'slides', lessonId: 'course:history-of-everything' });
    const h = mountLesson(hs);
    await opened(() => h.probe().total > 10);
    const total = h.probe().total;
    h.inst.impl.onShow?.();
    const lastBeats = [];
    for (let i = 0; i < 300 && h.probe().at < h.probe().total; i += 1) { if (h.probe().at >= total - 12) lastBeats.push(h.q('.lp-top')?.textContent || ''); h.q('[data-lp-act="next"]').click(); }
    check('*** a history class closes with "At the same time" and "The other side" (on by default for it) ***',
      lastBeats.some((t) => /At the same time/.test(t)) && lastBeats.some((t) => /The other side/.test(t)), J(lastBeats.slice(-4)));
    hs.set({ otherSide: 'off' });
    check('...the other side off: fewer parts, none of them the other side', h.probe().total < total, `${h.probe().total} < ${total}`);
    hs.set({ form: 'read', otherSide: 'on' });
    check('*** the Read form has both parts as sections ***', !!h.q('[data-lp-frames]') && !!h.q('[data-lp-other]'));
    h.done();
    // THE LEARNER'S NAME: the courses carry {name}, never a person's name; the panel fills it, or leaves it out.
    check('*** pure: "Hello {name}." is "Hello, Sam" with a name, and "Hello." without one ***',
      named('Hello {name}.', 'Sam') === 'Hello Sam.' && named('Hello {name}.') === 'Hello.' && named('Well done, {name}.') === 'Well done.'
        && named('Well done, {name}, and well done to everyone.', 'Sam') === 'Well done, Sam, and well done to everyone.'
        && named('Welcome back, {name}, and welcome to anyone joining us.') === 'Welcome back, and welcome to anyone joining us.',
      J([named('Hello {name}.'), named('Well done, {name}, and well done to everyone.')]));
    const ns = fakeRow({ form: 'slides', lessonId: 'course:counting-and-adding', learnerName: 'Sam' });
    const nm = mountLesson(ns);
    await opened(() => nm.probe().total > 5);
    check('*** a course greets the learner by the panel\'s name ***', /^Hello,? Sam\b/.test(nm.said[0] || ''), J(nm.said[0]));
    ns.set({ learnerName: '' });
    check('...with none, it greets nobody by name', !/\{name\}|Sam/.test(nm.said.at(-1) || '') && /^Hello\b/.test(nm.said.at(-1) || ''), J(nm.said.at(-1)));
    nm.done();
    // Nobody's name is in the site's own courses (CLAUDE.md: site copy never names the person it was first built for).
    let named0 = 0;
    for (const c of COURSES) for (const k of c.classes) if (/taylor|cici/i.test(await (await fetch(`../lessons/courses/${c.id}/${k.file}`)).text())) named0 += 1;
    check('*** no class bundled with the site names a person ***', named0 === 0 && !/taylor|cici/i.test(J(COURSES)), String(named0));
  }

  section('*** two voices (row 2.111): B\'s lines in the second voice, everything else in the person\'s own ***');
  {
    check('pure: A, the teacher and an unmarked line are the person\'s own voice (nothing passed)', voiceFor('a') === null && voiceFor('teacher') === null && voiceFor(null) === null);
    check('*** pure: B is the person\'s own voice, higher by default; lower; or a chosen voice ***',
      J(voiceFor('b', { uri: 'v1', pitch: 1, rate: 0.9 })) === J({ uri: 'v1', pitch: 1 + SECOND_VOICE_STEP, rate: 0.9 })
        && voiceFor('b', { pitch: 1 }, 'lower').pitch === 1 - SECOND_VOICE_STEP && voiceFor('b', { pitch: 1.9 }).pitch === 2
        && J(voiceFor('b', { uri: 'v1', pitch: 1 }, 'uri:v2')) === J({ uri: 'v2', pitch: 1 }));
    const twoVoice = await (await fetch('./lessons/right_to_repair_claude.json')).json();
    const said = [];
    const rows = { settings: fakeRow({ voice: { uri: 'mine', pitch: 1.1 } }) };
    const f = mountLesson(fakeRow({ form: 'slides', lessonId: 'file:two.json' }), {
      readLessonFolder: async () => ({ lessons: [{ id: 'file:two.json', label: 'Two', lesson: twoVoice, file: 'two.json', sourcesChecked: false, problems: [] }] }),
      makeState: (k) => (rows[k] = rows[k] || fakeRow({})),
      output: { say: (text, opts) => { said.push({ text, voice: opts?.data?.voice || null }); return said.length; }, cancel() {} } });
    await new Promise((r) => setTimeout(r, 20));
    const L = checkLesson(twoVoice).lesson;
    const order = beatsOf(L).map((b) => b.beat.say?.who || '');
    const firstB = order.indexOf('b'), firstA = order.indexOf('a');
    for (let i = 0; i < firstB; i += 1) f.q('[data-lp-act="next"]').click();
    const atB = said.at(-1);
    check('*** a B line: said in the person\'s voice, higher (their own voice id kept) ***', f.probe().at === firstB && atB?.voice?.uri === 'mine' && atB.voice.pitch === 1.5, J(atB));
    check('...and its caption is marked as the second voice', !!f.q('.lp-say[data-who="b"]'));
    while (f.probe().at > firstA) f.q('[data-lp-act="back"]').click();
    check('an A line: the person\'s own voice, nothing passed', said.at(-1)?.voice === null, J(said.at(-1)));
    check('"The second voice" offers higher and lower (and the browser\'s voices when it has them)',
      f.inst.impl.settingsChoices().secondVoice.slice(0, 2).map((o) => o.value).join() === 'higher,lower');
    f.done();
  }

  section('*** its questions go to the games (taken over from the old Lessons) ***');
  {
    const R = routedQuestions('both');
    // How many: every built-in lesson's review questions, as its check reads them (Right to repair joined in row 2.111).
    const ALL = BUILTIN_LESSONS.reduce((n, b) => n + (checkLesson(b.lesson).lesson?.questions.length || 0), 0);
    const labelOf = Object.fromEntries(BUILTIN_LESSONS.map((b) => [b.id, checkLesson(b.lesson).lesson.about.title]));
    check('every built-in lesson\'s review questions, each with its lesson as the topic and the title for the round\'s name',
      ALL > 3 && R.trivia.length === ALL && R.trivia.every((q) => labelOf[q.topic] === q.topicLabel && q.answer && q.wrong.length >= 1)
        && R.trivia.filter((q) => q.topic === 'numbers-0-9').length === 3 && R.trivia.some((q) => q.topic === 'right-to-repair'), J([ALL, R.trivia.length, R.trivia[0]]));
    check('to Trivia and Word Forge by default (as Mike ruled for the old Lessons)', LESSON_SETTINGS.find((f) => f.key === 'questionsTo').default === 'both' && R.wordforge.length === ALL);
    check('"Trivia only", "Word Forge only", "Neither"', routedQuestions('trivia').wordforge.length === 0 && routedQuestions('wordforge').trivia.length === 0
      && routedQuestions('none').trivia.length === 0 && routedQuestions('none').wordforge.length === 0);
    const rowsBy = {};
    const writes = [];
    const makeState = (k) => { if (!rowsBy[k]) { const r = fakeRow({}); const set = r.set; r.set = (p) => { writes.push(k); set(p); }; rowsBy[k] = r; } return rowsBy[k]; };
    const events = [];
    const makeEvents = () => ({ append: async (kind, data) => { events.push({ kind, data, created_at: 'now' }); }, load: async () => ({ events }),
      get: () => ({ events }), subscribe: () => () => {}, startPolling() {}, destroy() {} });
    const st = fakeRow({ form: 'slides' });
    const m = mountLesson(st, { makeState, makeEvents });
    await new Promise((r) => setTimeout(r, 20));
    check('*** mounted: Trivia\'s and Word Forge\'s rows hold the lessons\' questions ***',
      rowsBy[TRIVIA_LESSON_QUESTIONS]?.get().items?.length === ALL && rowsBy[WORDFORGE_LESSON_QUESTIONS]?.get().items?.length === ALL, J(Object.keys(rowsBy)));
    m.done();
    const before = writes.length;
    const m2 = mountLesson(fakeRow({ form: 'slides' }), { makeState, makeEvents });
    await new Promise((r) => setTimeout(r, 20));
    check('mounted again with nothing changed: not written again', writes.length === before, String(writes.length - before));
    check('nothing finished yet: nothing marked watched', events.length === 0);
    for (let i = 0; i < 200 && m2.probe().at < m2.probe().total; i++) m2.q('[data-lp-act="next"]')?.click();
    await new Promise((r) => setTimeout(r, 10));
    check('*** the end reached: the lesson is "watched" in the log Trivia and Word Forge gate by, under its title ***',
      events.length === 1 && events[0].kind === 'watched' && events[0].data.topic === 'numbers-0-9' && events[0].data.label === 'Numbers 0 to 9'
      && unlockedFrom(events).has('numbers-0-9'), J(events));
    m2.bus.publish('lesson/back');
    m2.bus.publish('lesson/select');
    await new Promise((r) => setTimeout(r, 10));
    check('reaching the end again in the same go is not a second entry', events.length === 1, String(events.length));
    m2.done();
    const m3 = mountLesson(fakeRow({ form: 'slides', questionsTo: 'none' }), { makeState, makeEvents });
    await new Promise((r) => setTimeout(r, 20));
    check('"Neither": the rows are emptied (a choice to stop is as real as one to send)',
      rowsBy[TRIVIA_LESSON_QUESTIONS].get().items.length === 0 && rowsBy[WORDFORGE_LESSON_QUESTIONS].get().items.length === 0);
    m3.done();
    const old = mountLesson(fakeRow({}), { type: 'lesson_player' });
    check('a panel saved under "lesson_player" plays the same lesson', old.probe().title === 'Numbers 0 to 9');
    old.done();
  }
  section('*** a Lineup\'s turn (row 2.108: Lessons replace Educational) ***');
  {
    const w = mountLesson(fakeRow({ form: 'watch' }));
    check('(setup) playing in Watch, counting to the next part', w.timers.pending() === 1);
    w.bus.publish('lessons/pause');
    check('*** the Lineup pauses it when its turn ends: nothing counting, nothing said ***', w.timers.pending() === 0);
    const at = w.probe().at;
    w.bus.publish('lessons/play');
    check('*** and plays it at its next turn, from where it was ***', w.timers.pending() === 1 && w.probe().at === at);
    w.done();
  }

  section('*** make a new lesson: the prompt drafted, the reply pasted or written here, checked, kept, played ***');
  {
    const GOOD = { about: { title: 'Right to repair', for: 'age 13' },
      sources: [{ id: 's1', title: 'A repair report', author: 'A group', date: '2024' }],
      classes: [{ title: 'Fixing your own stuff', minutes: 30, beats: [
        { say: 'Things break.', show: { kind: 'heading', text: 'Right to repair' } },
        { say: 'A fact about phones.', cite: ['s1'] }] }],
      questions: [{ question: 'What is right to repair?', answer: 'Fixing what you own', wrong: ['A shop', 'A phone'] }] };
    const rowsBy = {};
    const makeState = (k) => (rowsBy[k] || (rowsBy[k] = fakeRow({})));
    const st = fakeRow({ form: 'slides' });
    const m = mountLesson(st, { makeState });
    await new Promise((r) => setTimeout(r, 20));
    const items = m.inst.impl.menuItems();
    const mk = items.find((i) => i.id === 'lesson-make');
    check('the menu offers "Make a new lesson…", closing the menu (the maker opens over the lesson)', !!mk && mk.closesMenu === true && /Make a new lesson/.test(mk.label));
    check('no "Remove this lesson" for a built-in one', !items.some((i) => i.id === 'lesson-remove'));
    mk.run();
    check('*** it opens in the panel, and nothing is said or timed under it ***', m.probe().maker === 'make' && !!m.q('[data-lm-field="topic"]') && m.timers.pending() === 0);
    const topic = m.q('[data-lm-field="topic"]');
    topic.value = 'Right to repair'; topic.dispatchEvent(new Event('input', { bubbles: true }));
    const learner = m.q('[data-lm-field="learner"]');
    learner.value = 'age 13'; learner.dispatchEvent(new Event('input', { bubbles: true }));
    check('*** the prompt is drafted as they type (in place: the field keeps its place) ***',
      /Topic: Right to repair\./.test(m.q('[data-lm-prompt]').value) && /Learner: age 13\./.test(m.q('[data-lm-prompt]').value) && m.q('[data-lm-field="topic"]') === topic);
    const charts = m.q('[data-lm-part="charts"]');
    charts.checked = true; charts.dispatchEvent(new Event('change', { bubbles: true }));
    check('ticking Charts asks for charts', /Also return "charts"/.test(m.q('[data-lm-prompt]').value));
    const reply = m.q('[data-lm-reply]');
    reply.value = 'not a lesson at all'; reply.dispatchEvent(new Event('input', { bubbles: true }));
    m.q('[data-lm-act="keep"]').click();
    check('a reply with no lesson in it: said, nothing kept', /only the JSON/.test(m.q('[data-lm-problems]')?.textContent || '') && m.probe().made.length === 0);
    m.q('[data-lm-reply]').value = 'Here you go:\n```json\n' + JSON.stringify(GOOD) + '\n```';
    m.q('[data-lm-reply]').dispatchEvent(new Event('input', { bubbles: true }));
    m.q('[data-lm-act="keep"]').click();
    check('*** checked and kept: on the account, and playing here ***', m.probe().maker === 'kept' && m.probe().title === 'Right to repair'
      && J(m.probe().made) === J(['made-right-to-repair']) && rowsBy['lessons-made'].get().items?.[0]?.label === 'Right to repair' && st.get().lessonId === 'made-right-to-repair', J(m.probe()));
    check('*** kept as made, its sources NOT checked, and the screen says so ***', rowsBy['lessons-made'].get().items[0].made.sourcesChecked === false
      && /nothing here checked them/.test(m.box.textContent) && m.probe().unchecked === true);
    check('"Which lesson" offers it (marked made)', m.inst.impl.settingsChoices().lessonId.some((o) => o.value === 'made-right-to-repair' && /\(made\)/.test(o.label)));
    await new Promise((r) => setTimeout(r, 20));
    check('*** its review question is in the games\' rows, beside the built-in lessons\' ***',
      (rowsBy['lesson-questions-trivia'].get().items || []).some((q) => q.topic === 'made-right-to-repair' && q.answer === 'Fixing what you own')
        && (rowsBy['lesson-questions-trivia'].get().items || []).some((q) => q.topic === 'numbers-0-9'));
    m.q('[data-lm-act="close"]').click();
    check('"Play it": the lesson, from its start', m.probe().maker === null && m.probe().at === 0 && /Fixing your own stuff/.test(m.q('.lp-top')?.textContent || ''));
    m.q('[data-lp-act="next"]').click();
    check('*** a cited part says its source is as the AI gave it, not checked ***', /Source, as the AI gave it \(not checked\): A group, 2024/.test(m.q('.lp-cite')?.textContent || ''), m.q('.lp-cite')?.textContent);
    check('...and so does the Read form\'s list', /Sources, as the AI gave them \(not checked\)/.test(readHTML(checkLesson(GOOD).lesson, 'grownup', { unchecked: true })));
    const rm = m.inst.impl.menuItems().find((i) => i.id === 'lesson-remove');
    check('a made lesson can be removed (the menu names it)', !!rm && /Right to repair/.test(rm.hint));
    rm.run();
    check('removing asks first', m.probe().maker === 'remove' && !!m.q('[data-lm-act="remove-yes"]'));
    m.q('[data-lm-act="close"]').click();
    check('"Keep it": kept', m.probe().made.length === 1 && m.probe().title === 'Right to repair');
    m.inst.impl.menuItems().find((i) => i.id === 'lesson-remove').run();
    m.q('[data-lm-act="remove-yes"]').click();
    check('*** "Remove it": gone from the account, and the first lesson plays ***', m.probe().made.length === 0 && (rowsBy['lessons-made'].get().items || []).length === 0
      && m.probe().title === 'Numbers 0 to 9');
    m.done();

    // The AI on this computer (a stand-in for ai.js).
    const asked = [];
    const fakeAI = { chat: (messages, opts) => { asked.push({ messages, opts }); return Promise.resolve({ ok: true, model: 'fake-7b', text: JSON.stringify(GOOD) }); } };
    const c = mountLesson(fakeRow({ form: 'slides' }), { makeState: (k) => fakeRow({}), ai: fakeAI });
    c.inst.impl.menuItems()[0].run();
    c.q('[data-lm-act="computer"]').click();
    check('asked with no topic: it says to say what it is about first, and asks nothing', asked.length === 0 && /what the lesson is about/.test(c.q('[data-lm-status]').textContent));
    c.q('[data-lm-field="topic"]').value = 'Right to repair'; c.q('[data-lm-field="topic"]').dispatchEvent(new Event('input', { bubbles: true }));
    c.q('[data-lm-act="computer"]').click();
    await new Promise((r) => setTimeout(r, 20));
    check('*** asked with the prompt for a computer that cannot look things up, as JSON ***', asked.length === 1 && asked[0].opts.json === true
      && /you cannot look anything up/.test(asked[0].messages[0].content));
    check('*** its answer is checked and kept like a pasted one ***', c.probe().maker === 'kept' && c.probe().title === 'Right to repair');
    c.done();
    let aborted = false;
    const slowAI = { chat: (messages, opts) => new Promise((resolve) => { opts.signal?.addEventListener('abort', () => { aborted = true; resolve({ ok: false, cancelled: true }); }); }) };
    const s = mountLesson(fakeRow({ form: 'slides' }), { makeState: (k) => fakeRow({}), ai: slowAI });
    s.inst.impl.menuItems()[0].run();
    s.q('[data-lm-field="topic"]').value = 'Bees'; s.q('[data-lm-field="topic"]').dispatchEvent(new Event('input', { bubbles: true }));
    s.q('[data-lm-act="computer"]').click();
    check('while it writes: Cancel is on screen, Close too (nothing waits on anybody)', !!s.q('[data-lm-act="cancel"]') && !!s.q('[data-lm-act="close"]'));
    s.q('[data-lm-act="cancel"]').click();
    await new Promise((r) => setTimeout(r, 10));
    check('Cancel stops it, and says so', aborted && /Stopped/.test(s.q('[data-lm-status]').textContent));
    s.done();
  }
  check('names nobody', !/taylor|cici|her screen/i.test(document.getElementById('host').textContent));
} catch (err) {
  check('the suite ran to the end', false, String(err && err.stack || err));
}
document.getElementById('summary').textContent = failed ? `${failed} FAILED / ${passed} passed` : `ALL PASS - ${passed} checks`;
</script>
</body>
</html>
