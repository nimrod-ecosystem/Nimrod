<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimrod — search by name</title>
<link rel="icon" type="image/svg+xml" href="/design-assets/nimrod-mark-favicon.svg">
<link rel="stylesheet" href="./layers.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px}
  .sk-foot{max-width:40rem;margin:16px auto 0;font-size:.9rem;color:var(--text-muted)}
  .sk-foot a{color:var(--link)}
</style>
</head>
<body>
<!--
  YOUR OWN YOUTUBE AND SPOTIFY KEYS, so "Recommend a song or video" can search by name. Linked from that window's
  "Add a key". Its own page, like claude.html: one task, reached from a link. Colours come only from the theme
  (theme.js applyTheme), never from this file.
-->
<main id="root"></main>
<p class="sk-foot"><a href="/home.html">Home</a></p>
<script type="module">
  import { mountSearchKeys } from './search_keys.js';
  import { createProfilesClient, resolveTheme } from './profile.js';
  import { applyTheme, DEFAULT_THEME } from './theme.js';
  import { authHeaders } from './auth.js';

  applyTheme(document.documentElement, DEFAULT_THEME);
  (async () => {
    try {
      const me = await fetch('/api/me', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
      if (!me) return;
      const theme = await resolveTheme(createProfilesClient({ user: me.user }), me.user);
      if (theme) applyTheme(document.documentElement, theme);
    } catch { /* offline or signed out -- the default theme already stands */ }
  })();
  mountSearchKeys(document.getElementById('root'), { headers: () => authHeaders() });
</script>
</body>
</html>
