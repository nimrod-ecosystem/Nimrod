<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimrod — bedside</title>
<link rel="stylesheet" href="./modules.css">
<link rel="stylesheet" href="./settings.css">
<style>
  html,body{height:100%;margin:0;background:#07120d;color:var(--ink);
    font:16px/1.5 var(--font);overflow:hidden;transition:background .25s ease}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#cfe0d6;font-size:1.1rem;text-align:center;padding:24px}

  /* *** A PANEL SITS ON A CARD, WHICH IS THE SURFACE ITS MODULE WAS DRAWN AGAINST. ***
   *
   * THE DEFECT THIS FIXES (measured 2026-09-02, re-measured 2026-09-04 before touching it):
   * `html,body` below hardcodes a near-black `#07120d` and pairs it with `color:var(--ink)`.
   * `--ink` is a DARK colour in four of the five themes, so the kiosk was putting dark text on
   * near-black. 19 of 77 text elements failed WCAG in `default` at worst 1.37:1, 20 in `warm`
   * at 1.31, 22 in `forge` at 1.34 — and **worst of all 19 in `contrast`, the accessibility
   * theme, at 1.10:1.** Somebody who turns on High Contrast because they cannot read the screen
   * made it unreadable. `dusk` was the only clean theme, because it is the only one whose text
   * vars are light.
   *
   * WHY THIS FIX AND NOT THE OTHER TWO. Three were on the table.
   *
   *   1. Theme the body (`background:var(--bg)`). Restores the pair, but the kiosk's own chrome
   *      — the clock HUD, the control bar — is translucent white-on-dark with near-white text,
   *      and on a light `--bg` all of it disappears. It fixes the panels by breaking the frame.
   *   2. THIS ONE. Give the panel a `--card` surface. `--card` and `--ink` are defined as a
   *      matched pair in every theme, and every module was written to be read on a card — it is
   *      what the composer and `modules.html` already put them on. So each module renders
   *      exactly as designed, in all five themes, with no per-module colour changes anywhere.
   *   3. Move stage text to `--beige`. One line, but it only reaches text that INHERITS colour;
   *      `.clock .time` sets `var(--darkgreen)` itself and would stay unreadable. It treats the
   *      symptom the measurement happened to catch rather than the cause.
   *
   * AND THE FRAME STAYS DARK, which is not incidental. The gaps between panels remain the near
   * black below, so a screen somebody sleeps next to does not become a lit rectangle — the
   * panels get legible without the room getting brighter.
   *
   * NOT APPLIED TO THE HUD. `.k-clock` and `.k-mirror` are overlays on the dark frame, not
   * panels on it, and they already set their own colours against it. Scoped to `.k-stage` so
   * they are untouched. */
  .kiosk{position:fixed;inset:0}
  .k-stage .k-mod{background:var(--card);color:var(--ink);border-radius:14px;overflow:hidden}
  .k-stage{position:absolute;inset:0;padding:2.5vmin;display:flex}
  .k-stage.k-grid{display:grid;gap:2vmin}
  .k-stage.k-grid .k-cell{min-width:0;min-height:0;display:flex;overflow:hidden}
  .k-stage.k-grid .k-cell .k-mod{flex:1;min-width:0;display:flex;overflow:auto}
  .k-stage.k-grid .k-cell .k-mod > *{flex:1;min-width:0}
  .k-stage .k-mod{flex:1;min-width:0;display:flex}
  .k-stage .k-mod > *{flex:1;min-width:0}
  /* the camera "mirror" — pinned corner, always on top, never covered */
  /* the camera "mirror" — a HUD overlay; size + corner are per-profile settings */
  .k-mirror{position:absolute;aspect-ratio:4/3;z-index:5;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 24px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.18)}
  .k-mirror .k-mod{width:100%;height:100%}
  .kiosk[data-mirror-size="sm"] .k-mirror{width:18vw}
  .kiosk[data-mirror-size="md"] .k-mirror{width:24vw}
  .kiosk[data-mirror-size="lg"] .k-mirror{width:32vw}
  .kiosk[data-mirror-corner="tr"] .k-mirror{top:2.5vmin;right:2.5vmin}
  .kiosk[data-mirror-corner="tl"] .k-mirror{top:2.5vmin;left:2.5vmin}
  .kiosk[data-mirror-corner="br"] .k-mirror{bottom:2.5vmin;right:2.5vmin}
  .kiosk[data-mirror-corner="bl"] .k-mirror{bottom:2.5vmin;left:2.5vmin}
  /* translucent clock HUD — corner is a per-profile setting (default bottom-left) */
  .k-clock{position:absolute;z-index:6;padding:9px 15px;border-radius:12px;
    background:rgba(255,255,255,.14);color:#eef4f0;max-width:34vw}
  .kiosk[data-clock-corner="bl"] .k-clock{bottom:2.5vmin;left:2.5vmin}
  .kiosk[data-clock-corner="br"] .k-clock{bottom:2.5vmin;right:2.5vmin}
  .kiosk[data-clock-corner="tl"] .k-clock{top:2.5vmin;left:2.5vmin}
  .kiosk[data-clock-corner="tr"] .k-clock{top:2.5vmin;right:2.5vmin}
  .k-clock .k-mod{width:100%}
  .k-clock .clock{align-items:flex-start;gap:2px}
  .k-clock .clock .time{color:#fff;font-size:2.6rem}
  .k-clock .clock .when{display:none}
  .k-clock .clock .date{color:#d3e6db;font-size:.95rem}
  /* MIRROR MODE (M): the camera fills the whole screen */
  .kiosk.mirror-full .k-mirror{position:fixed;inset:0;width:auto;aspect-ratio:auto;
    border:0;border-radius:0;box-shadow:none;z-index:30}
  .kiosk.mirror-full .k-stage,.kiosk.mirror-full .k-clock{visibility:hidden}
  /* auto-hiding control bar */
  .k-controls{position:absolute;left:50%;bottom:2.2vmin;transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;background:rgba(7,18,13,.82);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;z-index:8;
    transition:opacity .3s ease}
  .k-controls.hidden{opacity:0;pointer-events:none}
  .k-mods{display:flex;gap:6px}
  .k-dot{font-size:.82rem;text-transform:capitalize;color:#cfe0d6;background:transparent;
    border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:6px 12px;cursor:pointer}
  .k-dot.on{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:700}
  .k-actions{display:flex;gap:8px;border-left:1px solid rgba(255,255,255,.15);padding-left:12px}
  .k-actions button{font-size:.82rem;color:#cfe0d6;background:transparent;
    border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:6px 12px;cursor:pointer}
  .k-actions button:hover,.k-dot:hover{background:rgba(255,255,255,.10)}
  /* Hush, while it is on. LIT, not subtle: silence with no visible cause reads as a broken
     screen, and whoever finds it that way has to be able to see why and undo it. */
  .k-actions button[data-on="1"]{background:var(--gold,#ffd36e);border-color:var(--gold,#ffd36e);
    color:#1a1408;font-weight:700}
  /* sign-in screen (shown when not authenticated) */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;color:#e8f0ea;text-align:center;padding:24px}
  #login h1{font-size:1.5rem;font-weight:600;margin:0;letter-spacing:.02em}
  #login p{color:#9fb3a8;margin:0;max-width:34ch}
  #login .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;
    border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer}
  #login .gbtn:hover{background:#f1f1f1}
  #login .err{color:#e79; font-size:.9rem}
</style>
</head>
<body>
<!-- NEUTRAL, AND IT HAS TO BE. This is painted before `whoami()` has answered, so it is
     the first thing a signed-out stranger sees after clicking "Try it" on the landing page —
     and "her dashboard" told them the screen belonged to somebody else before it had
     finished loading. There is nobody to be possessive about yet. -->
<div id="boot">Starting Nimrod…</div>
<div id="root"></div>

<script type="module">
import { createProfilesClient } from './profile.js';
import { cachedFetch } from './cache.js';
import { setDeviceKey, authHeaders } from './auth.js';
import { mountKiosk } from './kiosk.js';
import {
  createLocalBackend, createLocalMediaSources, seedStarterScreen,
} from './local_store.js';
import { pickFolder, listFolderSources, isFolderPickerSupported } from './folder_source.js';
import { mountDemoStrip, mountWayOut } from './demo_strip.js';

const params = new URLSearchParams(location.search);
// one-time device-key pairing (unattended-kiosk fallback): launch once with
// ?key=<secret> and the device stores it. Regular users just sign in with Google.
if (params.get('key')) setDeviceKey(params.get('key'));
const wantProfile = params.get('profile');
const boot = document.getElementById('boot');
const root = document.getElementById('root');
const LAST_USER = 'nimrod:lastUser';

// Who am I? A Google-login session cookie (sent automatically, same-origin) or a
// stored device key satisfies /api/me. 401 => signed out; a network error => offline
// (boot from cache using the last signed-in user so a server blip doesn't blank her).
async function whoami() {
  try {
    const r = await fetch('/api/me', { headers: authHeaders(params.get('user')) });
    if (r.status === 401) return { state: 'anon' };
    if (r.ok) {
      const u = (await r.json()).user;
      try { localStorage.setItem(LAST_USER, u); } catch { /* private mode */ }
      return { state: 'in', user: u };
    }
    return { state: 'error' };
  } catch {
    let u = null; try { u = localStorage.getItem(LAST_USER); } catch { /* noop */ }
    return u ? { state: 'in', user: u } : { state: 'error' };
  }
}

function showLogin(failed) {
  boot.remove();
  root.innerHTML =
    '<div id="login"><h1>Nimrod</h1><p>Sign in to open the dashboard.</p>' +
    '<button class="gbtn" id="gsi">Sign in with Google</button>' +
    (failed ? '<div class="err">Sign-in didn’t complete. Please try again.</div>' : '') +
    '</div>';
  document.getElementById('gsi').addEventListener('click', () => { location.href = '/auth/login'; });
}

// A starter profile so a fresh account "just works": photos, the camera mirror, the
// clock, and the Lineup director (rotates youtube / personal videos / educational).
async function ensureProfile(profiles, user) {
  let list = await cachedFetch('profiles:' + user, () => profiles.list());
  if (wantProfile) { const p = list.find((x) => x.id === wantProfile); if (p) return p.id; }
  if (!list.length) {
    const p = await profiles.create('Bedside');
    await profiles.addModule(p.id, 'photos');
    await profiles.addModule(p.id, 'camera');
    await profiles.addModule(p.id, 'clock');
    await profiles.addModule(p.id, 'director');
    return p.id;
  }
  return list[0].id;
}

// Signed out, the kiosk runs against browser storage instead of refusing to open. This is
// what makes "try it" the real product rather than a demo of it: the screen a stranger sees
// here is the same screen, mounting the same modules, and the only difference is where its
// handful of bytes are kept. Signing in becomes an upgrade, not a turnstile.
async function bootLocal() {
  const backend = createLocalBackend();
  await seedStarterScreen(backend.profiles, backend.makeSettings);
  const list = await backend.profiles.list();
  const wanted = wantProfile && list.find((p) => p.id === wantProfile);
  const profileId = (wanted || list[0]).id;
  await mountKiosk(root, {
    user: null,
    profileId,
    profiles: backend.profiles,
    makeState: backend.makeState,
    makeEvents: backend.makeEvents,
    // Photos needs SOMETHING to show a stranger, and asking for their folder before they
    // trust the site is a nonstarter — so the bundled samples stand in until they connect
    // a folder of their own.
    sources: createLocalMediaSources(),
  });
  boot.remove();
  offerTour();

  // THE ONLY PLACE THAT DECIDES A STRANGER IS LOOKING. `mountDemoStrip` renders when asked
  // and never decides for itself, so this branch — signed out, no device key — is the whole
  // guard. A paired bedside screen never reaches it.
  //
  // Reloading after a folder is picked is blunt, and it is the honest move: `photos`
  // auto-selects its source at mount, so the new folder has to exist before it mounts.
  // Re-mounting the kiosk in place would be a second boot path that only this one button
  // ever exercises, and a second boot path is how two boot paths drift apart.
  mountDemoStrip(document.body, {
    listFolders: listFolderSources,
    pick: pickFolder,
    supported: isFolderPickerSupported(),
    signedIn: false,
    onConnected: () => location.reload(),
  }).catch((e) => console.warn('demo strip', e));

  // *** AND A WAY OUT, WHICH THE STRIP IS NOT. ***
  //
  // The kiosk fills the screen and has no chrome. Signed out it is reached by a stranger
  // clicking "Try it", and the only exit used to be the "Sign in to keep this" link inside
  // the demo strip — which has a dismiss button. Dismiss it and the visitor is in a
  // full-screen app with nothing to press and no way back to the page they came from.
  //
  // That is the AGENTS.md safety invariant, not a UX gap: A SCREEN MUST NEVER ENTER A STATE
  // THAT ONLY AN INPUT CAN LEAVE, WHEN THE PERSON IN FRONT OF IT CANNOT GIVE THAT INPUT.
  // Here the person can press things and there was simply nothing to press.
  //
  // It is mounted from THIS branch, beside the strip, for the same reason the strip is: this
  // is the one place that knows a stranger is looking. A paired bedside screen never reaches
  // it, and must not — a permanent "leave" link on a real bedside screen is the failure
  // pointed the other way.
  mountWayOut(document.body);
}

// THE GUIDED TOUR, if one is in progress in this browser.
//
// *** UNLIKE THE DEMO STRIP AND THE WAY OUT, THIS IS CALLED FROM BOTH BOOT PATHS. *** Those two
// are signed-out-only because they are about a stranger; a tour is about somebody who asked for
// one, and a caregiver setting up their own account has as much right to be walked through the
// kiosk as a visitor does.
//
// What keeps it off a real bedside screen is not this branch, it is `tour.js` refusing to render
// until `startTour` has run in that browser — which only happens by pressing a button on the
// landing page. A paired Pi has never seen that page.
//
// THE CASE THAT IS NOT COVERED, said out loud rather than left implicit: somebody takes the tour
// on the very machine that later becomes a bedside screen, abandons it on a kiosk step, and the
// panel is still there. It is dismissable, it blocks nothing, and the page underneath stays
// live — so it is untidy rather than unsafe — but it is real, and the fix if it ever bites is a
// clear-on-pairing rather than another branch here.
function offerTour() {
  import('./tour.js').then(async ({ mountTour }) => {
    const { STEPS } = await import('./steps.js');
    mountTour(document.body, { steps: STEPS, path: '/kiosk.html' });
  }).catch((e) => console.warn('tour', e));
}

(async () => {
  const who = await whoami();
  // A FAILED sign-in still gets the login screen — someone who just tried to sign in needs
  // to be told it did not work, not quietly handed a local screen instead.
  if (who.state === 'anon' && params.get('login') === 'failed') { showLogin(true); return; }

  // *** `?demo=1` MEANS THE DEMO, NOT YOUR ACCOUNT. ***
  //
  // The landing page says "This is the actual software. Press play… these are sample photos and
  // the settings live in this browser instead of an account." That was true for a signed-out
  // stranger and false for everybody else: the frame loaded `/kiosk.html`, which took the
  // signed-in path and mounted whatever the account's first screen happened to be.
  //
  // Mike pressed play on his own landing page and got a black rectangle, because the first
  // screen on his account had had its modules removed. The marketing demo was showing him his
  // own half-built work and calling it the product.
  //
  // So the frame asks for the demo explicitly and gets the seeded starter screen over bundled
  // sample media — the same thing a stranger sees, which is the only thing that page should
  // ever be showing.
  if (params.get('demo') === '1') {
    try { await bootLocal(); } catch (e) {
      console.error('demo kiosk boot failed', e);
      boot.textContent = 'The demo could not start.';
    }
    return;
  }

  if (who.state === 'anon') {
    try { await bootLocal(); } catch (e) {
      console.error('local kiosk boot failed', e);
      showLogin(false);
    }
    return;
  }
  if (who.state === 'error') { boot.textContent = 'Connecting…'; setTimeout(() => location.reload(), 6000); return; }
  try {
    const profiles = createProfilesClient({ user: who.user });
    const profileId = await ensureProfile(profiles, who.user);
    await mountKiosk(root, { user: who.user, profileId, profiles });
    boot.remove();
    offerTour();
  } catch (e) {
    boot.textContent = 'Could not reach the dashboard server. It will retry when the connection returns.';
    console.error('kiosk boot failed', e);
  }
})();
</script>
</body>
</html>
