<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimrod — When a call can’t connect</title>
<link rel="icon" type="image/svg+xml" href="/design-assets/nimrod-mark-favicon.svg">
<link rel="stylesheet" href="./layers.css">
<style id="pn-style"></style>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px}
  .pn-foot{max-width:44rem;margin:24px auto 0;font-size:.9rem;color:var(--text-muted)}
  .pn-foot a{color:var(--link)}
</style>
<!-- (row 2.164, 2026-10-31) the look this page last settled on, painted before it is drawn (theme_boot.js) -->
<script src="theme_boot.js" data-theme-page="profile"></script>
</head>
<body>
<!--
  WHEN A CALL CAN'T CONNECT (chat's note CV, 2026-10-26; Mike's own-private-network ruling of 2026-09-08). Linked from a
  call that could not connect (call_page.js) and from the call page's own words. Works signed out. Its words are
  private_network.js privateNetworkHTML, so the suite reads what a visitor reads. Colours come only from the theme.
-->
<main id="root"></main>
<p class="pn-foot"><a href="/call.html">Back to calls</a> · <a href="/home.html">Your dashboards</a></p>
<script src="load_watch.js"></script>
<script type="module">
  import { mountPrivateNetworkPage, PRIVATE_NETWORK_STYLE } from './private_network.js';
  import { createProfilesClient, resolveTheme } from './profile.js';
  import { applyTheme, DEFAULT_THEME, holdPageTheme } from './theme.js';
  import { authHeaders } from './auth.js';

  // (row 2.164) Held until the signed-in theme is known, then painted once (theme.js `holdPageTheme`).
  const releaseTheme = holdPageTheme();
  applyTheme(document.documentElement, DEFAULT_THEME);
  document.getElementById('pn-style').textContent = PRIVATE_NETWORK_STYLE;
  (async () => {
    try {
      const me = await fetch('/api/me', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
      if (!me) return;
      const theme = await resolveTheme(createProfilesClient({ user: me.user }), me.user);
      if (theme) applyTheme(document.documentElement, theme);
    } catch { /* offline or signed out -- the default theme already stands */ }
    finally { releaseTheme(); }
  })();
  window.nimrodPrivateNetwork = mountPrivateNetworkPage(document.getElementById('root'));
</script>
</body>
</html>
